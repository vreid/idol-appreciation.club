name: Set up OpenTofu
description: |
  Runs tofu init against the S3 state backend on Managed Object Storage
  (state + lock live in the state bucket, credentials supplied per-run).
  The tofu binary itself comes from mise (run mise-action before this
  composite). Provider plugins are cached for speed only; STATE IS NEVER
  CACHED — Actions caches are readable by any PR, and the state file
  contains secrets (docs/infra.md). When `backend` is "true", the three
  state-* inputs are required and the init fails closed without them.

inputs:
  working-directory:
    description: Directory containing the tofu config.
    default: tofu
  backend:
    description: >-
      "true" initializes the real S3 state backend (needs the state-*
      inputs); "false" for stateless runs (no credentials, no state).
    default: "true"
  state-endpoint:
    description: S3 endpoint of the state bucket (secret TOFU_STATE_ENDPOINT).
    required: false
  state-access-key:
    description: State-bucket access key (secret TOFU_STATE_ACCESS_KEY).
    required: false
  state-secret-key:
    description: State-bucket secret key (secret TOFU_STATE_SECRET_KEY).
    required: false

runs:
  using: composite
  steps:
    # Provider plugin cache only. Never cache terraform.tfstate*: Actions
    # caches are readable by any pull request (including forks), and the
    # state file holds the managed-DB password and S3 keys.
    # Pinned by digest (issue #86) — the only mutable-ref style allowed.
    - name: Cache tofu provider plugins
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ${{ inputs.working-directory }}/.terraform
        key: tofu-plugins-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          tofu-plugins-${{ runner.os }}-

    - name: tofu init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [[ "${{ inputs.backend }}" == "true" ]]; then
          if [[ -z "${{ inputs.state-endpoint }}" || -z "${{ inputs.state-access-key }}" || -z "${{ inputs.state-secret-key }}" ]]; then
            echo "::error::backend=true requires state-endpoint/state-access-key/state-secret-key (secrets TOFU_STATE_ENDPOINT / TOFU_STATE_ACCESS_KEY / TOFU_STATE_SECRET_KEY)" >&2
            exit 1
          fi
          tofu init -input=false \
            -backend-config="endpoint=${{ inputs.state-endpoint }}" \
            -backend-config="access_key=${{ inputs.state-access-key }}" \
            -backend-config="secret_key=${{ inputs.state-secret-key }}"
        else
          tofu init -input=false -backend=false
        fi
