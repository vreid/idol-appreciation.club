name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  actionlint:
    name: jactionlint (workflow lint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: jactionlint over all workflows
        run: |
          curl -sSLf -o /tmp/jl.tar.gz \
            https://github.com/jdx/jactionlint/releases/download/v2.1.0/jactionlint_2.1.0_linux_amd64.tar.gz
          tar xzf /tmp/jl.tar.gz -C /tmp jactionlint
          /tmp/jactionlint .github/workflows/*.yml

  ready:
    name: owner readiness markers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.r.outputs.backend }}
      web: ${{ steps.r.outputs.web }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: r
        run: |
          echo "backend=$([ -f backend/.ci-ready ] && echo true || echo false)" \
            >> "$GITHUB_OUTPUT"
          echo "web=$([ -f web/.ci-ready ] && echo true || echo false)" \
            >> "$GITHUB_OUTPUT"

  tofu-fmt-validate:
    name: tofu fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
        with:
          tofu_version: 1.13.1
      - name: tofu fmt -check
        run: tofu fmt -check -recursive
        working-directory: tofu
      - name: tofu init (backend disabled)
        run: tofu init -backend=false -input=false
        working-directory: tofu
      - name: tofu validate
        run: tofu validate
        working-directory: tofu

  tofu-plan:
    name: tofu plan (PRs only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
        with:
          tofu_version: 1.13.1
      - name: tofu init (backend disabled)
        run: tofu init -backend=false -input=false
        working-directory: tofu
      # Plan without backend state: PRs get a full "would create" preview,
      # enough to catch config errors pre-merge. Real diffing happens in
      # infra-apply.
      - name: tofu plan
        run: tofu plan -input=false -no-color
        working-directory: tofu

  markdown-fmt:
    name: oxfmt markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # Gate covers every *.md in the repo (README, docs/, agents' notes);
      # config in .oxfmtrc.json, ignores in .oxfmtignore; version pinned for
      # stability until web's vp toolchain covers repo-root files.
      - name: oxfmt --check
        run: npx --yes oxfmt@0.72.0 --check "**/*.md"

  backend-ci:
    name: backend cargo gates
    needs: ready
    if: needs.ready.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install libvips
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvips-dev libwebp-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  web-ci:
    name: web vp gates
    needs: ready
    if: needs.ready.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
      - run: vp install
      # vp check = tsgo typecheck + oxlint + oxfmt; vp test = vitest with
      # coverage threshold (>=80% on src/lib, enforced by web/ config).
      - run: vp check
      - run: vp test
