name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Two-tier gate layout: tier 1 is the fast, parallel set (seconds each) —
# leaks hard gate, cheap linters, pr-title — and the `tier1` job aggregates
# it. Tier 2 (the container-minute jobs: backend/web lint+test, tofu plan)
# starts only after `tier1` is green AND only for components its paths
# touch (`changed` job: git diff vs the PR base / push parent; shared
# surfaces — Taskfile, mise.toml, workflows, contract/** — rebuild every
# component they can affect). Common failure classes fail the run in under
# a minute; a frontend-only PR never pays for backend clippy.
# Every tool job is checkout + mise + exactly one `task` invocation; the
# task recipes in Taskfile.yml are the single source of truth for how each
# gate runs (local and CI identical). Tool versions: mise.toml (+ node/pnpm
# from web/package.json devEngines). Backend gates run inside the pinned
# libvips 8.16.1 container via RUNNER=docker.

jobs:
  # What changed (drives tier-2 path filtering). One cheap git-diff job
  # instead of per-job filters; shared surfaces (Taskfile, mise, workflows,
  # contract) rebuild everything they can affect.
  changed:
    name: what changed (paths)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      web: ${{ steps.f.outputs.web }}
      tofu: ${{ steps.f.outputs.tofu }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: f
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && ! printf '%s' "${{ github.event.before }}" | grep -q '^0*$'; then
            base="${{ github.event.before }}"
          else
            echo "no diff base available; running the full matrix"
            {
              echo "backend=true"
              echo "web=true"
              echo "tofu=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$base" ${{ github.sha }})"
          echo "$files"
          pick() { if printf '%s\n' "$files" | grep -qE "$2"; then echo "$1=true" >> "$GITHUB_OUTPUT"; else echo "$1=false" >> "$GITHUB_OUTPUT"; fi; }
          pick backend '(^backend/|^contract/|^Taskfile\.yml$|^mise\.toml$|^\.github/workflows/)'
          pick web '(^web/|^contract/|^Taskfile\.yml$|^mise\.toml$|^\.github/workflows/)'
          pick tofu '(^tofu/|^\.github/workflows/)'

  # ---------------- tier 1: fast, parallel ----------------

  leaks:
    name: leaks (betterleaks hard gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # git-history scan needs the full history, not a shallow clone
          fetch-depth: 0
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: task leaks

  workflows-lint:
    name: workflows-lint (jactionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: task lint:workflows

  md-lint:
    name: md-lint (oxfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: task lint:md

  pr-title-lint:
    name: lint:pr-title (conventional commits)
    # PR-only: on push runs this job is skipped, which the tier1 gate and
    # ci-ok tolerate (skipped != failed) — every other tier-1 result must
    # be success.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: task lint:pr-title
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}

  helm-lint:
    name: helm-lint (lint+template+kubeconform)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: task helm:lint

  tofu:
    name: tofu fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: task tofu:ci

  tier1:
    name: tier1 gate (fast checks)
    needs:
      - leaks
      - workflows-lint
      - md-lint
      - pr-title-lint
      - helm-lint
      - tofu
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any tier-1 check failed (skips allowed — pr-title is PR-only)
        run: |
          failed=0
          for r in ${{ join(needs.*.result, ' ') }}; do
            case "$r" in
              success | skipped) ;;
              *) echo "tier-1 result: $r"; failed=1 ;;
            esac
          done
          exit $failed

  # ---------------- tier 2: slow, container minutes, path-filtered ----------------

  backend-checks:
    name: backend-checks (fmt+clippy+test, one container)
    needs: [changed, tier1]
    if: needs.changed.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUNNER: docker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      # fmt → clippy → cargo test, serial in ONE pinned-libvips container:
      # a single container start + cache restore + runner slot per PR, and
      # a clippy failure skips the test run (fail-fast, free time saved).
      # Same aggregate deploy.yml has always used.
      - run: task backend:ci

  web-lint:
    name: web-lint (vp check)
    needs: [changed, tier1]
    if: needs.changed.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: task web:lint

  lint:
    name: lint (all areas)
    needs: [changed, tier1, backend-checks, web-lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any lint failed (skips are path filters, not failures)
        run: |
          failed=0
          for r in ${{ join(needs.*.result, ' ') }}; do
            case "$r" in
              success | skipped) ;;
              *) echo "lint result: $r"; failed=1 ;;
            esac
          done
          exit $failed

  web-test:
    name: web-test (vp test)
    needs: [changed, tier1, lint]
    if: always() && needs.changed.outputs.web == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: task web:test

  tofu-plan:
    name: tofu plan (PRs only, tofu paths)
    needs: [changed, tier1]
    if: github.event_name == 'pull_request' && needs.changed.outputs.tofu == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: task tofu:plan

  web-contract:
    name: web-contract (real-backend contract suite)
    # Boots the pinned backend gate image + Postgres (RUNNER=docker, same
    # container convention as the backend gates) and parses every live
    # response/SSE event against contract/zod.
    needs: [changed, tier1, lint]
    if: always() && needs.changed.outputs.web == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUNNER: docker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: task web:contract

  # ---------------- merge gate: skips are path filters, failures block ----------------

  ci-ok:
    name: ci-ok (merge gate)
    needs:
      - tier1
      - lint
      - backend-checks
      - web-test
      - web-contract
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any gate failed (skipped = filtered by paths)
        run: |
          failed=0
          for r in ${{ join(needs.*.result, ' ') }}; do
            case "$r" in
              success | skipped) ;;
              *) echo "gate result: $r"; failed=1 ;;
            esac
          done
          exit $failed
