name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint over all workflows
        run: |
          curl -sSLf \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
          | tar xz -C /tmp actionlint
          /tmp/actionlint -color .github/workflows/*.yml

  ready:
    name: owner readiness markers
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.r.outputs.backend }}
      web: ${{ steps.r.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: |
          echo "backend=$([ -f backend/.ci-ready ] && echo true || echo false)" \
            >> "$GITHUB_OUTPUT"
          echo "web=$([ -f web/.ci-ready ] && echo true || echo false)" \
            >> "$GITHUB_OUTPUT"

  tofu-fmt-validate:
    name: tofu fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.1
      - name: tofu fmt -check
        run: tofu fmt -check -recursive
        working-directory: tofu
      - name: tofu init (backend disabled)
        run: tofu init -backend=false -input=false
        working-directory: tofu
      - name: tofu validate
        run: tofu validate
        working-directory: tofu

  tofu-plan:
    name: tofu plan (PRs only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.1
      - name: tofu init (backend disabled)
        run: tofu init -backend=false -input=false
        working-directory: tofu
      # Plan without backend state: PRs get a full "would create" preview,
      # enough to catch config errors pre-merge. Real diffing happens in
      # infra-apply.
      - name: tofu plan
        run: tofu plan -input=false -no-color
        working-directory: tofu

  markdown-fmt:
    name: prettier markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Gate covers every *.md in the repo (README, docs/, agents' notes);
      # ignores come from .prettierignore.
      - name: prettier --check
        run: npx --yes prettier --check "**/*.md"

  backend-ci:
    name: backend cargo gates
    needs: ready
    if: needs.ready.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  web-ci:
    name: web vp gates
    needs: ready
    if: needs.ready.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.2
      - run: vp install
      # vp check = tsgo typecheck + oxlint + oxfmt; vp test = vitest with
      # coverage threshold (>=80% on src/lib, enforced by web/ config).
      - run: vp check
      - run: vp test
