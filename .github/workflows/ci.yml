name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Every tool job is checkout + mise + exactly one `task` invocation; the
# task recipes in Taskfile.yml are the single source of truth for how each
# gate runs (local and CI identical). Tool versions: mise.toml (+ node/pnpm
# from web/package.json devEngines). Backend gates run inside the pinned
# libvips 8.16.1 container via RUNNER=docker.

jobs:
  ready:
    name: owner readiness markers
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.marks.outputs.backend }}
      web: ${{ steps.marks.outputs.web }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: marks
        run: |
          b=$([ -f backend/.ci-ready ] && echo true || echo false)
          w=$([ -f web/.ci-ready ] && echo true || echo false)
          echo "backend=$b" >> "$GITHUB_OUTPUT"
          echo "web=$w" >> "$GITHUB_OUTPUT"

  # ---------------- lint (fast, parallel, seconds each) ----------------

  workflows-lint:
    name: workflows-lint (jactionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: task lint:workflows

  md-lint:
    name: md-lint (oxfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: task lint:md

  backend-lint:
    name: backend-lint (fmt+clippy)
    needs: ready
    if: needs.ready.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNNER: docker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      # task backend:lint builds the pinned libvips 8.16.1 builder image
      # (backend/Dockerfile + rustfmt/clippy overlay) and runs fmt+clippy
      # inside it, so lint and test share the exact gate toolchain.
      - run: task backend:lint

  web-lint:
    name: web-lint (vp check)
    needs: ready
    if: needs.ready.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: task web:lint

  helm-lint:
    name: helm-lint (lint+template)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: task helm:lint

  leaks:
    name: leaks (betterleaks hard gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # git-history scan needs the full history, not a shallow clone
          fetch-depth: 0
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: task leaks

  lint:
    name: lint (all areas)
    needs: [md-lint, workflows-lint, backend-lint, web-lint, helm-lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any lint failed or was skipped
        run: |
          failed=0
          for r in ${{ join(needs.*.result, ' ') }}; do
            case "$r" in
              success) ;;
              *) echo "lint result: $r"; failed=1 ;;
            esac
          done
          exit $failed

  tofu:
    name: tofu fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: task tofu:ci

  tofu-plan:
    name: tofu plan (PRs only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: task tofu:plan

  # ---------------- test (needs lint counterpart) ----------------

  backend-test:
    name: backend-test (cargo test, pinned libvips image)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUNNER: docker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: task backend:test

  web-test:
    name: web-test (vp test)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: task web:test

  # ---------------- merge gate: skipped jobs fail here ----------------

  ci-ok:
    name: ci-ok (merge gate)
    needs:
      - ready
      - lint
      - tofu
      - backend-test
      - web-test
      - leaks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any gate failed or was skipped
        run: |
          failed=0
          for r in ${{ join(needs.*.result, ' ') }}; do
            case "$r" in
              success) ;;
              *) echo "gate result: $r"; failed=1 ;;
            esac
          done
          exit $failed
