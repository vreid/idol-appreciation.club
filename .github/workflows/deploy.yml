name: deploy

on:
  workflow_dispatch:
    inputs:
      semver:
        description: Release version (v-prefixed) to tag images with; empty = digest-only
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - images.lock.json
      - chart/**
      - scripts/sync-dns.sh
      - scripts/bootstrap-admin.sh
      - .github/workflows/deploy.yml
      - .github/actions/tofu-setup/**

concurrency:
  group: idol-stack
  cancel-in-progress: false

permissions:
  contents: read

# Deploy is a pure CONSUMER of images.lock.json (fed by images.yml): no
# build steps, no empty-digest states by construction, manual dispatches
# valid without a preceding build. Code merges deploy only when their
# image lands in the lock file; chart/script changes redeploy in place.
# Leak gating is inherited, not duplicated here: deploy only ever runs
# main, and every push to main passes the leaks-first ci.yml gate.
# tofu is decoupled on its own infra paths (infra-apply/destroy/recreate).

env:
  CLUSTER: idol-canvas

jobs:
  deploy:
    name: deploy to k8s
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write
      actions: write
    env:
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RELEASE_TAG: ${{ inputs.semver }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # mise first: the composite's tofu init needs tofu on PATH.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      # Restores the tofu local backend (state + plugins) from the Actions
      # cache and runs tofu init.
      - uses: ./.github/actions/tofu-setup

      - name: deploy to cluster (kubeconfig, helm, secrets, DNS)
        run: task deploy:k8s
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          UPCLOUD_API_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
          CLUSTER: ${{ env.CLUSTER }}

      - name: Dispatch e2e
        if: success()
        run: gh workflow run e2e --ref main
        env:
          GH_TOKEN: ${{ github.token }}
