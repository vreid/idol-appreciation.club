name: deploy

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - backend/**
      - web/**
      - deploy/**
      - scripts/sync-dns.sh

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/vreid/idol-appreciation.club-backend:main
  CLUSTER: idol-canvas
  INGRESS_NGINX_MANIFEST: https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.13.3/deploy/static/provider/cloud/deploy.yaml
  CERT_MANAGER_MANIFEST: https://github.com/cert-manager/cert-manager/releases/download/v1.19.1/cert-manager.yaml

jobs:
  backend-checks:
    name: backend cargo gates
    if: hashFiles('backend/Cargo.toml') != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test

  web-checks:
    name: web vp gates
    if: hashFiles('web/package.json') != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
      - name: vp install
        run: vp install
      - name: vp check
        run: vp check
      - name: vp test
        run: vp test

  build:
    name: build backend image
    # Owner gate: only once backend/.ci-ready is committed (implies a
    # working Dockerfile and passing cargo gates).
    if: hashFiles('backend/.ci-ready') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}

  deploy:
    name: deploy to k8s
    needs: [build]
    if: ${{ !failure() && !cancelled() }}
    environment: production
    runs-on: ubuntu-latest
    env:
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up tofu (reads outputs from state)
        uses: ./.github/actions/tofu-setup

      - uses: azure/setup-kubectl@v4

      - name: Fetch kubeconfig from UpCloud
        run: |
          set -euo pipefail
          uuid="$(curl -sS -H "Authorization: Bearer ${UPCLOUD_TOKEN}" \
            https://api.upcloud.com/1.3/kubernetes \
            | jq -r --arg c "$CLUSTER" '.[] | select(.name == $c) | .uuid')"
          test -n "$uuid" || { echo "cluster $CLUSTER not found" >&2; exit 1; }
          curl -sS -H "Authorization: Bearer ${UPCLOUD_TOKEN}" \
            "https://api.upcloud.com/1.3/kubernetes/${uuid}/kubeconfig" \
          | jq -r '.kubeconfig' > kubeconfig
          chmod 600 kubeconfig
          echo "KUBECONFIG=$PWD/kubeconfig" >> "$GITHUB_ENV"

      - name: Install / upgrade ingress-nginx
        run: |
          kubectl apply -f "$INGRESS_NGINX_MANIFEST"
          kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller \
            --timeout=300s
          # Essentials tier LoadBalancer (free); annotation drives the UpCloud CCM.
          kubectl -n ingress-nginx patch service ingress-nginx-controller \
            -p '{"metadata":{"annotations":{"service.beta.kubernetes.io/upcloud-load-balancer-config":"{\"plan\":\"essentials\"}"}}}' \
            --type=merge

      - name: Install / upgrade cert-manager
        run: |
          kubectl apply -f "$CERT_MANAGER_MANIFEST"
          for d in cert-manager cert-manager-webhook cert-manager-cainjector; do
            kubectl -n cert-manager rollout status "deployment/$d" --timeout=300s
          done

      - name: Settle tofu state (read-backed resources)
        working-directory: tofu
        run: tofu apply -auto-approve -refresh-only -input=false || true

      - name: Apply manifests
        run: |
          kubectl apply -f deploy/00-namespace.yaml
          kubectl apply -f deploy/30-issuer.yaml
          if [ -n "$(ls backend/.ci-ready 2>/dev/null || true)" ]; then
            kubectl apply -f deploy/10-backend.yaml
            kubectl apply -f deploy/20-ingress.yaml
          else
            echo "backend not .ci-ready: deploying bootstrap placeholder"
            kubectl apply -f deploy/placeholder.yaml
          fi

      - name: Create or update app-env secret
        working-directory: tofu
        run: |
          set -euo pipefail
          # s3_endpoint can lag service creation; refresh until it shows.
          ep=""
          for attempt in 1 2 3 4 5; do
            ep="$(tofu output -raw s3_endpoint 2>/dev/null || true)"
            [ -n "$ep" ] && [ "$ep" != "null" ] && break
            tofu apply -auto-approve -refresh-only -input=false || true
            sleep 20
          done
          [ -n "$ep" ] && [ "$ep" != "null" ] || {
            echo "warning: object storage endpoint not available yet; S3_ENDPOINT will be empty"
            ep=""
          }
          db="$(tofu output -raw app_database_uri)"
          test -n "$db" || { echo "app_database_uri missing" >&2; exit 1; }
          kubectl -n idol create secret generic app-env \
            --from-literal="DATABASE_URL=$db" \
            --from-literal="S3_ENDPOINT=$ep" \
            --from-literal="S3_BUCKET=$(tofu output -raw s3_bucket)" \
            --from-literal="S3_ACCESS_KEY_ID=$(tofu output -raw s3_access_key_id)" \
            --from-literal="S3_SECRET_ACCESS_KEY=$(tofu output -raw s3_secret_access_key)" \
            --from-literal="SESSION_SECRET=${SESSION_SECRET}" \
            --dry-run=client -o yaml | kubectl apply -f -
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Sync DNS to LoadBalancer IP
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            ips="$(kubectl -n ingress-nginx get svc ingress-nginx-controller \
              -o jsonpath='{.status.loadBalancer.ingress[*].ip}' || true)"
            test -n "$ips" && break
            sleep 10
          done
          test -n "${ips:-}" || { echo "LoadBalancer IP never assigned" >&2; exit 1; }
          ipv4="$(printf '%s\n' $ips | grep '\.' | head -1 || true)"
          ipv6="$(printf '%s\n' $ips | grep ':' | head -1 || true)"
          test -n "$ipv4" || { echo "no IPv4 address on LB" >&2; exit 1; }
          ./scripts/sync-dns.sh "$ipv4" $ipv6

      - name: Remove bootstrap placeholder and wait for backend
        if: hashFiles('backend/.ci-ready') != ''
        run: |
          kubectl delete -f deploy/placeholder.yaml --ignore-not-found=true
          kubectl -n idol rollout restart deployment/backend
          kubectl -n idol rollout status deployment/backend --timeout=300s
