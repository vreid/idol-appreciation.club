name: e2e

# NON-GATING by design: never a required check, never blocks merges.
# Runs after every successful deploy, nightly, and on demand.
on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  e2e:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      BASE_URL: https://idol-appreciation.club
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
      - run: vp install
      - run: npx playwright install --with-deps chromium
      # @smoke always runs; @full self-skips if /api/health is not green.
      - run: npx playwright test --config e2e/playwright.config.ts --grep @smoke
      - run: npx playwright test --config e2e/playwright.config.ts
      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-artifacts-${{ github.run_id }}
          path: |
            web/e2e-report/
            web/e2e-results/
          if-no-files-found: ignore
