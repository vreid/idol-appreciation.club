name: e2e

# NON-GATING by design: never a required check, never blocks merges.
# deploy.yml dispatches this on success (workflow_run would work but the
# lint flags it as a dangerous trigger); nightly + manual too.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://idol-appreciation.club
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      # task web:e2e installs chromium via playwright, then runs @smoke and
      # the full suite (playwright from node_modules/.bin — never npx).
      - run: task web:e2e
      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-artifacts-${{ github.run_id }}
          path: |
            web/e2e-report/
            web/e2e-results/
          if-no-files-found: ignore
