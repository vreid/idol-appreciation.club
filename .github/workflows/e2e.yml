name: e2e

# NON-GATING by design: never a required check, never blocks merges.
# deploy.yml dispatches this on success (workflow_run would work but the
# lint flags it as a dangerous trigger); nightly + manual too.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      BASE_URL: https://idol-appreciation.club
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
      - run: vp install
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      # @smoke always runs; @full self-skips if /api/health is not green.
      - run: ./node_modules/.bin/playwright test --config e2e/playwright.config.ts --grep @smoke
      - run: ./node_modules/.bin/playwright test --config e2e/playwright.config.ts
      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-artifacts-${{ github.run_id }}
          path: |
            web/e2e-report/
            web/e2e-results/
          if-no-files-found: ignore
