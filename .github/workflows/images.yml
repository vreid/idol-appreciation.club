name: images

on:
  push:
    branches: [main]
    # Rolling-guard trigger: src-touching commits that strict
    # conventional rules don't bump still get a fresh `main` image +
    # lock update. The lock PR merge itself touches only the lock file
    # and is excluded so it can't loop.
    paths:
      - "backend/**"
      - "web/**"
      - "caddy/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

# Version -> image is causal:
#   tag push (vX.Y.Z)  -> build from the tag's commit, tag images vX.Y.Z
#                         (+ digest), record in images.lock.json; a tag
#                         with no component drift aliases the current
#                         lock digests instead of building.
#   push to main (backend/** or web/**) -> build the `main` rolling tag,
#                         record in images.lock.json via auto-merge PR.
# deploy.yml consumes images.lock.json only; it builds nothing and never
# touches the registry.
#
# One build per tree: a release tag and the `main` push for the same commit
# fire concurrently, and a second merge can land before the first lock PR
# does. Each run waits for earlier images runs of its commit, then reuses
# any image (current `main` or the lock pin) whose build-context tree label
# matches instead of rebuilding it. Builds import/export the BuildKit layer
# cache via `<package>:buildcache` (cargo-chef dependency layer included).
jobs:
  images:
    name: build images (${{ startsWith(github.ref, 'refs/tags/') && 'release tag' || 'main rolling' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read # list earlier images runs of the same commit
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.backend.outputs.digest || steps.reuse.outputs.backend_digest }}
      backend-worker: ${{ steps.backend-worker.outputs.digest || steps.reuse.outputs.backendWorker_digest }}
      web: ${{ steps.web.outputs.digest || steps.reuse.outputs.web_digest }}
      caddy: ${{ steps.caddy.outputs.digest || steps.reuse.outputs.caddy_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # full history: the plan step diffs each component against its
          # last recorded build commit
          fetch-depth: 0
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        with:
          cache: false

      - name: mode and plan
        id: mode
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag=main
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          b_sha="$(jq -r '.backend.mergeSha // empty' images.lock.json)"
          bw_sha="$(jq -r '.backendWorker.mergeSha // empty' images.lock.json)"
          w_sha="$(jq -r '.web.mergeSha // empty' images.lock.json)"
          c_sha="$(jq -r '.caddy.mergeSha // empty' images.lock.json)"
          backend=false
          backendWorker=false
          web=false
          caddy=false
          if [ -z "$b_sha" ] || [ -n "$(git diff --name-only "$b_sha" HEAD -- backend)" ]; then
            backend=true
          fi
          if [ -z "$bw_sha" ] || [ -n "$(git diff --name-only "$bw_sha" HEAD -- backend)" ]; then
            backendWorker=true
          fi
          if [ -z "$w_sha" ] || [ -n "$(git diff --name-only "$w_sha" HEAD -- web)" ]; then
            web=true
          fi
          if [ -z "$c_sha" ] || [ -n "$(git diff --name-only "$c_sha" HEAD -- caddy)" ]; then
            caddy=true
          fi
          # shellcheck disable=SC2129
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "backendWorker=$backendWorker" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "caddy=$caddy" >> "$GITHUB_OUTPUT"
          echo "mode tag=$tag backend changed: $backend; backendWorker changed: $backendWorker; web changed: $web; caddy changed: $caddy"

      - name: docker login ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          cache-binary: false

      # Serialize runs of the same commit (tag push + main push): the
      # earliest run builds, later runs wait and then reuse its images.
      # Ordering by run id means no two runs ever wait on each other.
      # Best effort: an API error or the 15 min cap just stops waiting.
      - name: wait for earlier images runs of this commit
        if: steps.mode.outputs.backend == 'true' || steps.mode.outputs.backendWorker == 'true' || steps.mode.outputs.web == 'true' || steps.mode.outputs.caddy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            n="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/images.yml/runs?head_sha=${GITHUB_SHA}&per_page=50" \
              --jq "[.workflow_runs[] | select(.id < ${GITHUB_RUN_ID} and .status != \"completed\")] | length" \
              2>/dev/null || echo 0)"
            [ "$n" = "0" ] && break
            echo "waiting for $n earlier images run(s) of ${GITHUB_SHA:0:7} ($i/60)"
            sleep 15
          done

      # Reuse instead of rebuild: an image whose club.idol.build.tree label
      # equals this checkout's build-context tree was built from identical
      # inputs. Candidates: the current `main` image and the lock pin. Any
      # lookup failure means "not reusable" and falls through to a build.
      - name: reuse images already built from this tree
        id: reuse
        env:
          TAG: ${{ steps.mode.outputs.tag }}
          WANT_BACKEND: ${{ steps.mode.outputs.backend }}
          WANT_BACKEND_WORKER: ${{ steps.mode.outputs.backendWorker }}
          WANT_WEB: ${{ steps.mode.outputs.web }}
          WANT_CADDY: ${{ steps.mode.outputs.caddy }}
        run: |
          set -euo pipefail
          backend_tree="$(git rev-parse HEAD:backend)"
          # Same build tree as the API image but a DIFFERENT runtime stage:
          # the -worker suffix keeps the reuse label from matching the API
          # image (find_reusable compares the tree label verbatim).
          backend_worker_tree="$(git rev-parse HEAD:backend)-worker"
          web_tree="$(git rev-parse HEAD:web)-$(git rev-parse HEAD:contract)"
          caddy_tree="$(git rev-parse HEAD:caddy)"
          # shellcheck disable=SC2129
          echo "backend_tree=$backend_tree" >> "$GITHUB_OUTPUT"
          echo "backend_worker_tree=$backend_worker_tree" >> "$GITHUB_OUTPUT"
          echo "web_tree=$web_tree" >> "$GITHUB_OUTPUT"
          echo "caddy_tree=$caddy_tree" >> "$GITHUB_OUTPUT"
          repo_of() { # $1 = lock key; prints the GHCR repo suffix
            case "$1" in
              backendWorker) echo backend-worker ;;
              *) echo "$1" ;;
            esac
          }
          find_reusable() { # $1 = lock key, $2 = tree; prints a matching digest
            local repo="ghcr.io/vreid/idol-appreciation.club-$(repo_of "$1")" pin ref d label
            pin="$(jq -r ".$1.digest // empty" images.lock.json)"
            for ref in "$repo:main" ${pin:+"$repo@$pin"}; do
              d="$(crane digest "$ref" 2>/dev/null)" || continue
              label="$(crane config --platform linux/amd64 "$repo@$d" 2>/dev/null \
                | jq -r '.config.Labels["club.idol.build.tree"] // empty' 2>/dev/null)" || continue
              if [ -n "$label" ] && [ "$label" = "$2" ]; then echo "$d"; return 0; fi
            done
          }
          for pkg in backend backendWorker web caddy; do
            case "$pkg" in
              backend) want="$WANT_BACKEND" tree="$backend_tree" ;;
              backendWorker) want="$WANT_BACKEND_WORKER" tree="$backend_worker_tree" ;;
              web) want="$WANT_WEB" tree="$web_tree" ;;
              caddy) want="$WANT_CADDY" tree="$caddy_tree" ;;
            esac
            build=false
            if [ "$want" = "true" ]; then
              d="$(find_reusable "$pkg" "$tree" || true)"
              if [ -n "$d" ] && crane tag "ghcr.io/vreid/idol-appreciation.club-$pkg@$d" "$TAG"; then
                echo "${pkg}_digest=$d" >> "$GITHUB_OUTPUT"
                echo "$pkg: reused $d (tree ${tree:0:12}), tagged $TAG"
              else
                build=true
              fi
            fi
            echo "${pkg}_build=$build" >> "$GITHUB_OUTPUT"
          done

      - name: build and push backend image
        id: backend
        if: steps.reuse.outputs.backend_build == 'true'
        run: echo "digest=$(task image:backend | tail -1)" >> "$GITHUB_OUTPUT"
        env:
          BACKEND_IMAGE: ghcr.io/vreid/idol-appreciation.club-backend:${{ steps.mode.outputs.tag }}
          BUILD_CACHE_REF: ghcr.io/vreid/idol-appreciation.club-backend:buildcache
          BUILD_TREE: ${{ steps.reuse.outputs.backend_tree }}

      - name: build and push backend-worker image
        id: backend-worker
        if: steps.reuse.outputs.backendWorker_build == 'true'
        run: echo "digest=$(task image:backend-worker | tail -1)" >> "$GITHUB_OUTPUT"
        env:
          BACKEND_WORKER_IMAGE: ghcr.io/vreid/idol-appreciation.club-backend-worker:${{ steps.mode.outputs.tag }}
          BUILD_CACHE_REF: ghcr.io/vreid/idol-appreciation.club-backend-worker:buildcache
          BUILD_TREE: ${{ steps.reuse.outputs.backend_worker_tree }}

      - name: build and push web image
        id: web
        if: steps.reuse.outputs.web_build == 'true'
        run: echo "digest=$(task image:web | tail -1)" >> "$GITHUB_OUTPUT"
        env:
          WEB_IMAGE: ghcr.io/vreid/idol-appreciation.club-web:${{ steps.mode.outputs.tag }}
          BUILD_CACHE_REF: ghcr.io/vreid/idol-appreciation.club-web:buildcache
          BUILD_TREE: ${{ steps.reuse.outputs.web_tree }}

      - name: build and push caddy image
        id: caddy
        if: steps.reuse.outputs.caddy_build == 'true'
        run: echo "digest=$(task image:caddy | tail -1)" >> "$GITHUB_OUTPUT"
        env:
          CADDY_IMAGE: ghcr.io/vreid/idol-appreciation.club-caddy:${{ steps.mode.outputs.tag }}
          BUILD_CACHE_REF: ghcr.io/vreid/idol-appreciation.club-caddy:buildcache
          BUILD_TREE: ${{ steps.reuse.outputs.caddy_tree }}

      # Release tag with NO component drift: the version's images are the
      # current lock digests — alias them with the version tag so every
      # version resolves, without a pointless rebuild.
      - name: alias current digests with the version tag
        if: >-
          startsWith(github.ref, 'refs/tags/') &&
          steps.mode.outputs.backend == 'false' &&
          steps.mode.outputs.backendWorker == 'false' &&
          steps.mode.outputs.web == 'false' &&
          steps.mode.outputs.caddy == 'false'
        run: |
          set -euo pipefail
          tag="${{ steps.mode.outputs.tag }}"
          for pkg in backend backendWorker web caddy; do
            # A component without a lock entry yet (e.g. a tag cut before
            # its first build) has nothing to alias.
            d="$(jq -r ".${pkg}.digest // empty" images.lock.json)"
            [ -n "$d" ] || { echo "$pkg: no lock digest yet, skipping alias"; continue; }
            case "$pkg" in
              backendWorker) repo_suffix="backend-worker" ;;
              *) repo_suffix="$pkg" ;;
            esac
            crane tag "ghcr.io/vreid/idol-appreciation.club-$repo_suffix@$d" "$tag"
            echo "$pkg: aliased $tag -> $d"
          done

  prune:
    name: prune old GHCR version tags
    needs: [images]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        with:
          cache: false
      - name: prune
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: task image:prune

  lock:
    name: record digests (auto-merge PR)
    needs: [images]
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.images.outputs.backend != '' || needs.images.outputs['backend-worker'] != '' ||
       needs.images.outputs.web != '' || needs.images.outputs.caddy != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # the bot pushes its branch with the job-scoped GITHUB_TOKEN
          persist-credentials: true
      - name: update images.lock.json
        id: lockfile
        run: |
          set -euo pipefail
          b="${{ needs.images.outputs.backend }}"
          bw="${{ needs.images.outputs['backend-worker'] }}"
          w="${{ needs.images.outputs.web }}"
          c="${{ needs.images.outputs.caddy }}"
          sha="${{ github.sha }}"
          tmp="$(mktemp)"
          jq --arg b "$b" --arg bw "$bw" --arg w "$w" --arg c "$c" --arg sha "$sha" '
            if $b != "" then (.backend |= (. + {digest: $b, mergeSha: $sha})) else . end
            | if $bw != "" then (.backendWorker |= ((. // {}) + {digest: $bw, mergeSha: $sha})) else . end
            | if $w != "" then (.web |= (. + {digest: $w, mergeSha: $sha})) else . end
            | if $c != "" then (.caddy |= ((. // {}) + {digest: $c, mergeSha: $sha})) else . end
          ' images.lock.json > "$tmp"
          # never write a lock missing a digest the chart consumes
          jq -e '(.backend.digest | type == "string" and startswith("sha256:")) and
                 (.backendWorker.digest | type == "string" and startswith("sha256:")) and
                 (.web.digest | type == "string" and startswith("sha256:")) and
                 (.caddy.digest | type == "string" and startswith("sha256:"))' "$tmp" > /dev/null
          mv "$tmp" images.lock.json
          if git diff --quiet -- images.lock.json; then
            echo "lock unchanged; nothing to record"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git --no-pager diff -- images.lock.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: push branch and open/update auto-merge PR
        if: steps.lockfile.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # Another run already recorded exactly these digests in the open
          # lock PR (e.g. tag + main runs of one commit): re-pushing would
          # only restart that PR's checks. Keep it current with main and stop.
          if [ "$(gh pr view bot/image-versions --json state --jq .state 2>/dev/null || echo MISSING)" = "OPEN" ] \
            && git fetch --quiet origin bot/image-versions \
            && git show FETCH_HEAD:images.lock.json | cmp -s - images.lock.json; then
            echo "open lock PR already records these digests; not re-pushing"
            gh pr update-branch bot/image-versions || true
            exit 0
          fi
          git config user.name "idol-images-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bot/image-versions
          git add images.lock.json
          git commit -m "chore(images): update digests"
          git push --force origin HEAD:refs/heads/bot/image-versions
          body="$(mktemp)"
          {
            echo "Automated image digest update from run ${{ github.run_id }} (ref ${{ github.ref }})."
            echo
            echo '```'
            jq -r '"backend  \(.backend.digest)  \(.backend.mergeSha[0:7])", "worker   \(.backendWorker.digest)  \(.backendWorker.mergeSha[0:7])", "web      \(.web.digest)  \(.web.mergeSha[0:7])", "caddy    \(.caddy.digest)  \(.caddy.mergeSha[0:7])"' images.lock.json
            echo '```'
            echo
            echo "Squash-merges automatically once checks are green; the merge triggers deploy (images.lock.json consumer)."
          } > "$body"
          # Fail loudly if PR creation breaks (issue: GITHUB_TOKEN lacked
          # pull-requests:write and the `|| echo` here swallowed it, so
          # built digests never reached a PR). Only a genuinely existing
          # open PR is a benign skip.
          if [ "$(gh pr view bot/image-versions --json state --jq .state 2>/dev/null || echo MISSING)" = "OPEN" ]; then
            echo "PR for bot/image-versions already open; branch updated in place"
          else
            gh pr create --head bot/image-versions --base main \
              --title "chore(images): update digests" \
              --body-file "$body"
          fi
          # this gh has no `pr create --auto`; arm the auto-merge (and
          # satisfy strict up-to-date) separately
          gh pr update-branch bot/image-versions || true
          gh pr merge bot/image-versions --squash --auto
          # The workflow run this PR triggered starts `action_required`
          # (approval gate) even though its author has write access, so
          # checks never report and the armed auto-merge stalls. Approve
          # it as the same PAT identity: self-approval of a workflow run
          # is allowed for write-access users. Best effort — if no run
          # appears the gate simply never applied to it.
          head="$(git rev-parse HEAD)"
          for _ in 1 2 3 4 5 6; do
            ids="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${head}" \
              --jq '[.workflow_runs[] | select(.conclusion == "action_required") | .id] | join(" ")' \
              2>/dev/null || true)"
            [ -n "${ids}" ] && break
            sleep 5
          done
          if [ -n "${ids:-}" ]; then
            for id in ${ids}; do
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve"
              echo "approved workflow run ${id}"
            done
          else
            echo "no action_required run to approve for ${head}"
          fi
        # OMP_PAT when present: PRs created with the workflow's GITHUB_TOKEN
        # do not fire pull_request/push events, so the bot's lock PR never
        # gets checks and the auto-merge gate can never satisfy. A PAT
        # identity does fire them. Fall back to GITHUB_TOKEN when the
        # secret is absent (loud-failure semantics unchanged).
        env:
          GH_TOKEN: ${{ secrets.OMP_PAT || secrets.GITHUB_TOKEN }}
