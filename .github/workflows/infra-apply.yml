name: infra-apply

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tofu/**
      - .github/workflows/infra-apply.yml

concurrency:
  group: idol-stack
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: tofu apply
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # mise first: the composite's tofu init needs tofu on PATH.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      # Restores the tofu local backend (state + plugins) from the Actions
      # cache and runs tofu init.
      - uses: ./.github/actions/tofu-setup
      - name: tofu validate + apply
        run: task tofu:apply
      - name: Report non-sensitive outputs
        run: |
          {
            echo "### infra apply"
            echo "- cluster: $(tofu output -raw cluster_name)"
            echo "- zone: $(tofu output -raw cluster_zone)"
            echo "- node plan: $(tofu output -raw node_plan) x$(tofu output -raw node_count)"
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: tofu
      - name: Chain deploy (apply -> deploy, deterministic)
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
