name: infra-apply

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tofu/**
      - .github/workflows/infra-apply.yml

concurrency:
  group: idol-stack
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: tofu apply
    environment: production
    runs-on: ubuntu-latest
    # 90m: node-group replaces/creates on UpCloud drain+provision slowly
    # (the 2026-10-15 restore apply was killed by the old 30m cap mid-
    # operation, half-destroying the baseline group server-side).
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    env:
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # mise first: the composite's tofu init needs tofu on PATH.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      # Initializes the S3 state backend (Managed Object Storage); state
      # and its credentials never touch Actions caches.
      - uses: ./.github/actions/tofu-setup
        with:
          state-endpoint: ${{ secrets.TOFU_STATE_ENDPOINT }}
          state-access-key: ${{ secrets.TOFU_STATE_ACCESS_KEY }}
          state-secret-key: ${{ secrets.TOFU_STATE_SECRET_KEY }}
      # SEV 2026-10-15 consolidation (quorum-restored, Main-approved
      # ordering): the aborted 08:55 destroy left the `default` group as
      # a count-0 shell with both VMs terminating and a stuck server-side
      # op (PATCH count→3 rejected 500 repeatedly). Delete it
      # deliberately, then drop its tofu state object — its replacement
      # (baseline_capacity, "default-new") is already serving the DB
      # quorum. Renaming the group back to `default` is the phase-4-gated
      # #206 retune's identity step, not this one.
      - name: retire the stuck default group
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
        run: |
          set -euo pipefail
          uuid="$(curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            https://api.upcloud.com/1.3/kubernetes \
            | jq -r --arg c idol-canvas '.[] | select(.name == $c) | .uuid')"
          test -n "$uuid"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            "https://api.upcloud.com/1.3/kubernetes/$uuid/node-groups/default")"
          echo "DELETE node-groups/default -> HTTP $code (404 = already gone)"
          tofu -chdir=tofu state rm upcloud_kubernetes_node_group.this || true
      - name: tofu validate + apply
        run: task tofu:apply
      - name: Report non-sensitive outputs
        run: |
          {
            echo "### infra apply"
            echo "- cluster: $(tofu output -raw cluster_name)"
            echo "- zone: $(tofu output -raw cluster_zone)"
            echo "- node plan: $(tofu output -raw node_plan) x$(tofu output -raw node_count)"
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: tofu
      - name: Chain deploy (apply -> deploy, deterministic)
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
