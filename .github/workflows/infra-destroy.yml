name: infra-destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "destroy" to confirm tearing down the whole stack.
        required: true
        type: string

concurrency:
  group: idol-stack
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  destroy:
    name: tofu destroy
    if: inputs.confirm == 'destroy'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/tofu-setup
      - name: tofu destroy
        run: tofu destroy -auto-approve -input=false
        working-directory: tofu
      - name: Delete orphaned CCM load balancers
        if: always()
        run: |
          set -o pipefail
          # Destroying the cluster does not remove LBs the CCM provisioned
          # for LoadBalancer Services - they keep billing until deleted.
          set -e
          for lb in $(curl -s -H "Authorization: Bearer $UPCLOUD_TOKEN" \
              https://api.upcloud.com/1.3/load-balancer \
              | jq -r '.[] | select(.name | startswith("${{ env.CLUSTER }}")) | .uuid'); do
            echo "deleting LB $lb"
            curl -s -X DELETE -H "Authorization: Bearer $UPCLOUD_TOKEN" \
              "https://api.upcloud.com/1.3/load-balancer/$lb" -o /dev/null -w "%{http_code}\n"
          done
      - name: Summary
        run: echo "### infra destroyed (hourly billing stopped)" >> "$GITHUB_STEP_SUMMARY"
