name: infra-destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "destroy" to confirm tearing down the whole stack.
        required: true
        type: string

concurrency:
  group: idol-stack
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  destroy:
    name: tofu destroy
    if: inputs.confirm == 'destroy'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # Restores the tofu local backend (state + plugins) from the Actions
      # cache and runs tofu init; tofu itself comes from mise.
      - uses: ./.github/actions/tofu-setup
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      # task tofu:destroy defers the orphaned-LB cleanup so it still runs
      # (and stops the billing) when the destroy itself fails.
      - name: tofu destroy + LB cleanup
        run: task tofu:destroy
        env:
          CLUSTER: ${{ env.CLUSTER }}
      - name: Summary
        run: echo "### infra destroyed (hourly billing stopped)" >> "$GITHUB_STEP_SUMMARY"
