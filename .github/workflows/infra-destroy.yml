name: infra-destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "destroy" to confirm tearing down the whole stack.
        required: true
        type: string

concurrency:
  group: infra
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  destroy:
    name: tofu destroy
    if: inputs.confirm == 'destroy'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/tofu-setup
      - name: tofu destroy
        run: tofu destroy -auto-approve -input=false
        working-directory: tofu
      - name: Summary
        run: echo "### infra destroyed (hourly billing stopped)" >> "$GITHUB_STEP_SUMMARY"
