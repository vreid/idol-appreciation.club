name: infra-recreate

on:
  workflow_dispatch: {}

concurrency:
  group: idol-stack
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recreate:
    name: destroy then apply
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # mise first: the composite's tofu init needs tofu on PATH.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      # Restores the tofu local backend (state + plugins) from the Actions
      # cache and runs tofu init.
      - uses: ./.github/actions/tofu-setup
      # LB cleanup -> best-effort destroy -> apply (honest one-retry)
      - name: recreate stack
        run: task tofu:recreate
        env:
          CLUSTER: ${{ env.CLUSTER }}
      - name: Chain deploy (recreate -> deploy, deterministic)
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          {
            echo "### infra recreated"
            echo "- cluster: $(tofu output -raw cluster_name)"
            echo "- node plan: $(tofu output -raw node_plan) x$(tofu output -raw node_count)"
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: tofu
