name: infra-recreate

on:
  workflow_dispatch: {}

concurrency:
  group: idol-stack
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recreate:
    name: destroy then apply
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/tofu-setup
      - name: Delete orphaned CCM load balancers
        if: always()
        run: |
          set -o pipefail
          # Destroying the cluster does not remove LBs the CCM provisioned
          # for LoadBalancer Services - they keep billing until deleted.
          set -e
          for lb in $(curl -s -H "Authorization: Bearer $UPCLOUD_TOKEN" \
              https://api.upcloud.com/1.3/load-balancer \
              | jq -r '.[] | select(.name | startswith("${{ env.CLUSTER }}")) | .uuid'); do
            echo "deleting LB $lb"
            curl -s -X DELETE -H "Authorization: Bearer $UPCLOUD_TOKEN" \
              "https://api.upcloud.com/1.3/load-balancer/$lb" -o /dev/null -w "%{http_code}\n"
          done
      - name: tofu destroy (best effort)
        run: tofu destroy -auto-approve -input=false || true
        working-directory: tofu
      - name: tofu apply
        run: |
          tofu apply -auto-approve -input=false || \
            tofu apply -auto-approve -input=false
        working-directory: tofu
      - name: Chain deploy (recreate -> deploy, deterministic)
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          {
            echo "### infra recreated"
            echo "- cluster: $(tofu output -raw cluster_name)"
            echo "- node plan: $(tofu output -raw node_plan) x$(tofu output -raw node_count)"
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: tofu
