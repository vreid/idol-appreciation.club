name: ops

# Maintainer-run cluster operations (the repo keeps no static kubeconfig;
# this fetches one per run from UpCloud and never persists it). Dispatch
# requires repo write, every run leaves the script in the job log for
# audit, and the concurrency group serializes ops against each other.

on:
  workflow_dispatch:
    inputs:
      title:
        description: Short label for the audit log
        required: true
        type: string
      script:
        description: Bash script to run; KUBECONFIG is set, kubectl on PATH
        required: true
        type: string

concurrency:
  group: idol-ops
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLUSTER: idol-canvas

jobs:
  run:
    name: ${{ inputs.title }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
    steps:
      - name: Fetch kubeconfig from UpCloud
        run: |
          set -euo pipefail
          uuid="$(curl -sS -H "Authorization: Bearer ${UPCLOUD_TOKEN}" \
            https://api.upcloud.com/1.3/kubernetes \
            | jq -r --arg c "$CLUSTER" '.[] | select(.name == $c) | .uuid')"
          test -n "$uuid" || { echo "cluster $CLUSTER not found" >&2; exit 1; }
          curl -sS -H "Authorization: Bearer ${UPCLOUD_TOKEN}" \
            "https://api.upcloud.com/1.3/kubernetes/${uuid}/kubeconfig" \
          | jq -r '.kubeconfig' > kubeconfig
          chmod 600 kubeconfig
          echo "KUBECONFIG=$PWD/kubeconfig" >> "$GITHUB_ENV"

      - name: Run
        run: |
          set -euo pipefail
          cat > op.sh <<'OPS'
          ${{ inputs.script }}
          OPS
          bash op.sh
