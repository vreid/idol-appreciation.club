name: release

# Runs on every push to main: cuts the version TAG from conventional
# commits (TAG ONLY — no changelog file, no GitHub Release; git log IS
# the changelog). When a tag was cut, this job EXPLICITLY dispatches
# images.yml for that tag: a GITHUB_TOKEN tag push does not trigger
# `on: push: tags` workflows (GitHub recursion guard), so the dispatch
# — not the tag event — is the load-bearing chain into the image build.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the version tag
      actions: write # dispatch images.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # PAT checkout: the version tag is pushed with this credential,
          # and a PAT (unlike GITHUB_TOKEN) DOES trigger `on: push: tags`
          # workflows — that is the primary release->images chain. Falls
          # back to the job-scoped token + explicit dispatch below when
          # the secret is absent.
          token: ${{ secrets.OMP_PAT || github.token }}
          persist-credentials: true
          # version decision scans full commit history
          fetch-depth: 0
      # cache: false — release provenance must not depend on a potentially
      # poisoned tool cache (jactionlint cache-poisoning).
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        with:
          cache: false
      - name: cut version tag and dispatch image build
        env:
          GH_TOKEN: ${{ github.token }}
          OMP_PAT_SET: ${{ secrets.OMP_PAT != '' }}
        run: |
          set -euo pipefail
          before="$(git tag --list 'v*' --sort=-v:refname | head -1 || true)"
          task release
          git fetch origin 'refs/tags/v*:refs/tags/v*' --quiet
          after="$(git tag --list 'v*' --sort=-v:refname | head -1 || true)"
          if [ "$after" = "$before" ]; then
            echo "no release-worthy commits; no tag, no image build"
            exit 0
          fi
          if [ "$OMP_PAT_SET" = "true" ]; then
            echo "tag $after pushed with OMP_PAT; images.yml fires on the tag event"
          else
            echo "WARNING: OMP_PAT not set — token tag pushes do not trigger tag workflows; using explicit dispatch as fallback" >&2
            gh workflow run images.yml --ref "$after"
            echo "dispatched images.yml for $after"
          fi
