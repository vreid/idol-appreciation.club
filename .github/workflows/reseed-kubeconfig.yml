name: reseed-kubeconfig

# One-shot ops tool: fetch the managed-cluster kubeconfig (same Upcloud
# API call deploy.yml uses) and upload it as a run artifact so an
# operator can drive the reseed Job / emergency rollouts from a laptop.
# Dispatch-only, branch-scoped, artifact retention 1h. Never runs on
# push; the kubeconfig never lands in the repo or in logs.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reseed-kubeconfig
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # secrets (UPCLOUD_API_TOKEN) live on this environment since the
    # de-credentialing of PR runs — plain jobs see them empty.
    environment: production
    env:
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
      CLUSTER: idol-canvas
    steps:
      - name: fetch kubeconfig
        run: |
          set -euo pipefail
          uuid="$(curl -sS -H "Authorization: Bearer ${UPCLOUD_TOKEN}" \
            https://api.upcloud.com/1.3/kubernetes \
            | jq -r --arg c "$CLUSTER" '.[] | select(.name == $c) | .uuid')"
          test -n "$uuid" || { echo "cluster $CLUSTER not found" >&2; exit 1; }
          curl -sS -H "Authorization: Bearer ${UPCLOUD_TOKEN}" \
            "https://api.upcloud.com/1.3/kubernetes/${uuid}/kubeconfig" \
          | jq -r '.kubeconfig' > kubeconfig
          chmod 600 kubeconfig
          echo "fetched $(wc -c < kubeconfig) bytes"
      - uses: actions/upload-artifact@c7d193f32caacb5c6ea77c3f5ae6e40f4090fb01
        with:
          name: reseed-kubeconfig
          path: kubeconfig
          retention-days: 1
