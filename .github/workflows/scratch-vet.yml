# SCRATCH (phase 5 vetting, docs/scaling-architecture.md "Caddy, horizontally"):
# receipts for the CertMagic S3 storage decision. Deleted after the vet.
# 1. UpCloud plan list: does the 1xCPU/2GB worker plan exist for node groups?
# 2. Object storage conditional writes: the certmagic-s3 lock needs
#    If-None-Match: * / If-Match to be HONOURED (412/409), not ignored —
#    a store that accepts both racing writes makes the shared-storage
#    lock protect nothing (two replicas would renew concurrently).
# 3. Missing-key error shape: NoSuchKey vs bare 404 decides whether the
#    upstream module's Load()/Stat() find fs.ErrNotExist.
name: scratch-vet
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: idol-stack
  cancel-in-progress: false

jobs:
  plans:
    name: UpCloud plan list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: list plans
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "== server plans (1xCPU/2GB candidates) =="
          curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" https://api.upcloud.com/1.3/plan \
            | jq -r '.plans.plan[]? // .plans[]? // .[] | select((.name|tostring|test("1xCPU-2GB|2xCPU-4GB|4xCPU-8GB"))) | "\(.name): \(.core_number) CPU, \(.memory_amount) MB"'
          echo "== kubernetes control-plane plans =="
          curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" https://api.upcloud.com/1.3/kubernetes/plans | jq -c .

  s3-probes:
    name: object storage conditional-write probes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLUSTER: idol-canvas
      DOMAIN: idol-appreciation.club
    steps:
      # One-time quota cleanup already ran (38728759864, after=0). Never
      # delete keys from this workflow again: deploy's rotation owns the
      # live key; this is report-only receipts.
      - name: app access-key inventory (report only)
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
        run: |
          set -euo pipefail
          # Best-effort: the legacy users list has been flaky this
          # incident (its empty view caused the after=0 misread) and must
          # never block the receipts below it. The object-storage-2 mint
          # probe is the authoritative check.
          uid="$(curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            https://api.upcloud.com/1.3/objectstorage/users \
            | jq -r 'if type == "array" then (.[] | select(.username == "app") | .uuid) else (.users[]? | select(.username == "app") | .uuid) end' 2>/dev/null || true)"
          if [ -z "$uid" ]; then
            echo "legacy users list unusable — skipping detail (non-fatal)" | tee -a "$GITHUB_STEP_SUMMARY"
            : > /tmp/app-user-uuid
          else
            echo "app user uuid: $uid" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "$uid" > /tmp/app-user-uuid
            curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
              "https://api.upcloud.com/1.3/objectstorage/users/$uid" \
              | jq '{username, state, keys: [.access_keys[]? | {access_key_id, created_at, status}]}' \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      # SEV 2026-10-15: the aborted 08:55 group destroy left a server-side
      # operation holding 2/3 nodes cordoned (invisible to tofu state).
      # Capacity recovery went through the capacity-first `default-new`
      # group (38730423613 created it); the stuck `default` group is
      # retired by the gated #206 retune, not patched here. Report only.
      - name: node-group inventory (report only)
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
        run: |
          set -euo pipefail
          uuid="$(curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            https://api.upcloud.com/1.3/kubernetes \
            | jq -r --arg c "$CLUSTER" '.[] | select(.name == $c) | .uuid')"
          test -n "$uuid"
          echo "$uuid" > /tmp/cluster-uuid
          echo "## node groups" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            "https://api.upcloud.com/1.3/kubernetes/$uuid/node-groups" \
            | jq '{groups: [(if type == "array" then . else .node_groups end)[]? | {name, state, count, planned_count, node_states: [.nodes[]? | {name, state}]}]}' \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: kubeconfig + in-cluster probes
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
        run: |
          set -euo pipefail
          uuid="$(curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            https://api.upcloud.com/1.3/kubernetes \
            | jq -r --arg c "$CLUSTER" '.[] | select(.name == $c) | .uuid')"
          test -n "$uuid"
          curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            "https://api.upcloud.com/1.3/kubernetes/${uuid}/kubeconfig" \
            | jq -r '.kubeconfig' > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          # New nodes take minutes to register after the count restore;
          # the probe job cannot schedule onto an empty cluster.
          nodes_ready=0
          for attempt in $(seq 1 20); do
            nodes_ready="$(kubectl get nodes 2>/dev/null | grep -c ' Ready' || true)"
            [ "${nodes_ready:-0}" -ge 1 ] && break
            echo "no Ready node yet (attempt $attempt)"
            sleep 30
          done
          [ "${nodes_ready:-0}" -ge 1 ] \
            || { echo "no Ready node after 10m; probes need a node — check the node-group inventory above" >&2; exit 1; }
          kubectl get nodes | head -6
          # SEV 2026-10-15: #213's quota cleanup deleted every app key,
          # and the tofu provider's key reissue 400s (ERROR_INVALID_REQUEST,
          # run 38730423613) even with the slot free — while deploy:k8s
          # rotates through the CURRENT object-storage-2 endpoint. Probe
          # exactly that mint path (create -> signed verify -> delete) so
          # the dark deploy's rotation is proven before it runs. The probe
          # key never outlives this step.
          svc="$(curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            "https://api.upcloud.com/1.3/object-storage-2?limit=100" \
            | jq -r '(if type == "array" then . else (.services // []) end)[]? | select(.uuid == "127fbb4e-c649-46c4-9064-7cf1629b99b5") | .uuid')"
          test -n "$svc" || { echo "object-storage service 127fbb4e… not found in object-storage-2 list" >&2; exit 1; }
          mcode="$(curl -sS -o /tmp/mint.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            "https://api.upcloud.com/1.3/object-storage-2/$svc/users/app/access-keys")"
          echo "mint via object-storage-2: HTTP $mcode" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r 'if .secret_access_key then "minted access_key_id: \(.access_key_id) (secret withheld)" else "body: \(.)" end' /tmp/mint.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$mcode" != "201" ]; then
            # Compare with the legacy endpoint shape the tofu provider
            # exercises; its full error body is the UpCloud-ticket exhibit.
            uid="$(cat /tmp/app-user-uuid 2>/dev/null || true)"
            if [ -z "$uid" ]; then
              echo "legacy comparison skipped (no user uuid from the legacy list)" | tee -a "$GITHUB_STEP_SUMMARY"
            else
            lcode="$(curl -sS -o /tmp/mint-legacy.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $UPCLOUD_TOKEN" \
              -H "Content-Type: application/json" -d '{}' \
              "https://api.upcloud.com/1.3/objectstorage/users/$uid/access_keys")"
            echo "legacy objectstorage POST: HTTP $lcode"
            jq -c 'if .secret_access_key then {access_key_id} else . end' /tmp/mint-legacy.json \
              | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$lcode" = "201" ]; then
              lid="$(jq -r .access_key_id /tmp/mint-legacy.json)"
              echo "legacy mint WORKS - provider payload is the fault; cleaning up probe key $lid"
              curl -sS -o /dev/null -w 'legacy probe key cleanup: HTTP %{http_code}\n' -X DELETE \
                -H "Authorization: Bearer $UPCLOUD_TOKEN" \
                "https://api.upcloud.com/1.3/objectstorage/users/$uid/access_keys/$lid"
            fi
            fi
            exit 1
          fi
          sak="$(jq -r .access_key_id /tmp/mint.json)"
          ssk="$(jq -r .secret_access_key /tmp/mint.json)"
          oshost="$(kubectl -n idol get secret app-env -o jsonpath='{.data.S3_ENDPOINT}' 2>/dev/null | base64 -d | sed 's#https://##')"
          bucket="$(kubectl -n idol get secret app-env -o jsonpath='{.data.S3_BUCKET}' 2>/dev/null | base64 -d)"
          vcode="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            --aws-sigv4 'aws:amz:us-east-1:s3' -u "$sak:$ssk" \
            "https://$oshost/${bucket:-idol-canvas}?list-type=2&max-keys=1" || echo 000)"
          echo "minted-key signed list: HTTP $vcode" | tee -a "$GITHUB_STEP_SUMMARY"
          # The probe key stays alive until after the in-cluster probes:
          # app-env holds dead creds until the dark deploy rotates, and
          # the conditional-write verdicts must not inherit that noise.
          cleanup_probe_key() {
            curl -sS -o /dev/null -w 'probe key cleanup: HTTP %{http_code}\n' -X DELETE \
              -H "Authorization: Bearer $UPCLOUD_TOKEN" \
              "https://api.upcloud.com/1.3/object-storage-2/$svc/users/app/access-keys/$sak" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          }
          test "$vcode" = "200" || { cleanup_probe_key; echo "minted key failed live signed verify" >&2; exit 1; }
          # Probe runner with the FRESH minted creds, exactly what the
          # rotated app will hold. The whole script is single-quoted ON
          # PURPOSE: it must expand inside the pod, not on the runner.
          kubectl -n idol delete job s3-vet --ignore-not-found >/dev/null
          # shellcheck disable=SC2016
          # env must be on the pod template AT creation: a Job's
          # template is immutable after create (kubectl set env fails).
          kubectl -n idol create job s3-vet --image=curlimages/curl:8.16.0 \
            --dry-run=client -o json \
            -- /bin/sh -xc '
            P="https://$S3_ENDPOINT/$S3_BUCKET/caddy-vet-probe"
            code() { curl -s -o /tmp/body -w "%{http_code}" "$@"; }
            echo "PROBE bucket list: $(code --aws-sigv4 "aws:amz:us-east-1:s3" -u "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" "$P/?list-type=2&prefix=caddy-vet-probe/&max-keys=1")"
            echo "PROBE put-fresh if-none-match *: $(code -X PUT --data-binary one --aws-sigv4 "aws:amz:us-east-1:s3" -u "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" -H "If-None-Match: *" "$P/lock")"
            etag="$(curl -s -I --aws-sigv4 "aws:amz:us-east-1:s3" -u "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" "$P/lock" | tr -d "\r" | awk "tolower(\$1)==\"etag:\"{print \$2}")"
            echo "PROBE etag=$etag"
            echo "PROBE put-existing if-none-match * (MUST be 412/409 if honoured): $(code -X PUT --data-binary two --aws-sigv4 "aws:amz:us-east-1:s3" -u "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" -H "If-None-Match: *" "$P/lock")"
            echo "PROBE body after denied overwrite (must still be one): $(code --aws-sigv4 "aws:amz:us-east-1:s3" -u "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" "$P/lock") -> $(cat /tmp/body)"
            echo "PROBE put if-match WRONG etag (MUST be 412/409 if honoured): $(code -X PUT --data-binary three --aws-sigv4 "aws:amz:us-east-1:s3" -u "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" -H "If-Match: \"deadbeef\"" "$P/lock")"
            echo "PROBE put if-match correct etag: $(code -X PUT --data-binary four --aws-sigv4 "aws:amz:us-east-1:s3" -u "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" -H "If-Match: $etag" "$P/lock")"
            echo "PROBE get MISSING key body (NoSuchKey code?): $(code --aws-sigv4 "aws:amz:us-east-1:s3" -u "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" "$P/missing") -> $(cat /tmp/body)"
            echo "PROBE head MISSING key: $(code -I --aws-sigv4 "aws:amz:us-east-1:s3" -u "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" "$P/missing")"
            for k in $(curl -s --aws-sigv4 "aws:amz:us-east-1:s3" -u "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" "$P/?list-type=2" | sed -n "s/.*<Key>caddy-vet-probe\/\([^<]*\)<\/Key>.*/\1/p"); do
              echo "PROBE cleanup $k: $(code -X DELETE --aws-sigv4 "aws:amz:us-east-1:s3" -u "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" "$P/$k")"
            done
          ' \
            | jq --arg sak "$sak" --arg ssk "$ssk" --arg pep "https://$oshost" --arg bucket "${bucket:-idol-canvas}" \
              '.spec.template.spec.containers[0].env = [
                {name: "S3_ACCESS_KEY_ID", value: $sak},
                {name: "S3_SECRET_ACCESS_KEY", value: $ssk},
                {name: "S3_ENDPOINT", value: $pep},
                {name: "S3_BUCKET", value: $bucket}]' \
            | kubectl apply -f -
          kubectl -n idol wait --for=condition=complete job/s3-vet --timeout=420s \
            || { kubectl -n idol logs job/s3-vet || true; cleanup_probe_key; exit 1; }
          kubectl -n idol logs job/s3-vet
          cleanup_probe_key
      - name: restore verification (nodes, workloads, db, health)
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
        run: |
          set -euo pipefail
          uuid="$(cat /tmp/cluster-uuid)"
          curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            "https://api.upcloud.com/1.3/kubernetes/${uuid}/kubeconfig" \
            | jq -r '.kubeconfig' > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          # Give a just-PATCHed group time to join a node before judging.
          for i in $(seq 1 30); do
            n_ready="$(kubectl get nodes -o json | jq '[.items[] | select(.status.conditions[] | select(.type == "Ready" and .status == "True"))] | length')"
            unsched="$(kubectl get nodes -o json | jq '[.items[] | select(.spec.unschedulable == true)] | length')"
            echo "nodes ready=$n_ready unschedulable=$unsched (poll $i)"
            [ "$n_ready" = "3" ] && [ "$unsched" = "0" ] && break
            sleep 30
          done
          kubectl get nodes -o wide | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$n_ready" = "3" ] && [ "$unsched" = "0" ]
          echo "## workloads" | tee -a "$GITHUB_STEP_SUMMARY"
          kubectl -n idol get deploy -o wide | tee -a "$GITHUB_STEP_SUMMARY"
          kubectl -n idol rollout status deploy/backend --timeout=600s
          kubectl -n idol rollout status deploy/web --timeout=600s
          echo "## database quorum" | tee -a "$GITHUB_STEP_SUMMARY"
          kubectl -n idol get clusters.postgresql.cnpg.io -o json | jq -r '.items[] | "\(.metadata.name): instances=\(.status.instances // "?") ready=\(.status.readyInstances // "?") phase=\(.status.phase // "?")"' | tee -a "$GITHUB_STEP_SUMMARY"
          ready="$(kubectl -n idol get clusters.postgresql.cnpg.io idol-db -o jsonpath='{.status.readyInstances}')"
          [ "$ready" = "3" ]
          echo "## api health" | tee -a "$GITHUB_STEP_SUMMARY"
          ok=0
          for i in 1 2 3 4 5; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://$DOMAIN/api/health")"
            echo "attempt $i: /api/health -> $code" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$code" = "200" ] && ok=1 && break
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            # External health failed while in-cluster pieces look fine:
            # the edge (web deployment runs Caddy) is the suspect. Its
            # certmagic/ACME errors decide TLS-vs-LB-vs-S3 instantly.
            echo "## web (caddy) logs — external health failed" | tee -a "$GITHUB_STEP_SUMMARY"
            kubectl -n idol logs deploy/web --all-containers --tail=80 2>&1 | tail -120 | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi
          [ "$ok" = "1" ]
          kubectl -n idol delete job s3-vet --ignore-not-found >/dev/null
