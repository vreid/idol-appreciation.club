# SCRATCH (phase 5 vetting, docs/scaling-architecture.md "Caddy, horizontally"):
# receipts for the CertMagic S3 storage decision. Deleted after the vet.
# 1. UpCloud plan list: does the 1xCPU/2GB worker plan exist for node groups?
# 2. Object storage conditional writes: the certmagic-s3 lock needs
#    If-None-Match: * / If-Match to be HONOURED (412/409), not ignored —
#    a store that accepts both racing writes makes the shared-storage
#    lock protect nothing (two replicas would renew concurrently).
# 3. Missing-key error shape: NoSuchKey vs bare 404 decides whether the
#    upstream module's Load()/Stat() find fs.ErrNotExist.
name: scratch-vet
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: idol-stack
  cancel-in-progress: false

jobs:
  plans:
    name: UpCloud plan list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: list plans
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "== server plans (1xCPU/2GB candidates) =="
          curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" https://api.upcloud.com/1.3/plan \
            | jq -r '.plans.plan[]? // .plans[]? // .[] | select((.name|tostring|test("1xCPU-2GB|2xCPU-4GB|4xCPU-8GB"))) | "\(.name): \(.core_number) CPU, \(.memory_amount) MB"'
          echo "== kubernetes control-plane plans =="
          curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" https://api.upcloud.com/1.3/kubernetes/plans | jq -c .

  s3-probes:
    name: object storage conditional-write probes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLUSTER: idol-canvas
      DOMAIN: idol-appreciation.club
    steps:
      # SEV 2026-10-15 precondition: the object-storage `app` user sits at
      # its 2-key quota with orphan keys, so tofu's key reissue (state
      # drift) and deploy's rotation both 400. Free the slot first; the
      # infra-apply then owns exactly one fresh key.
      - name: free app access-key quota
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
        run: |
          set -euo pipefail
          uid="$(curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            https://api.upcloud.com/1.3/objectstorage/users \
            | jq -r '.[] | select(.username == "app") | .uuid')"
          test -n "$uid" && echo "app user uuid: $uid"
          before="$(curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            "https://api.upcloud.com/1.3/objectstorage/users/$uid" \
            | jq -r '.access_keys | length')"
          echo "keys before: $before"
          if [ "$before" != "0" ]; then
            for kid in $(curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
              "https://api.upcloud.com/1.3/objectstorage/users/$uid" \
              | jq -r '.access_keys[].access_key_id'); do
              code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                -H "Authorization: Bearer $UPCLOUD_TOKEN" \
                "https://api.upcloud.com/1.3/objectstorage/users/$uid/access_keys/$kid")"
              echo "delete $kid -> HTTP $code"
            done
          fi
          after="$(curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            "https://api.upcloud.com/1.3/objectstorage/users/$uid" \
            | jq -r '.access_keys | length')"
          echo "keys after: $after"
          [ "$after" = "0" ]
      # SEV 2026-10-15: the aborted 08:55 group destroy left a server-side
      # operation holding 2/3 nodes cordoned (invisible to tofu state).
      # Diagnose the group, restore the count to the documented baseline
      # if the platform shrank it, and report node operation state.
      - name: node-group state + count restore
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
        run: |
          set -euo pipefail
          uuid="$(curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            https://api.upcloud.com/1.3/kubernetes \
            | jq -r --arg c "$CLUSTER" '.[] | select(.name == $c) | .uuid')"
          test -n "$uuid"
          echo "$uuid" > /tmp/cluster-uuid
          echo "## default group state" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            "https://api.upcloud.com/1.3/kubernetes/$uuid/node-groups/default" \
            | tee /tmp/group.json | jq -r '{count, planned_count, state, node_states: [.nodes[]? | {name, state, status}]}' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          count="$(jq -r '.count // .node_groups[0].count // empty' /tmp/group.json)"
          echo "live count: ${count:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$count" ] && [ "$count" -lt 3 ]; then
            # The PATCH 500s while the group is mid-operation (nodes
            # terminating => state "pending"): retry until it settles.
            code=000
            for attempt in 1 2 3 4 5 6; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH \
                -H "Authorization: Bearer $UPCLOUD_TOKEN" \
                -H "Content-Type: application/json" \
                -d '{"count": 3}' \
                "https://api.upcloud.com/1.3/kubernetes/$uuid/node-groups/default")"
              echo "PATCH count->3 attempt $attempt: HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
              case "$code" in 2??) break;; esac
              sleep 60
            done
            case "$code" in
              2??) ;;
              *) echo "node-group count restore FAILED (last HTTP $code); refusing to probe a nodeless cluster" >&2; exit 1;;
            esac
          fi
      - name: kubeconfig + in-cluster probes
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
        run: |
          set -euo pipefail
          uuid="$(curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            https://api.upcloud.com/1.3/kubernetes \
            | jq -r --arg c "$CLUSTER" '.[] | select(.name == $c) | .uuid')"
          test -n "$uuid"
          curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            "https://api.upcloud.com/1.3/kubernetes/${uuid}/kubeconfig" \
            | jq -r '.kubeconfig' > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          # New nodes take minutes to register after the count restore;
          # the probe job cannot schedule onto an empty cluster.
          nodes_ready=0
          for attempt in $(seq 1 20); do
            nodes_ready="$(kubectl get nodes 2>/dev/null | grep -c ' Ready' || true)"
            [ "${nodes_ready:-0}" -ge 1 ] && break
            echo "no Ready node yet (attempt $attempt)"
            sleep 30
          done
          [ "${nodes_ready:-0}" -ge 1 ] \
            || { echo "no Ready node after 10m; probes need a node — check the count restore above" >&2; exit 1; }
          kubectl get nodes | head -6
          # Probe runner: uses the LIVE app-env S3 creds (same ones caddy
          # would use). curl --aws-sigv4, exactly like the deploy probe.
          # The whole script is single-quoted ON PURPOSE: it must expand
          # inside the pod, not on the runner.
          kubectl -n idol delete job s3-vet --ignore-not-found >/dev/null
          # shellcheck disable=SC2016
          # envFrom must be on the pod template AT creation: a Job's
          # template is immutable after create (kubectl set env fails).
          kubectl -n idol create job s3-vet --image=curlimages/curl:8.16.0 \
            --dry-run=client -o json \
            -- /bin/sh -xc '
            P="https://$S3_ENDPOINT/$S3_BUCKET/caddy-vet-probe"
            code() { curl -s -o /tmp/body -w "%{http_code}" "$@"; }
            echo "PROBE bucket list: $(code --aws-sigv4 "aws:amz:us-east-1:s3" -u "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" "$P/?list-type=2&prefix=caddy-vet-probe/&max-keys=1")"
            echo "PROBE put-fresh if-none-match *: $(code -X PUT --data-binary one --aws-sigv4 "aws:amz:us-east-1:s3" -u "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" -H "If-None-Match: *" "$P/lock")"
            etag="$(curl -s -I --aws-sigv4 "aws:amz:us-east-1:s3" -u "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" "$P/lock" | tr -d "\r" | awk "tolower(\$1)==\"etag:\"{print \$2}")"
            echo "PROBE etag=$etag"
            echo "PROBE put-existing if-none-match * (MUST be 412/409 if honoured): $(code -X PUT --data-binary two --aws-sigv4 "aws:amz:us-east-1:s3" -u "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" -H "If-None-Match: *" "$P/lock")"
            echo "PROBE body after denied overwrite (must still be one): $(code --aws-sigv4 "aws:amz:us-east-1:s3" -u "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" "$P/lock") -> $(cat /tmp/body)"
            echo "PROBE put if-match WRONG etag (MUST be 412/409 if honoured): $(code -X PUT --data-binary three --aws-sigv4 "aws:amz:us-east-1:s3" -u "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" -H "If-Match: \"deadbeef\"" "$P/lock")"
            echo "PROBE put if-match correct etag: $(code -X PUT --data-binary four --aws-sigv4 "aws:amz:us-east-1:s3" -u "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" -H "If-Match: $etag" "$P/lock")"
            echo "PROBE get MISSING key body (NoSuchKey code?): $(code --aws-sigv4 "aws:amz:us-east-1:s3" -u "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" "$P/missing") -> $(cat /tmp/body)"
            echo "PROBE head MISSING key: $(code -I --aws-sigv4 "aws:amz:us-east-1:s3" -u "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" "$P/missing")"
            for k in $(curl -s --aws-sigv4 "aws:amz:us-east-1:s3" -u "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" "$P/?list-type=2" | sed -n "s/.*<Key>caddy-vet-probe\/\([^<]*\)<\/Key>.*/\1/p"); do
              echo "PROBE cleanup $k: $(code -X DELETE --aws-sigv4 "aws:amz:us-east-1:s3" -u "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" "$P/$k")"
            done
          ' \
            | jq '.spec.template.spec.containers[0].envFrom = [{"secretRef": {"name": "app-env"}}]' \
            | kubectl apply -f -
          kubectl -n idol wait --for=condition=complete job/s3-vet --timeout=420s \
            || { kubectl -n idol logs job/s3-vet || true; exit 1; }
          kubectl -n idol logs job/s3-vet
      - name: restore verification (nodes, workloads, db, health)
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
        run: |
          set -euo pipefail
          uuid="$(cat /tmp/cluster-uuid)"
          curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            "https://api.upcloud.com/1.3/kubernetes/${uuid}/kubeconfig" \
            | jq -r '.kubeconfig' > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          # Give a just-PATCHed group time to join a node before judging.
          for i in $(seq 1 30); do
            n_ready="$(kubectl get nodes -o json | jq '[.items[] | select(.status.conditions[] | select(.type == "Ready" and .status == "True"))] | length')"
            unsched="$(kubectl get nodes -o json | jq '[.items[] | select(.spec.unschedulable == true)] | length')"
            echo "nodes ready=$n_ready unschedulable=$unsched (poll $i)"
            [ "$n_ready" = "3" ] && [ "$unsched" = "0" ] && break
            sleep 30
          done
          kubectl get nodes -o wide | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$n_ready" = "3" ] && [ "$unsched" = "0" ]
          echo "## workloads" | tee -a "$GITHUB_STEP_SUMMARY"
          kubectl -n idol get deploy -o wide | tee -a "$GITHUB_STEP_SUMMARY"
          kubectl -n idol rollout status deploy/backend --timeout=600s
          kubectl -n idol rollout status deploy/web --timeout=600s
          echo "## database quorum" | tee -a "$GITHUB_STEP_SUMMARY"
          kubectl -n idol get clusters.postgresql.cnpg.io -o json | jq -r '.items[] | "\(.metadata.name): instances=\(.status.instances // "?") ready=\(.status.readyInstances // "?") phase=\(.status.phase // "?")"' | tee -a "$GITHUB_STEP_SUMMARY"
          ready="$(kubectl -n idol get clusters.postgresql.cnpg.io idol-db -o jsonpath='{.status.readyInstances}')"
          [ "$ready" = "3" ]
          echo "## api health" | tee -a "$GITHUB_STEP_SUMMARY"
          ok=0
          for i in 1 2 3 4 5; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://$DOMAIN/api/health")"
            echo "attempt $i: /api/health -> $code" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$code" = "200" ] && ok=1 && break
            sleep 15
          done
          [ "$ok" = "1" ]
          kubectl -n idol delete job s3-vet --ignore-not-found >/dev/null
