# One-off: free the object-storage `app` user's access-key quota so the
# SEV-restore infra-apply can reissue the state-tracked key (its key
# drifted away upstream; state plans a create, API is at 2/2 keys).
# 2026-10-15, dispatched by --ref on fix/tofu-verify; removed after.
name: sev-key-cleanup
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
    steps:
      - name: list + delete app access keys (free the 2/2 quota)
        run: |
          set -euo pipefail
          uid="$(curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            https://api.upcloud.com/1.3/objectstorage/users \
            | jq -r '.[] | select(.username == "app") | .uuid')"
          test -n "$uid" && echo "app user uuid: $uid"
          echo "## keys before" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            "https://api.upcloud.com/1.3/objectstorage/users/$uid" \
            | jq -r '.access_keys[] | .access_key_id + "  created=" + (.created_at // "?")' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          for kid in $(curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            "https://api.upcloud.com/1.3/objectstorage/users/$uid" \
            | jq -r '.access_keys[].access_key_id'); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $UPCLOUD_TOKEN" \
              "https://api.upcloud.com/1.3/objectstorage/users/$uid/access_keys/$kid")"
            echo "delete $kid -> HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo "## keys after" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            "https://api.upcloud.com/1.3/objectstorage/users/$uid" \
            | jq -r '.access_keys | length' | tee -a "$GITHUB_STEP_SUMMARY"
