# One-off SEV-restore verification (2026-10-15, dispatched by --ref on the
# fix/tofu-verify branch; removed once receipts are collected).
name: sev-restore-verify
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_API_TOKEN }}
      CLUSTER: idol-canvas
      DOMAIN: idol-appreciation.club
    steps:
      - name: kubeconfig + restore probes
        run: |
          set -euo pipefail
          uuid="$(curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            https://api.upcloud.com/1.3/kubernetes \
            | jq -r --arg c "$CLUSTER" '.[] | select(.name == $c) | .uuid')"
          test -n "$uuid"
          curl -sS -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            "https://api.upcloud.com/1.3/kubernetes/${uuid}/kubeconfig" \
            | jq -r '.kubeconfig' > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          echo "## nodes" | tee -a "$GITHUB_STEP_SUMMARY"
          kubectl get nodes -o wide | tee -a "$GITHUB_STEP_SUMMARY"
          n_ready="$(kubectl get nodes -o json | jq '[.items[] | select(.status.conditions[] | select(.type == "Ready" and .status == "True"))] | length')"
          unsched="$(kubectl get nodes -o json | jq '[.items[] | select(.spec.unschedulable == true)] | length')"
          echo "ready_nodes=$n_ready unschedulable=$unsched" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$n_ready" = "3" ] && [ "$unsched" = "0" ]
          echo "## workloads" | tee -a "$GITHUB_STEP_SUMMARY"
          kubectl -n idol get deploy -o wide | tee -a "$GITHUB_STEP_SUMMARY"
          kubectl -n idol rollout status deploy/backend --timeout=300s
          kubectl -n idol rollout status deploy/web --timeout=300s
          echo "## database quorum" | tee -a "$GITHUB_STEP_SUMMARY"
          kubectl -n idol get cnpg -o json | jq -r '.items[] | "\(.metadata.name): instances=\(.status.instances // "?") ready=\(.status.readyInstances // "?") phase=\(.status.phase // "?")"' | tee -a "$GITHUB_STEP_SUMMARY"
          ready="$(kubectl -n idol get cnpg idol-db -o jsonpath='{.status.readyInstances}')"
          echo "cnpg_ready=$ready" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$ready" = "3" ]
          echo "## api health" | tee -a "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://$DOMAIN/api/health")"
            echo "attempt $i: /api/health -> $code" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$code" = "200" ] && ok=1 && break
            sleep 10
          done
          [ "${ok:-0}" = "1" ]
          echo "## edge (web deploy carries the caddy sidecar)" | tee -a "$GITHUB_STEP_SUMMARY"
          kubectl -n idol get pods -l app=web -o wide | tee -a "$GITHUB_STEP_SUMMARY"
