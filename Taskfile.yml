version: '3'

# Local entrypoints for every CI job in .github/workflows/ci.yml.
# Tool versions come from mise.toml (node/pnpm from web/package.json
# devEngines) — run `mise install` first; see docs/dev.md.

vars:
  # Container runner for backend gates. podman by default (local dev);
  # override with RUNNER=docker where only docker exists (CI runners).
  RUNNER: '{{.RUNNER | default "podman"}}'
  IMAGE: '{{.IMAGE | default "backend-builder"}}'
  # TEMPORARY: mirrors the skip in ci.yml backend-test (webp buffer encode
  # fails in the gate image only; backend agent is debugging). Drop it here
  # and in ci.yml when the fix lands.
  BACKEND_TEST_ARGS: '--skip derivative_bytes_are_deterministic'

tasks:
  # ---------------- lint ----------------

  lint:md:
    desc: oxfmt check over all Markdown (ci.yml md-lint)
    cmds:
      - oxfmt --check "**/*.md"

  lint:pr-title:
    desc: enforce Conventional Commits v1.0.0 PR title (ci.yml lint:pr-title)
    cmds:
      - |
        set -euo pipefail
        title="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .title)"
        # Conventional Commits 1.0.0: <type>(<scope>)?!: <subject>
        # - type: the eleven spec types (angular lineage)
        # - scope: repo areas, optional
        # - ! marks breaking (major bump)
        # - subject: required, no leading/trailing whitespace; no trailing
        #   period (checked separately so single-character subjects pass)
        cc='^(feat|fix|perf|refactor|docs|chore|test|ci|build|style)(\((backend|web|tofu|chart|ci|deps|release|api|seed|docs|infra|images)\))?(!)?: [^[:space:]](.*[^[:space:]])?$'
        if ! printf '%s\n' "$title" | grep -qE "$cc"; then
          echo "PR title is not strict Conventional Commits: \"$title\"" >&2
          echo 'expected: <type>(<scope>)?!: <subject>' >&2
          echo '  types:  feat|fix|perf|refactor|docs|chore|test|ci|build|style' >&2
          echo '  scopes: backend|web|tofu|chart|ci|deps|release|api|seed|docs|infra|images (optional)' >&2
          echo '  subject: non-empty, no trailing period, no trailing whitespace' >&2
          exit 1
        fi
        case "$title" in
          *.) echo "PR title subject must not end with a period: \"$title\"" >&2; exit 1 ;;
        esac

  release:
    desc: semantic-release — tag + GitHub Release + notes from conventional commits (no npm publish)
    cmds:
      # ARGS escapes hatch: task release ARGS="--dry-run"
      - semantic-release {{.ARGS}}

  lint:workflows:
    desc: jactionlint over all workflows (ci.yml workflows-lint)
    cmds:
      - jactionlint .github/workflows/*.yml

  web:lint:
    desc: vp check (oxfmt + oxlint + tsgo type check) (ci.yml web-lint)
    dir: web
    deps: [web:install, contract:install]
    cmds:
      - pnpm exec vp check

  helm:lint:
    desc: helm lint + template, with and without web (ci.yml helm-lint)
    cmds:
      - helm version
      - helm lint chart
      - helm template chart > /dev/null
      - helm template chart --set-string images.backend.tag=v1.2.3 --set-string images.web.tag=v1.2.3 > /dev/null
      # Client-side K8s schema validation: helm lint/template only parse
      # YAML and miss typed-shape errors (e.g. lifecycle.preStop.exec
      # rendered as an array). kubectl apply/create --dry-run=client need
      # an API server for REST mapping, so offline kubeconform with pinned
      # upstream schemas is the gate.
      - helm template chart | kubeconform -strict -summary -kubernetes-version 1.32.0
      # Render-assert image refs (second defense for the 2026-10-13
      # InvalidImageName incident): digest-only, tag-only, both (digest
      # wins, never concatenated), and neither (must fail loudly at
      # render time).
      - |
        set -euo pipefail
        d="sha256:$(head -c 64 /dev/zero | tr '\0' a)"
        img() { helm template chart "$@" | grep -E 'image: ghcr\.io' | sed 's/^ *image: //' | sort; }
        [ "$(img --set-string images.backend.digest="$d" --set-string images.web.digest="$d" --set-string images.backend.tag=v9.9.9 --set-string images.web.tag=v9.9.9 | grep -vc "^ghcr.io/[^@]*@$d$")" = 0 ] \
          || { echo "digest set: every ref must be exactly repository@digest" >&2; exit 1; }
        [ "$(img --set-string images.backend.digest= --set-string images.web.digest= | grep -vc ':main$')" = 0 ] \
          || { echo "digest empty: refs must fall back to repository:tag" >&2; exit 1; }
        if helm template chart --set-string images.backend.digest= --set-string images.backend.tag= --set-string images.web.digest= --set-string images.web.tag= >/dev/null 2>/tmp/helm-img.err; then
          echo "neither digest nor tag: expected loud render failure, got success" >&2
          exit 1
        fi
        grep -q "neither digest nor tag" /tmp/helm-img.err \
          || { echo "empty images: failed for the wrong reason:" >&2; cat /tmp/helm-img.err >&2; exit 1; }
        echo "image-ref render asserts OK"

  tofu:fmt:
    desc: tofu fmt check, recursive (ci.yml tofu)
    dir: tofu
    cmds:
      - tofu fmt -check -recursive

  tofu:validate:
    desc: tofu init (no backend) + validate (ci.yml tofu)
    dir: tofu
    cmds:
      - tofu init -backend=false -input=false
      - tofu validate

  tofu:ci:
    desc: tofu fmt + validate (ci.yml tofu)
    deps: [tofu:fmt, tofu:validate]

  # ---------------- test ----------------

  web:test:
    desc: vp test --coverage (vitest incl. contract schema fixtures, >=80% lines gate) (ci.yml web-test)
    dir: web
    deps: [web:install, contract:install]
    cmds:
      - pnpm exec vp test --coverage

  contract:install:
    desc: install contract/ dependencies with the pinned pnpm (frozen lockfile)
    dir: contract
    cmds:
      # Same materialization web:install does: node/pnpm resolve from THIS
      # package.json's devEngines, not the root mise.toml, and task runs
      # deps in parallel — without `mise install` first, a cold CI cache
      # has no pnpm on PATH yet (observed as exit 127 in web-lint).
      - mise install
      - pnpm install --frozen-lockfile

  web:contract:
    desc: contract integration suite — boots the real backend (gate image) + Postgres, parses every response/SSE event against contract/zod (ci.yml web-contract)
    dir: web
    deps: [web:install, contract:install, backend:image]
    cmds:
      - RUNNER='{{.RUNNER}}' ./scripts/contract-harness.sh

  backend:lint:
    desc: cargo fmt + clippy in the pinned libvips 8.16.1 image (ci.yml backend-lint)
    dir: backend
    deps: [backend:image]
    cmds:
      - '{{.RUNNER}} run --rm {{.IMAGE}} bash -c "cargo fmt --check && cargo clippy --all-targets -- -D warnings"'

  backend:test:
    desc: cargo test in the pinned libvips 8.16.1 image (ci.yml backend-test)
    dir: backend
    deps: [backend:image]
    cmds:
      - '{{.RUNNER}} run --rm {{.IMAGE}} bash -c "cargo test -- {{.BACKEND_TEST_ARGS}}"'

  # ---------------- leaks (hard gate) ----------------

  leaks:
    desc: betterleaks scan over git history + working tree (hard gate)
    cmds:
      - betterleaks git . --config .betterleaks.toml --redact
      - betterleaks dir . --config .betterleaks.toml --redact

  # ---------------- deploy.yml gates + aggregates ----------------

  lint:fast:
    desc: fast universal lint subset (deploy.yml lint)
    deps: [lint:md, lint:workflows, helm:lint, tofu:fmt]

  backend:ci:
    desc: backend lint + test gates, serial in one container (ci.yml backend-checks, deploy.yml backend-checks)
    cmds:
      - task: backend:lint
      - task: backend:test

  web:ci:
    desc: web lint + test gates, serial (deploy.yml web-checks)
    cmds:
      - task: web:lint
      - task: web:test

  # ---------------- tofu stateful workflows (CI-only; need secrets) ------

  tofu:plan:
    desc: tofu init (real backend) + plan (ci.yml tofu-plan)
    dir: tofu
    cmds:
      - tofu init -input=false
      - tofu plan -input=false -no-color

  tofu:apply:
    desc: tofu apply with honest one-retry convergence (infra-apply.yml)
    dir: tofu
    cmds:
      - tofu validate
      # First apply can abort on provider read races (e.g. managed DB
      # "waiting for service name to propagate") after resources were
      # created; a second pass converges. A second failure still fails.
      - tofu apply -auto-approve -input=false || tofu apply -auto-approve -input=false

  tofu:destroy:
    desc: tofu destroy + orphaned CCM load-balancer cleanup (infra-destroy.yml)
    dir: tofu
    cmds:
      # deferred so the billing-relevant cleanup still runs when the
      # destroy itself fails
      - defer: { task: infra:delete-lbs }
      - tofu destroy -auto-approve -input=false

  infra:delete-lbs:
    internal: true
    desc: delete UpCloud load balancers the CCM orphaned (kept billing)
    cmds:
      - |
        set -o pipefail; set -e
        # Destroying the cluster does not remove LBs the CCM provisioned
        # for LoadBalancer Services - they keep billing until deleted.
        for lb in $(curl -s -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            https://api.upcloud.com/1.3/load-balancer \
            | jq -r '.[] | select(.name | startswith("'"$CLUSTER"'")) | .uuid'); do
          echo "deleting LB $lb"
          curl -s -X DELETE -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            "https://api.upcloud.com/1.3/load-balancer/$lb" -o /dev/null -w "%{http_code}\n"
        done

  tofu:recreate:
    desc: destroy (best effort) then apply, with LB cleanup (infra-recreate.yml)
    dir: tofu
    cmds:
      - task: infra:delete-lbs
      - tofu destroy -auto-approve -input=false || true
      - tofu apply -auto-approve -input=false || tofu apply -auto-approve -input=false

  # ---------------- container images (deploy.yml; docker + buildx) -------

  image:backend:
    desc: build + push backend image, print digest (deploy.yml backend-build)
    dir: backend
    # Requires a prior registry login and docker buildx (both provided by
    # the deploy.yml job). Prints the pushed image digest on the last line.
    # SEMVER (optional, e.g. v1.2.3): set by the release flow so images
    # carry the immutable digest AND the semver tag.
    cmds:
      - |
        tags=("$BACKEND_IMAGE")
        if [ -n "${SEMVER:-}" ]; then tags+=("${BACKEND_IMAGE%:*}:$SEMVER"); fi
        args=()
        for t in "${tags[@]}"; do args+=(-t "$t"); done
        docker buildx build --platform linux/amd64 --push "${args[@]}" \
          --metadata-file /tmp/backend-image-metadata.json .
        jq -r '."containerimage.digest"' /tmp/backend-image-metadata.json

  image:web:
    desc: build + push web image, print digest (deploy.yml web-build)
    # Context is the REPO ROOT: the bundle imports contract/zod, so the
    # Dockerfile (web/Dockerfile) copies web/ AND contract/.
    cmds:
      - |
        tags=("$WEB_IMAGE")
        if [ -n "${SEMVER:-}" ]; then tags+=("${WEB_IMAGE%:*}:$SEMVER"); fi
        args=()
        for t in "${tags[@]}"; do args+=(-t "$t"); done
        docker buildx build --platform linux/amd64 --push "${args[@]}" \
          -f web/Dockerfile \
          --metadata-file /tmp/web-image-metadata.json .
        jq -r '."containerimage.digest"' /tmp/web-image-metadata.json

  # ---------------- deploy choreography (deploy.yml deploy job) ----------

  deploy:k8s:
    desc: >-
      consume images.lock.json digests, S3 verify-or-rotate + app-env
      secret, kubeconfig fetch, tofu state settle, atomic helm upgrade,
      DNS sync (deploy.yml deploy)
    env:
      KUBECONFIG: '{{.KUBECONFIG | default "/tmp/idol-deploy-kubeconfig"}}'
      RELEASE_TAG: '{{.RELEASE_TAG | default ""}}'
      IMAGES_LOCK: '{{.IMAGES_LOCK | default "images.lock.json"}}'
    cmds:
      - |
        set -euo pipefail
        # Deploy is a pure images.lock.json consumer (images.yml maintains
        # the file): an un-built image cannot be deployed by construction.
        # The empty-digest guard stays as a loud second defense
        # (2026-10-13 InvalidImageName incident).
        BACKEND_DIGEST="$(jq -r '.backend.digest // empty' "$IMAGES_LOCK")"
        WEB_DIGEST="$(jq -r '.web.digest // empty' "$IMAGES_LOCK")"
        [ -n "$BACKEND_DIGEST" ] \
          || { echo "backend digest missing or empty in $IMAGES_LOCK; refusing to deploy" >&2; exit 1; }
        [ -n "$WEB_DIGEST" ] \
          || { echo "web digest missing or empty in $IMAGES_LOCK; refusing to deploy" >&2; exit 1; }
        # task runs each cmd in its own shell — hand the digests to the
        # helm cmd via state files (same pattern as the rotation flag).
        printf '%s\n' "$BACKEND_DIGEST" > /tmp/deploy-backend-digest
        printf '%s\n' "$WEB_DIGEST" > /tmp/deploy-web-digest
        # Release deploys stamp the recorded digests with the semver tag in
        # GHCR (audit trail; the digest stays what actually runs).
        if [ -n "$RELEASE_TAG" ]; then
          echo "$GHCR_TOKEN" | crane auth login ghcr.io -u "${GITHUB_ACTOR:-token}" --password-stdin
          crane tag "ghcr.io/vreid/idol-appreciation.club-backend@$BACKEND_DIGEST" "$RELEASE_TAG"
          crane tag "ghcr.io/vreid/idol-appreciation.club-web@$WEB_DIGEST" "$RELEASE_TAG"
        fi
        uuid="$(curl -sS -H "Authorization: Bearer ${UPCLOUD_TOKEN}" \
          https://api.upcloud.com/1.3/kubernetes \
          | jq -r --arg c "$CLUSTER" '.[] | select(.name == $c) | .uuid')"
        test -n "$uuid" || { echo "cluster $CLUSTER not found" >&2; exit 1; }
        curl -sS -H "Authorization: Bearer ${UPCLOUD_TOKEN}" \
          "https://api.upcloud.com/1.3/kubernetes/${uuid}/kubeconfig" \
        | jq -r '.kubeconfig' > "$KUBECONFIG"
        chmod 600 "$KUBECONFIG"
      - |
        set -euo pipefail
        cd tofu
        tofu apply -auto-approve -refresh-only -input=false || true
      - |
        set -euo pipefail
        cd tofu
        # s3_endpoint can lag service creation; refresh until it shows.
        ep=""
        i=0
        while [ "$i" -lt 5 ]; do
          ep="$(tofu output -raw s3_endpoint 2>/dev/null || true)"
          if [ -n "$ep" ] && [ "$ep" != "null" ]; then
            break
          fi
          tofu apply -auto-approve -refresh-only -input=false || true
          sleep 20
          i=$((i + 1))
        done
        if [ -z "$ep" ] || [ "$ep" = "null" ]; then
          echo "warning: object storage endpoint not available; S3_ENDPOINT empty"
          ep=""
        fi
        db="$(tofu output -raw app_database_uri)"
        test -n "$db" || { echo "app_database_uri missing" >&2; exit 1; }
        # every UpCloud call names its stage and retries transient 4xx/5xx
        uc() { local label="$1" method="$2" url="$3" out="$4" code
          for attempt in 1 2 3; do
            code="$(curl -s -o "$out" -w '%{http_code}' -X "$method" -H "Authorization: Bearer $UPCLOUD_API_TOKEN" "$url")" || code="000"
            case "$code" in 2*) return 0;; 429|5*) sleep $((attempt * 5));; *)
              echo "upcloud $label -> HTTP $code"; sed -n '1,3p' "$out"; exit 1;;
            esac
          done
          echo "upcloud $label -> HTTP $code after retries"; exit 1
        }
        # UpCloud may rotate managed-DB user passwords after the provider
        # creates them, so trust the API, not tofu state, for the app user's
        # password. Host/port stay from tofu output.
        uc db-list GET https://api.upcloud.com/1.3/database /tmp/uc1.json
        dbuuid="$(jq -r 'if type == "array" then . else [.database_services[]?] end | map(select(.name == "idol-canvas-db")) | .[0].uuid' /tmp/uc1.json)"
        test -n "$dbuuid" || { echo "database service not found via API" >&2; exit 1; }
        uc db-users GET "https://api.upcloud.com/1.3/database/$dbuuid/users" /tmp/uc2.json
        apppw="$(jq -r '(.users? // .)[] | select(.username == "app") | .password' /tmp/uc2.json)"
        test -n "$apppw" || { echo "app user password not found via API" >&2; exit 1; }
        db="$(printf '%s' "$db" | sed -E "s|//[^@]+@|//app:$apppw@|")"
        # Object storage: trust the UpCloud API, not tofu state. The
        # provider can record a different endpoint or user key than the
        # service actually gets (seen on recreate), so fetch both from the
        # API, and refuse to ship an endpoint that does not resolve.
        uc os-list GET https://api.upcloud.com/1.3/object-storage-2 /tmp/uc3.json
        osuuid="$(jq -r 'if type == "array" then . else [.object_storages[]?] end | map(select(.name == "idol-canvas-objsto")) | .[0].uuid' /tmp/uc3.json)"
        test -n "$osuuid" || { echo "object storage not found via API" >&2; exit 1; }
        uc os-detail GET "https://api.upcloud.com/1.3/object-storage-2/$osuuid" /tmp/uc4.json
        oshost="$(jq -r '.endpoints[0].domain_name' /tmp/uc4.json)"
        test -n "$oshost" || { echo "objsto endpoint missing from API" >&2; exit 1; }
        dig +short "$oshost" | grep -qE '^[0-9]+\.' || { echo "objsto endpoint $oshost does not resolve" >&2; exit 1; }
        # INVARIANT: deploys never invalidate working S3 auth. This step
        # runs BEFORE helm upgrade: the cluster's current creds are probed
        # with a cheap signed ListObjects and kept when they work
        # (idempotent deploys, zero key churn); they are rotated ONLY on
        # 403 — while no pod has rolled yet, so the upgrade itself brings
        # every pod up on a live key. There is no window where pods hold
        # deleted keys. Anything other than 200/403 aborts untouched.
        rotate=true
        # Probe the creds the RUNNING PODS hold (deployment exec), not the
        # secret: the 38433144837 incident minted fresh creds into the
        # secret but died before any pod rolled — secret-valid/pod-dead is
        # exactly the state that must rotate. Fall back to the secret when
        # no pod is up yet (fresh installs).
        if kubectl -n idol get secret app-env > /dev/null 2>&1; then
          ak="$(kubectl -n idol exec deployment/backend -- printenv S3_ACCESS_KEY_ID 2>/dev/null || true)"
          sk="$(kubectl -n idol exec deployment/backend -- printenv S3_SECRET_ACCESS_KEY 2>/dev/null || true)"
          pep="$(kubectl -n idol exec deployment/backend -- printenv S3_ENDPOINT 2>/dev/null || true)"
          pbucket="$(kubectl -n idol exec deployment/backend -- printenv S3_BUCKET 2>/dev/null || true)"
          if [ -z "$ak" ] || [ -z "$sk" ] || [ -z "$pep" ] || [ -z "$pbucket" ]; then
            ak="$(kubectl -n idol get secret app-env -o jsonpath='{.data.S3_ACCESS_KEY_ID}' | base64 -d)"
            sk="$(kubectl -n idol get secret app-env -o jsonpath='{.data.S3_SECRET_ACCESS_KEY}' | base64 -d)"
            pep="$(kubectl -n idol get secret app-env -o jsonpath='{.data.S3_ENDPOINT}' | base64 -d)"
            pbucket="$(kubectl -n idol get secret app-env -o jsonpath='{.data.S3_BUCKET}' | base64 -d)"
          fi
          if [ -n "$ak" ] && [ -n "$sk" ] && [ -n "$pep" ] && [ -n "$pbucket" ]; then
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              --aws-sigv4 'aws:amz:us-east-1:s3' -u "$ak:$sk" \
              "$pep/$pbucket?list-type=2&max-keys=1" || echo 000)"
            case "$code" in
              200) rotate=false ;;
              403) rotate=true ;;
              *)
                echo "s3 auth probe inconclusive (HTTP $code); refusing to churn or ship" >&2
                exit 1
                ;;
            esac
          fi
        fi
        if [ "$rotate" = true ]; then
          # Rotation order is CREATE -> VERIFY LIVE -> DELETE OLD. The old
          # delete-then-create order (run 38439690036) deleted the live
          # key and then died on a failed/empty mint, leaving prod with
          # zero valid keys — and every later deploy re-entered the same
          # broken rotate on its 403 probe.
          uc key-list GET "https://api.upcloud.com/1.3/object-storage-2/$osuuid/users/app/access-keys" /tmp/uc6.json
          mapfile -t oldkeys < <(jq -r '.[].access_key_id' /tmp/uc6.json)
          echo "existing access keys before rotation: ${#oldkeys[@]}"
          # CREATE first: the 2-key quota still has room while the old
          # keys exist, and a failed mint leaves prod credentials intact.
          uc key-create POST "https://api.upcloud.com/1.3/object-storage-2/$osuuid/users/app/access-keys" /tmp/uc5.json
          sak="$(jq -r .access_key_id /tmp/uc5.json)"
          ssk="$(jq -r .secret_access_key /tmp/uc5.json)"
          if [ -z "$ssk" ]; then
            echo "key-create failed; verbatim response body (secret redacted):" >&2
            sed -E 's/("secret_access_key"[[:space:]]*:[[:space:]]*")[^"]*/\1REDACTED/g; s/("access_key_id"[[:space:]]*:[[:space:]]*")[^"]*/\1REDACTED/g' /tmp/uc5.json >&2 || echo "(empty body)" >&2
            exit 1
          fi
          # VERIFY the new pair with a signed ListObjects BEFORE anything
          # is deleted; on failure abort with old keys (and prod) intact.
          vcode="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            --aws-sigv4 'aws:amz:us-east-1:s3' -u "$sak:$ssk" \
            "https://$oshost/$(tofu output -raw s3_bucket)?list-type=2&max-keys=1" || echo 000)"
          if [ "$vcode" != "200" ]; then
            echo "new access key failed live verify (HTTP $vcode); old keys left intact, refusing to rotate" >&2
            exit 1
          fi
          # Only now delete the old keys.
          for old in "${oldkeys[@]}"; do
            uc key-del DELETE "https://api.upcloud.com/1.3/object-storage-2/$osuuid/users/app/access-keys/$old" /tmp/uc7.json
            echo "deleted old access key ${old:0:8}…"
          done
          sleep 3
          uc key-list GET "https://api.upcloud.com/1.3/object-storage-2/$osuuid/users/app/access-keys" /tmp/uc8.json
          nkeys="$(jq 'length' /tmp/uc8.json)"
          [ "$nkeys" = "1" ] \
            || { echo "orphaned access keys after rotation ($nkeys remain): $(jq -r '.[].access_key_id' /tmp/uc8.json | head -3)" >&2; exit 1; }
        else
          sak="$ak"
          ssk="$sk"
        fi
        echo "s3 auth: $([ "$rotate" = true ] && echo rotated || echo verified-working)"
        echo "$rotate" > /tmp/deploy-s3-rotated
        # prod registration closed until an admin approves the account
        kubectl -n idol create secret generic app-env \
          --from-literal="DATABASE_URL=$db" \
          --from-literal="S3_ENDPOINT=https://$oshost" \
          --from-literal="S3_BUCKET=$(tofu output -raw s3_bucket)" \
          --from-literal="S3_ACCESS_KEY_ID=$sak" \
          --from-literal="S3_SECRET_ACCESS_KEY=$ssk" \
          --from-literal="REGISTRATION_APPROVAL_REQUIRED=true" \
          --from-literal="SESSION_SECRET=$SESSION_SECRET" \
          --dry-run=client -o yaml | kubectl apply -f -
      - |
        set -euo pipefail
        cp web/Caddyfile chart/caddy/Caddyfile
        # Digests were derived and guarded in the first cmd; each task cmd
        # is its own shell, so read them back from the state files.
        BACKEND_DIGEST="$(cat /tmp/deploy-backend-digest)"
        WEB_DIGEST="$(cat /tmp/deploy-web-digest)"
        # Cluster Autoscaler credential — the chart reads it only when
        # clusterAutoscaler.enabled; provisioning it on every deploy
        # keeps that flip a values-only change.
        kubectl -n idol create secret generic upcloud-autoscaler \
          --from-literal="token=${UPCLOUD_API_TOKEN}" \
          --dry-run=client -o yaml | kubectl apply -f -
        ARGS=()
        # Release semver (audit trail in helm values / rollout annotations;
        # the digest stays the actual image pin — GHCR tags are mutable).
        if [ -n "$RELEASE_TAG" ]; then
          ARGS+=(--set-string images.backend.tag="$RELEASE_TAG" \
                 --set-string images.web.tag="$RELEASE_TAG")
        fi
        # Cluster uuid for the Cluster Autoscaler (unused while
        # clusterAutoscaler.enabled is false).
        cluster_id="$(curl -sS -H "Authorization: Bearer ${UPCLOUD_API_TOKEN}" \
          https://api.upcloud.com/1.3/kubernetes \
          | jq -r --arg c "$CLUSTER" '.[] | select(.name == $c) | .uuid')"
        ARGS+=(--set-string clusterAutoscaler.clusterId="$cluster_id")
        helm upgrade --install idol chart/ \
          --namespace idol --create-namespace --atomic --wait --timeout 15m \
          --take-ownership \
          --set-string images.backend.digest="$BACKEND_DIGEST" \
          --set-string images.web.digest="$WEB_DIGEST" \
          "${ARGS[@]}"
        if [ "$(cat /tmp/deploy-s3-rotated 2>/dev/null || echo false)" = "true" ]; then
          # The S3 key was rotated above (before the upgrade); if this
          # upgrade was a no-op for pods, roll the backend so nothing
          # keeps running on the deleted key.
          kubectl -n idol rollout restart deployment/backend
          kubectl -n idol rollout status deployment/backend --timeout=180s
        fi
      - |
        set -euo pipefail
        ips=""
        n=0
        while [ -z "$ips" ] && [ "$n" -lt 30 ]; do
          ips="$( (kubectl -n idol get svc web -o json 2>/dev/null \
            || echo '{"items":[]}') \
            | jq -r '.items[] | select(.status.loadBalancer.ingress)
            | .status.loadBalancer.ingress[]? | (.ip // .hostname)')"
          [ -n "$ips" ] || sleep 10
          n=$((n + 1))
        done
        if [ -z "$ips" ]; then
          echo "LoadBalancer IP never assigned" >&2
          exit 1
        fi
        # CCM may expose an ip or a dns hostname per ingress entry.
        addrs=""
        for entry in $ips; do
          case "$entry" in
            *.*.*|*:*) addrs="$addrs $entry" ;;
            *) addrs="$addrs $(getent ahosts "$entry" | awk '{print $1}' | sort -u | tr '\n' ' ')" ;;
          esac
        done
        ipv4="$(printf '%s\n' "$addrs" | tr ' ' '\n' | grep '\.' | head -1 || true)"
        ipv6="$(printf '%s\n' "$addrs" | tr ' ' '\n' | grep ':' | head -1 || true)"
        if [ -z "$ipv4" ]; then
          echo "no IPv4 address on LB" >&2
          exit 1
        fi
        ./scripts/sync-dns.sh "$ipv4" ${ipv6:+"$ipv6"}

  # ---------------- e2e (e2e.yml) ----------------

  web:e2e:
    desc: playwright e2e, smoke then full (e2e.yml)
    dir: web
    deps: [web:install]
    cmds:
      - ./node_modules/.bin/playwright install --with-deps chromium
      # @smoke always runs; @full self-skips if /api/health is not green.
      - ./node_modules/.bin/playwright test --config e2e/playwright.config.ts --grep @smoke
      - ./node_modules/.bin/playwright test --config e2e/playwright.config.ts

  # ---------------- backend image (internal) ----------------

  backend:image:
    internal: true
    desc: build the pinned libvips 8.16.1 gate image (repo builder + fmt/clippy)
    dir: backend
    cmds:
      - '{{.RUNNER}} build --target builder -t {{.IMAGE}}-base .'
      - |
        {{.RUNNER}} build -t {{.IMAGE}} -f - . <<'DOCKERFILE'
        FROM {{.IMAGE}}-base
        # rust:trixie ships a minimal-profile toolchain (no rustfmt/clippy).
        # Added in an overlay so the repo Dockerfile stays the backend team's
        # single definition of the builder; this layer is cache-stable.
        RUN rustup component add rustfmt clippy
        DOCKERFILE

  # ---------------- bootstrap + aggregate ----------------

  web:install:
    desc: install web dependencies with the pinned pnpm (frozen lockfile)
    dir: web
    cmds:
      # node/pnpm resolve from devEngines here (not the root mise.toml), so
      # materialize them before pnpm runs — CI shims only exist for
      # root-config tools until this happens.
      - mise install
      - pnpm install --frozen-lockfile

  ci:
    desc: full local CI gate set (everything ci.yml runs)
    deps:
      - lint:md
      - lint:workflows
      - web:lint
      - web:test
      - leaks
      - helm:lint
      - tofu:fmt
      - tofu:validate
    cmds:
      - task: backend:lint
      - task: backend:test
