version: '3'

# Local entrypoints for every CI job in .github/workflows/ci.yml.
# Tool versions come from mise.toml (node/pnpm from web/package.json
# devEngines) — run `mise install` first; see docs/dev.md.

vars:
  # Container runner for backend gates. podman by default (local dev);
  # override with RUNNER=docker where only docker exists (CI runners).
  RUNNER: '{{.RUNNER | default "podman"}}'
  # Extra container-run flags (CI: --network host -e DATABASE_URL so the
  # in-image test harness reaches the job's postgres service).
  RUN_FLAGS: '{{.RUN_FLAGS | default (env "RUN_FLAGS") | default ""}}'
  IMAGE: '{{.IMAGE | default "backend-builder"}}'
  # TEMPORARY: mirrors the skip in ci.yml backend-test (webp buffer encode
  # fails in the gate image only; backend agent is debugging). Drop it here
  # and in ci.yml when the fix lands.
  # --test-threads 2: the 10.3 GB local OOM lesson — parallel suite
  # shards each boot a server + pool; cap it (double on 2-vCPU runners).
  BACKEND_TEST_ARGS: '{{.BACKEND_TEST_ARGS | default (env "BACKEND_TEST_ARGS") | default "--skip derivative_bytes_are_deterministic --test-threads 2"}}'

tasks:
  # ---------------- lint ----------------

  lint:md:
    desc: oxfmt check over all Markdown (ci.yml md-lint)
    cmds:
      - oxfmt --check "**/*.md"

  lint:pr-title:
    desc: enforce Conventional Commits v1.0.0 PR title (ci.yml lint:pr-title)
    cmds:
      - |
        set -euo pipefail
        title="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .title)"
        # Conventional Commits 1.0.0: <type>(<scope>)?!: <subject>
        # - type: the eleven spec types (angular lineage)
        # - scope: repo areas, optional
        # - ! marks breaking (major bump)
        # - subject: required, no leading/trailing whitespace; no trailing
        #   period (checked separately so single-character subjects pass)
        cc='^(feat|fix|perf|refactor|docs|chore|test|ci|build|style)(\((backend|web|tofu|chart|ci|deps|release|api|seed|docs|infra|images)\))?(!)?: [^[:space:]](.*[^[:space:]])?$'
        if ! printf '%s\n' "$title" | grep -qE "$cc"; then
          echo "PR title is not strict Conventional Commits: \"$title\"" >&2
          echo 'expected: <type>(<scope>)?!: <subject>' >&2
          echo '  types:  feat|fix|perf|refactor|docs|chore|test|ci|build|style' >&2
          echo '  scopes: backend|web|tofu|chart|ci|deps|release|api|seed|docs|infra|images (optional)' >&2
          echo '  subject: non-empty, no trailing period, no trailing whitespace' >&2
          exit 1
        fi
        case "$title" in
          *.) echo "PR title subject must not end with a period: \"$title\"" >&2; exit 1 ;;
        esac

  release:
    desc: conventional-commit version tag cutter (TAG ONLY — no changelog, no GitHub Release; git log is the changelog)
    cmds:
      # Version rules (same semantics the old semantic-release had):
      # breaking (subject '!:' or body 'BREAKING CHANGE:') -> major,
      # any feat -> minor, any fix/perf -> patch, otherwise no tag.
      - |
        set -euo pipefail
        git fetch origin 'refs/tags/v*:refs/tags/v*' --quiet
        last="$(git tag --list 'v*' --sort=-v:refname | head -1 || true)"
        maj=0; min=0; pat=0
        if [ -n "$last" ]; then
          v="${last#v}"; IFS=. read -r maj min pat <<< "$v"
        fi
        log="$(git log --format='%s%n%b' ${last:+"$last..HEAD"})"
        major=false; minor=false; patch=false
        if printf '%s' "$log" | grep -qE '^BREAKING CHANGE:|![[:space:]]*:'; then
          major=true
        elif printf '%s' "$log" | grep -qE '^feat(\(|:)'; then
          minor=true
        elif printf '%s' "$log" | grep -qE '^(fix|perf)(\(|:)'; then
          patch=true
        fi
        if $major; then
          next="v$((maj + 1)).0.0"
        elif $minor; then
          next="v$maj.$((min + 1)).0"
        elif $patch; then
          next="v$maj.$min.$((pat + 1))"
        else
          echo "no release-worthy commits since ${last:-root}; no tag"
          exit 0
        fi
        if git rev-parse -q --verify "refs/tags/$next" > /dev/null; then
          echo "tag $next already exists; refusing to move it" >&2
          exit 1
        fi
        git tag "$next" HEAD
        git push origin "$next"
        echo "tagged $next (${last:-none} -> $next)"

  image:prune:
    desc: GHCR retention — keep main, buildcache + last 10 vX.Y.Z tags per package; never prune digests pinned by images.lock.json
    env:
      GH_TOKEN: '{{.GH_TOKEN | default ""}}'
    cmds:
      - |
        set -euo pipefail
        test -n "$GH_TOKEN" || { echo "GH_TOKEN required" >&2; exit 1; }
        echo "$GH_TOKEN" | crane auth login ghcr.io -u "${GITHUB_ACTOR:-vreid}" --password-stdin > /dev/null
        keep_ver=10
        for pkg in backend web; do
          repo="ghcr.io/vreid/idol-appreciation.club-$pkg"
          lock_digest="$(jq -r ".${pkg}.digest" images.lock.json)"
          # Registry API via crane: the /user/packages management REST API
          # 403s for user-owned packages under GITHUB_TOKEN, but the
          # registry endpoints work with packages:write. Deletions are by
          # DIGEST (removes every tag on that manifest), so the keep-set
          # is computed on digests — an old version tag sharing a digest
          # with a kept tag survives with it.
          mapfile -t tags < <(crane ls "$repo" | sort -uV)
          declare -A digests=()
          for t in "${tags[@]}"; do digests["$t"]="$(crane digest "$repo:$t")"; done
          mapfile -t keep_ver_tags < <(printf '%s\n' "${tags[@]}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | tail -n "$keep_ver")
          declare -A keep=()
          # buildcache = the BuildKit layer cache images.yml exports (absent
          # until the first cached build, hence the guard).
          for t in main buildcache "${keep_ver_tags[@]}"; do
            d="${digests[$t]:-}"
            if [ -n "$d" ]; then keep["$d"]=1; fi
          done
          keep["$lock_digest"]=1
          kept=0; pruned=0
          for t in "${tags[@]}"; do
            if [ -n "${keep[${digests[$t]}]:-}" ]; then
              kept=$((kept + 1))
            else
              # GHCR returns UNSUPPORTED for manifest DELETE under
              # GITHUB_TOKEN (needs a delete:packages PAT). Retention is
              # best-effort: warn and move on — a failed prune must never
              # fail the job, or the lock update + deploy behind it die.
              if crane delete "$repo@${digests[$t]}" 2>/dev/null; then
                pruned=$((pruned + 1)); echo "$pkg: pruned $t (${digests[$t]:0:19})"
              else
                echo "$pkg: WARN prune skipped for $t (${digests[$t]:0:19}) — GHCR DELETE unsupported with this token" >&2
              fi
            fi
          done
          echo "$pkg: kept $kept, pruned $pruned (lock pin ${lock_digest:0:19} protected)"
        done

  lint:workflows:
    desc: jactionlint over all workflows (ci.yml workflows-lint)
    cmds:
      - jactionlint .github/workflows/*.yml

  lint:action-pins:
    desc: fail on unpinned third-party action refs (ci.yml workflows-lint, issue #86)
    cmds:
      - ./scripts/check-action-pins.sh

  web:lint:
    desc: vp check (oxfmt + oxlint + tsgo type check) (ci.yml web-lint)
    dir: web
    deps: [web:install, contract:install]
    cmds:
      - pnpm exec vp check

  helm:lint:
    desc: helm lint + template, with and without web (ci.yml helm-lint)
    cmds:
      - helm version
      - helm lint chart
      - helm template chart > /dev/null
      - helm template chart --set-string images.backend.tag=v1.2.3 --set-string images.web.tag=v1.2.3 > /dev/null
      # Client-side K8s schema validation: helm lint/template only parse
      # YAML and miss typed-shape errors (e.g. lifecycle.preStop.exec
      # rendered as an array). kubectl apply/create --dry-run=client need
      # an API server for REST mapping, so offline kubeconform with pinned
      # upstream schemas is the gate. -ignore-missing-schemas: the CNPG
      # Cluster instance (cnpg-cluster.yaml, gated off) is a CRD instance
      # with no offline schema; it is validated server-side by the
      # cnpg:cluster:install task instead.
      - helm template chart | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.32.0
      # Render-assert image refs (second defense for the 2026-10-13
      # InvalidImageName incident) across backend, web and caddy:
      # digest-only, tag-only, both (digest wins, never concatenated),
      # and neither (must fail loudly at render time).
      - |
        set -euo pipefail
        d="sha256:$(head -c 64 /dev/zero | tr '\0' a)"
        img() { helm template chart "$@" | grep -E 'image: ghcr\.io' | sed 's/^ *image: //' | sort; }
        # No dash-leading printf FORMAT: task's mvdan-sh swallows it
        # (prints bare "--"), so build the flags as a plain string.
        all() {
          local out="" pkg
          for pkg in backend web caddy; do
            out="$out --set-string images.$pkg.digest=$1 --set-string images.$pkg.tag=$2"
          done
          printf '%s' "$out"
        }
        [ "$(img $(all "$d" v9.9.9) | grep -vc "^ghcr.io/[^@]*@$d$")" = 0 ] \
          || { echo "digest set: every ref must be exactly repository@digest" >&2; exit 1; }
        # digest empty, tag defaulting: every ref must fall back to :main
        [ "$(img --set-string images.backend.digest= --set-string images.web.digest= --set-string images.caddy.digest= | grep -vc ':main$')" = 0 ] \
          || { echo "digest empty: refs must fall back to repository:tag" >&2; exit 1; }
        if helm template chart --set-string images.backend.digest= --set-string images.backend.tag= --set-string images.web.digest= --set-string images.web.tag= --set-string images.caddy.digest= --set-string images.caddy.tag= >/dev/null 2>/tmp/helm-img.err; then
          echo "neither digest nor tag: expected loud render failure, got success" >&2
          exit 1
        fi
        grep -q "neither digest nor tag" /tmp/helm-img.err \
          || { echo "empty images: failed for the wrong reason:" >&2; cat /tmp/helm-img.err >&2; exit 1; }
        echo "image-ref render asserts OK"

  tofu:fmt:
    desc: tofu fmt check, recursive (ci.yml tofu)
    dir: tofu
    cmds:
      - tofu fmt -check -recursive

  tofu:validate:
    desc: tofu init (no backend) + validate (ci.yml tofu)
    dir: tofu
    cmds:
      - tofu init -backend=false -input=false
      - tofu validate

  tofu:ci:
    desc: tofu fmt + validate (ci.yml tofu)
    deps: [tofu:fmt, tofu:validate]

  # ---------------- test ----------------

  web:test:
    desc: vp test --coverage (vitest incl. contract schema fixtures, >=80% lines gate) (ci.yml web-test)
    dir: web
    deps: [web:install, contract:install]
    cmds:
      - pnpm exec vp test --coverage

  contract:install:
    desc: install contract/ dependencies with the pinned pnpm (frozen lockfile)
    dir: contract
    cmds:
      # Same materialization web:install does: node/pnpm resolve from THIS
      # package.json's devEngines, not the root mise.toml, and task runs
      # deps in parallel — without `mise install` first, a cold CI cache
      # has no pnpm on PATH yet (observed as exit 127 in web-lint).
      - mise install
      - pnpm install --frozen-lockfile

  web:contract:
    desc: contract integration suite — boots the real backend (gate image) + Postgres, parses every response/SSE event against contract/zod (ci.yml web-contract)
    dir: web
    deps: [web:install, contract:install, backend:image]
    cmds:
      - RUNNER='{{.RUNNER}}' ./scripts/contract-harness.sh

  backend:lint:
    desc: cargo fmt + clippy in the pinned libvips 8.16.1 image (ci.yml backend-lint)
    dir: backend
    deps: [backend:image]
    cmds:
      - '{{.RUNNER}} run --rm {{.IMAGE}} bash -c "cargo fmt --check && cargo clippy --all-targets -- -D warnings"'

  backend:test:
    desc: cargo test in the pinned libvips 8.16.1 image (ci.yml backend-test)
    dir: backend
    deps: [backend:image]
    cmds:
      - '{{.RUNNER}} run --rm {{.RUN_FLAGS}} {{.IMAGE}} bash -c "cargo test -- {{.BACKEND_TEST_ARGS}}"'

  # ---------------- leaks (hard gate) ----------------

  leaks:
    desc: betterleaks scan over git history + working tree (hard gate)
    cmds:
      # --log-opts=HEAD: scan the history reachable from the checked-out
      # ref only (in CI, the PR merge commit or the pushed main commit).
      # The default log opts include --all, which also scans every fetched
      # remote branch, so one branch's finding failed every open PR.
      - betterleaks git . --config .betterleaks.toml --redact --log-opts=HEAD
      - betterleaks dir . --config .betterleaks.toml --redact

  # ---------------- deploy.yml gates + aggregates ----------------

  lint:fast:
    desc: fast universal lint subset (deploy.yml lint)
    deps: [lint:md, lint:workflows, lint:action-pins, helm:lint, tofu:fmt]

  backend:ci:
    desc: backend lint + test gates, serial in one container (ci.yml backend-checks, deploy.yml backend-checks)
    cmds:
      - task: backend:lint
      - task: backend:test

  web:ci:
    desc: web lint + test gates, serial (deploy.yml web-checks)
    cmds:
      - task: web:lint
      - task: web:test

  # ---------------- tofu stateful workflows (CI-only; need secrets) ------

  tofu:plan:
    desc: tofu init (real backend) + plan (ci.yml tofu-plan)
    dir: tofu
    cmds:
      - tofu init -input=false
      - tofu plan -input=false -no-color

  tofu:apply:
    desc: tofu apply with honest one-retry convergence (infra-apply.yml)
    dir: tofu
    cmds:
      - tofu validate
      # First apply can abort on provider read races (e.g. managed DB
      # "waiting for service name to propagate") after resources were
      # created; a second pass converges. A second failure still fails.
      - tofu apply -auto-approve -input=false || tofu apply -auto-approve -input=false

  tofu:destroy:
    desc: tofu destroy + orphaned CCM load-balancer cleanup (infra-destroy.yml)
    dir: tofu
    cmds:
      # deferred so the billing-relevant cleanup still runs when the
      # destroy itself fails
      - defer: { task: infra:delete-lbs }
      - tofu destroy -auto-approve -input=false

  infra:delete-lbs:
    internal: true
    desc: delete UpCloud load balancers the CCM orphaned (kept billing)
    cmds:
      - |
        set -o pipefail; set -e
        # Destroying the cluster does not remove LBs the CCM provisioned
        # for LoadBalancer Services - they keep billing until deleted.
        for lb in $(curl -s -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            https://api.upcloud.com/1.3/load-balancer \
            | jq -r '.[] | select(.name | startswith("'"$CLUSTER"'")) | .uuid'); do
          echo "deleting LB $lb"
          curl -s -X DELETE -H "Authorization: Bearer $UPCLOUD_TOKEN" \
            "https://api.upcloud.com/1.3/load-balancer/$lb" -o /dev/null -w "%{http_code}\n"
        done

  tofu:recreate:
    desc: destroy (best effort) then apply, with LB cleanup (infra-recreate.yml)
    dir: tofu
    cmds:
      - task: infra:delete-lbs
      - tofu destroy -auto-approve -input=false || true
      - tofu apply -auto-approve -input=false || tofu apply -auto-approve -input=false

  # ---------------- container images (deploy.yml; docker + buildx) -------

  image:backend:
    desc: build + push backend image, print digest (deploy.yml backend-build)
    dir: backend
    # Requires a prior registry login and docker buildx (both provided by
    # the deploy.yml job). Prints the pushed image digest on the last line.
    # SEMVER (optional, e.g. v1.2.3): set by the release flow so images
    # carry the immutable digest AND the semver tag.
    cmds:
      - |
        tags=("$BACKEND_IMAGE")
        if [ -n "${SEMVER:-}" ]; then tags+=("${BACKEND_IMAGE%:*}:$SEMVER"); fi
        args=()
        for t in "${tags[@]}"; do args+=(-t "$t"); done
        # BUILD_CACHE_REF (images.yml only): import/export the BuildKit layer
        # cache through the registry so the cargo-chef dependency layer
        # survives ephemeral runners. BUILD_TREE labels the image with its
        # build-context tree so images.yml can reuse it instead of rebuilding.
        if [ -n "${BUILD_CACHE_REF:-}" ]; then
          args+=(--cache-from "type=registry,ref=$BUILD_CACHE_REF" \
                 --cache-to "type=registry,ref=$BUILD_CACHE_REF,mode=max")
        fi
        if [ -n "${BUILD_TREE:-}" ]; then args+=(--label "club.idol.build.tree=$BUILD_TREE"); fi
        if [ -n "${GITHUB_SHA:-}" ]; then args+=(--label "org.opencontainers.image.revision=$GITHUB_SHA"); fi
        docker buildx build --platform linux/amd64 --push "${args[@]}" \
          --metadata-file /tmp/backend-image-metadata.json .
        jq -r '."containerimage.digest"' /tmp/backend-image-metadata.json

  image:web:
    desc: build + push web image, print digest (deploy.yml web-build)
    # Context is the REPO ROOT: the bundle imports contract/zod, so the
    # Dockerfile (web/Dockerfile) copies web/ AND contract/.
    cmds:
      - |
        tags=("$WEB_IMAGE")
        if [ -n "${SEMVER:-}" ]; then tags+=("${WEB_IMAGE%:*}:$SEMVER"); fi
        args=()
        for t in "${tags[@]}"; do args+=(-t "$t"); done
        # Same opt-in registry cache + reuse labels as image:backend.
        if [ -n "${BUILD_CACHE_REF:-}" ]; then
          args+=(--cache-from "type=registry,ref=$BUILD_CACHE_REF" \
                 --cache-to "type=registry,ref=$BUILD_CACHE_REF,mode=max")
        fi
        if [ -n "${BUILD_TREE:-}" ]; then args+=(--label "club.idol.build.tree=$BUILD_TREE"); fi
        if [ -n "${GITHUB_SHA:-}" ]; then args+=(--label "org.opencontainers.image.revision=$GITHUB_SHA"); fi
        docker buildx build --platform linux/amd64 --push "${args[@]}" \
          -f web/Dockerfile \
          --metadata-file /tmp/web-image-metadata.json .
        jq -r '."containerimage.digest"' /tmp/web-image-metadata.json

  image:caddy:
    desc: build + push the custom caddy edge image, print digest (deploy.yml caddy-build)
    dir: caddy
    cmds:
      - |
        tags=("$CADDY_IMAGE")
        if [ -n "${SEMVER:-}" ]; then tags+=("${CADDY_IMAGE%:*}:$SEMVER"); fi
        args=()
        for t in "${tags[@]}"; do args+=(-t "$t"); done
        # Same opt-in registry cache + reuse labels as image:backend.
        if [ -n "${BUILD_CACHE_REF:-}" ]; then
          args+=(--cache-from "type=registry,ref=$BUILD_CACHE_REF" \
                 --cache-to "type=registry,ref=$BUILD_CACHE_REF,mode=max")
        fi
        if [ -n "${BUILD_TREE:-}" ]; then args+=(--label "club.idol.build.tree=$BUILD_TREE"); fi
        if [ -n "${GITHUB_SHA:-}" ]; then args+=(--label "org.opencontainers.image.revision=$GITHUB_SHA"); fi
        docker buildx build --platform linux/amd64 --push "${args[@]}" \
          --metadata-file /tmp/caddy-image-metadata.json .
        jq -r '."containerimage.digest"' /tmp/caddy-image-metadata.json

  # ---------------- deploy choreography (deploy.yml deploy job) ----------

  deploy:k8s:
    desc: >-
      consume images.lock.json digests, S3 verify-or-rotate + app-env
      secret, kubeconfig fetch, tofu state settle, atomic helm upgrade,
      DNS sync (deploy.yml deploy)
    env:
      KUBECONFIG: '{{.KUBECONFIG | default "/tmp/idol-deploy-kubeconfig"}}'
      RELEASE_TAG: '{{.RELEASE_TAG | default ""}}'
      IMAGES_LOCK: '{{.IMAGES_LOCK | default "images.lock.json"}}'
    cmds:
      - |
        set -euo pipefail
        # Deploy is a pure images.lock.json consumer (images.yml maintains
        # the file): an un-built image cannot be deployed by construction.
        # The empty-digest guard stays as a loud second defense
        # (2026-10-13 InvalidImageName incident).
        BACKEND_DIGEST="$(jq -r '.backend.digest // empty' "$IMAGES_LOCK")"
        WEB_DIGEST="$(jq -r '.web.digest // empty' "$IMAGES_LOCK")"
        CADDY_DIGEST="$(jq -r '.caddy.digest // empty' "$IMAGES_LOCK")"
        [ -n "$BACKEND_DIGEST" ] \
          || { echo "backend digest missing or empty in $IMAGES_LOCK; refusing to deploy" >&2; exit 1; }
        [ -n "$WEB_DIGEST" ] \
          || { echo "web digest missing or empty in $IMAGES_LOCK; refusing to deploy" >&2; exit 1; }
        # The edge chart needs the custom caddy image. A chart-only merge
        # (chart/** triggers this workflow) can beat the caddy build to
        # the lock file: images.yml is already building it for this
        # commit, and merging the resulting bot/image-versions PR
        # re-fires this workflow — defer, never roll a half-deployable
        # edge ("code merges reach the cluster only when their image
        # lands in the lock file").
        if [ -z "$CADDY_DIGEST" ]; then
          echo "caddy digest not in $IMAGES_LOCK yet; deferring this deploy to the images.lock.json run (images.yml is building it)"
          exit 0
        fi
        # task runs each cmd in its own shell — hand the digests to the
        # helm cmd via state files (same pattern as the rotation flag).
        printf '%s\n' "$BACKEND_DIGEST" > /tmp/deploy-backend-digest
        printf '%s\n' "$WEB_DIGEST" > /tmp/deploy-web-digest
        printf '%s\n' "$CADDY_DIGEST" > /tmp/deploy-caddy-digest
        # Semver GHCR tags are applied at BUILD time by images.yml (tag
        # trigger) — deploys never touch the registry.
        uuid="$(curl -sS -H "Authorization: Bearer ${UPCLOUD_TOKEN}" \
          https://api.upcloud.com/1.3/kubernetes \
          | jq -r --arg c "$CLUSTER" '.[] | select(.name == $c) | .uuid')"
        test -n "$uuid" || { echo "cluster $CLUSTER not found" >&2; exit 1; }
        curl -sS -H "Authorization: Bearer ${UPCLOUD_TOKEN}" \
          "https://api.upcloud.com/1.3/kubernetes/${uuid}/kubeconfig" \
        | jq -r '.kubeconfig' > "$KUBECONFIG"
        chmod 600 "$KUBECONFIG"
      - |
        set -euo pipefail
        cd tofu
        # Quiet on purpose: this repo's Actions logs are public, and the
        # refresh lists every resource id (including the S3 access key id).
        # Non-fatal as before; only error lines are surfaced.
        tofu apply -auto-approve -refresh-only -input=false -no-color > /tmp/tofu-refresh.log 2>&1 \
          && echo "tofu refresh-only: $(grep -E '^Apply complete' /tmp/tofu-refresh.log || echo done)" \
          || { echo "tofu refresh-only failed (non-fatal):" >&2; grep -E '^(│ )?Error' /tmp/tofu-refresh.log >&2 || true; }
      - |
        set -euo pipefail
        cd tofu
        # s3_endpoint can lag service creation; refresh until it shows.
        ep=""
        i=0
        while [ "$i" -lt 5 ]; do
          ep="$(tofu output -raw s3_endpoint 2>/dev/null || true)"
          if [ -n "$ep" ] && [ "$ep" != "null" ]; then
            break
          fi
          tofu apply -auto-approve -refresh-only -input=false -no-color > /tmp/tofu-refresh.log 2>&1 || true
          sleep 20
          i=$((i + 1))
        done
        if [ -z "$ep" ] || [ "$ep" = "null" ]; then
          echo "warning: object storage endpoint not available; S3_ENDPOINT empty"
          ep=""
        fi
        # every UpCloud call names its stage and retries transient 4xx/5xx
        uc() { local label="$1" method="$2" url="$3" out="$4" code
          for attempt in 1 2 3; do
            code="$(curl -s -o "$out" -w '%{http_code}' -X "$method" -H "Authorization: Bearer $UPCLOUD_API_TOKEN" "$url")" || code="000"
            case "$code" in 2*) return 0;; 429|5*) sleep $((attempt * 5));; *)
              echo "upcloud $label -> HTTP $code"; sed -n '1,3p' "$out"; exit 1;;
            esac
          done
          echo "upcloud $label -> HTTP $code after retries"; exit 1
        }
        # Database-source gate, decided FIRST: on the CNPG-native shape
        # (recreate ruling) the managed service does not exist — its tofu
        # outputs and API calls must never run. The CNPG branch sets $db
        # below, next to the app-env synthesis.
        # State-truth detection: the CNPG-native tofu config has NO
        # app_database_uri output at all, so a missing output means CNPG.
        # (A runtime kubectl probe proved flaky across runner versions.)
        db_source="managed"
        if [ "${DATABASE_SOURCE:-auto}" = "cnpg" ] || { [ "${DATABASE_SOURCE:-auto}" = "auto" ] \
             && ! tofu output -raw app_database_uri >/dev/null 2>&1; }; then
          db_source="cnpg"
        fi
        if [ "$db_source" = "managed" ]; then
          db="$(tofu output -raw app_database_uri)"
          test -n "$db" || { echo "app_database_uri missing" >&2; exit 1; }
          # UpCloud may rotate managed-DB user passwords after the provider
          # creates them, so trust the API, not tofu state, for the app user's
          # password. Host/port stay from tofu output.
          uc db-list GET https://api.upcloud.com/1.3/database /tmp/uc1.json
          dbuuid="$(jq -r 'if type == "array" then . else [.database_services[]?] end | map(select(.name == "idol-canvas-db")) | .[0].uuid' /tmp/uc1.json)"
          test -n "$dbuuid" || { echo "database service not found via API" >&2; exit 1; }
          uc db-users GET "https://api.upcloud.com/1.3/database/$dbuuid/users" /tmp/uc2.json
          apppw="$(jq -r '(.users? // .)[] | select(.username == "app") | .password' /tmp/uc2.json)"
          test -n "$apppw" || { echo "app user password not found via API" >&2; exit 1; }
          db="$(printf '%s' "$db" | sed -E "s|//[^@]+@|//app:$apppw@|")"
        else
          echo "database source: cnpg — skipping managed-db outputs and API"
        fi
        # Object storage: trust the UpCloud API, not tofu state. The
        # provider can record a different endpoint or user key than the
        # service actually gets (seen on recreate), so fetch both from the
        # API, and refuse to ship an endpoint that does not resolve.
        uc os-list GET https://api.upcloud.com/1.3/object-storage-2 /tmp/uc3.json
        osuuid="$(jq -r 'if type == "array" then . else [.object_storages[]?] end | map(select(.name == "idol-canvas-objsto")) | .[0].uuid' /tmp/uc3.json)"
        test -n "$osuuid" || { echo "object storage not found via API" >&2; exit 1; }
        uc os-detail GET "https://api.upcloud.com/1.3/object-storage-2/$osuuid" /tmp/uc4.json
        oshost="$(jq -r '.endpoints[0].domain_name' /tmp/uc4.json)"
        test -n "$oshost" || { echo "objsto endpoint missing from API" >&2; exit 1; }
        dig +short "$oshost" | grep -qE '^[0-9]+\.' || { echo "objsto endpoint $oshost does not resolve" >&2; exit 1; }
        # Hand the verified coordinates to the helm cmd (own shell):
        # the Caddyfile storage block gets the same endpoint/bucket.
        printf '%s\n' "$oshost" > /tmp/deploy-oshost
        # INVARIANT: deploys never invalidate working S3 auth. This step
        # runs BEFORE helm upgrade: the cluster's current creds are probed
        # with a cheap signed ListObjects and kept when they work
        # (idempotent deploys, zero key churn); they are rotated ONLY on
        # 403 — while no pod has rolled yet, so the upgrade itself brings
        # every pod up on a live key. There is no window where pods hold
        # deleted keys. Anything other than 200/403 aborts untouched.
        rotate=true
        # Probe the creds the RUNNING PODS hold (deployment exec), not the
        # secret: the 38433144837 incident minted fresh creds into the
        # secret but died before any pod rolled — secret-valid/pod-dead is
        # exactly the state that must rotate. Fall back to the secret when
        # no pod is up yet (fresh installs).
        if kubectl -n idol get secret app-env > /dev/null 2>&1; then
          # One exec instead of four round trips: printenv prints the values
          # in argument order and exits non-zero if any is unset — then all
          # four stay empty and the secret fallback below applies, exactly
          # as when any single printenv came back empty.
          ak=""; sk=""; pep=""; pbucket=""
          if podenv="$(kubectl -n idol exec deployment/backend -- printenv S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_ENDPOINT S3_BUCKET 2>/dev/null)"; then
            ak="$(printf '%s\n' "$podenv" | sed -n 1p)"
            sk="$(printf '%s\n' "$podenv" | sed -n 2p)"
            pep="$(printf '%s\n' "$podenv" | sed -n 3p)"
            pbucket="$(printf '%s\n' "$podenv" | sed -n 4p)"
          fi
          if [ -z "$ak" ] || [ -z "$sk" ] || [ -z "$pep" ] || [ -z "$pbucket" ]; then
            ak="$(kubectl -n idol get secret app-env -o jsonpath='{.data.S3_ACCESS_KEY_ID}' | base64 -d)"
            sk="$(kubectl -n idol get secret app-env -o jsonpath='{.data.S3_SECRET_ACCESS_KEY}' | base64 -d)"
            pep="$(kubectl -n idol get secret app-env -o jsonpath='{.data.S3_ENDPOINT}' | base64 -d)"
            pbucket="$(kubectl -n idol get secret app-env -o jsonpath='{.data.S3_BUCKET}' | base64 -d)"
          fi
          if [ -n "$ak" ] && [ -n "$sk" ] && [ -n "$pep" ] && [ -n "$pbucket" ]; then
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              --aws-sigv4 'aws:amz:us-east-1:s3' -u "$ak:$sk" \
              "$pep/$pbucket?list-type=2&max-keys=1" || echo 000)"
            case "$code" in
              200) rotate=false ;;
              403) rotate=true ;;
              *)
                echo "s3 auth probe inconclusive (HTTP $code); refusing to churn or ship" >&2
                exit 1
                ;;
            esac
          fi
        fi
        if [ "$rotate" = true ]; then
          # Rotation order is CREATE -> VERIFY LIVE -> DELETE OLD. The old
          # delete-then-create order (run 38439690036) deleted the live
          # key and then died on a failed/empty mint, leaving prod with
          # zero valid keys — and every later deploy re-entered the same
          # broken rotate on its 403 probe.
          uc key-list GET "https://api.upcloud.com/1.3/object-storage-2/$osuuid/users/app/access-keys" /tmp/uc6.json
          # go-task runs cmds in its interpreted shell (mvdan-sh), where
          # `mapfile -t x < <(...)` silently leaves x unset -> unbound
          # variable under set -u (run 38465310743). Plain assignment +
          # word-splitting; access key ids are hex with no whitespace.
          oldkeys="$(jq -r '.[].access_key_id' /tmp/uc6.json)"
          echo "existing access keys before rotation: $(jq 'length' /tmp/uc6.json)"
          # CREATE first: the 2-key quota still has room while the old
          # keys exist, and a failed mint leaves prod credentials intact.
          uc key-create POST "https://api.upcloud.com/1.3/object-storage-2/$osuuid/users/app/access-keys" /tmp/uc5.json
          sak="$(jq -r .access_key_id /tmp/uc5.json)"
          ssk="$(jq -r .secret_access_key /tmp/uc5.json)"
          if [ -z "$ssk" ]; then
            echo "key-create failed; verbatim response body (secret redacted):" >&2
            sed -E 's/("secret_access_key"[[:space:]]*:[[:space:]]*")[^"]*/\1REDACTED/g; s/("access_key_id"[[:space:]]*:[[:space:]]*")[^"]*/\1REDACTED/g' /tmp/uc5.json >&2 || echo "(empty body)" >&2
            exit 1
          fi
          # VERIFY the new pair with a signed ListObjects BEFORE anything
          # is deleted; on failure abort with old keys (and prod) intact.
          vcode="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            --aws-sigv4 'aws:amz:us-east-1:s3' -u "$sak:$ssk" \
            "https://$oshost/$(tofu output -raw s3_bucket)?list-type=2&max-keys=1" || echo 000)"
          if [ "$vcode" != "200" ]; then
            echo "new access key failed live verify (HTTP $vcode); old keys left intact, refusing to rotate" >&2
            exit 1
          fi
          # Only now delete the old keys (empty list -> no iterations).
          for old in $oldkeys; do
            uc key-del DELETE "https://api.upcloud.com/1.3/object-storage-2/$osuuid/users/app/access-keys/$old" /tmp/uc7.json
            echo "deleted old access key ${old:0:8}…"
          done
          sleep 3
          uc key-list GET "https://api.upcloud.com/1.3/object-storage-2/$osuuid/users/app/access-keys" /tmp/uc8.json
          nkeys="$(jq 'length' /tmp/uc8.json)"
          [ "$nkeys" = "1" ] \
            || { echo "orphaned access keys after rotation ($nkeys remain): $(jq -r '.[].access_key_id' /tmp/uc8.json | head -3)" >&2; exit 1; }
        else
          sak="$ak"
          ssk="$sk"
        fi
        echo "s3 auth: $([ "$rotate" = true ] && echo rotated || echo verified-working)"
        echo "$rotate" > /tmp/deploy-s3-rotated
        # Fresh clusters have no namespaces yet (helm --create-namespace only
        # helps the helm cmd; every kubectl apply before it needs this first).
        kubectl create namespace idol --dry-run=client -o yaml | kubectl apply -f -
        # DATABASE_URL source gate (decision made at the top of this cmd:
        # db_source). CNPG-native recreate: initdb (owner: app) generated
        # the app password into cnpg-app-creds — that secret is the source
        # of truth. Legacy pre-recreate cutovers carried creds from the
        # old app-env URL instead.
        if [ "$db_source" = "cnpg" ]; then
          # CNPG-native recreate: initdb (owner: app) generated the app
          # password into cnpg-app-creds — that secret is the source of
          # truth. Pre-recreate cutovers (legacy path) carried creds from
          # the old app-env URL instead.
          appuser="$(kubectl -n idol get secret cnpg-app-creds -o jsonpath='{.data.username}' 2>/dev/null | base64 -d || true)"
          apppass="$(kubectl -n idol get secret cnpg-app-creds -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || true)"
          if [ -z "$appuser" ] || [ -z "$apppass" ]; then
            oldurl="$(kubectl -n idol get secret app-env -o jsonpath='{.data.DATABASE_URL}' 2>/dev/null | base64 -d || true)"
            test -n "$oldurl" || { echo "CNPG source selected but neither cnpg-app-creds nor an app-env DATABASE_URL exists" >&2; exit 1; }
            appuser="$(printf '%s' "$oldurl" | sed -E 's#^[a-z]+://([^:@/]+):[^@]*@.*#\1#')"
            apppass="$(printf '%s' "$oldurl" | sed -E 's#^[a-z]+://[^:@/]+:([^@]+)@.*#\1#')"
          fi
          test -n "$appuser" && test -n "$apppass" || { echo "could not resolve app credentials for the CNPG path" >&2; exit 1; }
          db="postgresql://${appuser}:${apppass}@idol-db-rw.idol.svc:5432/idol-canvas"
          echo "database source: cnpg (idol-db-rw)"
        else
          echo "database source: managed (tofu outputs)"
        fi
        # prod registration closed until an admin approves the account
        kubectl -n idol create secret generic app-env \
          --from-literal="DATABASE_URL=$db" \
          --from-literal="S3_ENDPOINT=https://$oshost" \
          --from-literal="S3_BUCKET=$(tofu output -raw s3_bucket)" \
          --from-literal="S3_ACCESS_KEY_ID=$sak" \
          --from-literal="S3_SECRET_ACCESS_KEY=$ssk" \
          --from-literal="REGISTRATION_APPROVAL_REQUIRED=true" \
          --from-literal="SESSION_SECRET=$SESSION_SECRET" \
          --dry-run=client -o yaml | kubectl apply -f -
        # PG15+ revoked CREATE on schema public from PUBLIC, and the tofu
        # logical database is owned by the admin user, so on a fresh
        # instance backend migrations die with "permission denied for
        # schema public" (run 38466837880). Hand the app role the database
        # and the schema. Idempotent; runs on every deploy. Skipped once
        # the CNPG Cluster is the database source — the grant targets the
        # MANAGED service's admin account, which the cutover retires.
        if [ "$db_source" = "managed" ]; then
        adminuser="$(jq -r '(.users? // .)[] | select(.type == "primary") | .username' /tmp/uc2.json)"
        adminpw="$(jq -r '(.users? // .)[] | select(.type == "primary") | .password' /tmp/uc2.json)"
        test -n "$adminuser" && test -n "$adminpw" || { echo "primary db user not found via API" >&2; exit 1; }
        adminuri="$(printf '%s' "$db" | sed -E "s|//[^@]+@|//$adminuser:$adminpw@|")"
        kubectl -n idol delete pod schema-grant --ignore-not-found >/dev/null 2>&1 || true
        kubectl -n idol run schema-grant --restart=Never --image=postgres:16-alpine \
          --env="PGURI=$adminuri" \
          --env="SQL=ALTER DATABASE app OWNER TO app; GRANT ALL ON SCHEMA public TO app;" \
          -- sh -c 'psql "$PGURI" -v ON_ERROR_STOP=1 -c "$SQL"' >/dev/null
        kubectl -n idol wait --for=jsonpath='{.status.phase}'=Succeeded pod/schema-grant --timeout=180s \
          || { kubectl -n idol logs schema-grant >&2 || true; kubectl -n idol delete pod schema-grant --force --grace-period=0 --ignore-not-found >/dev/null 2>&1 || true; exit 1; }
        kubectl -n idol logs schema-grant
        kubectl -n idol delete pod schema-grant --force --grace-period=0 --ignore-not-found >/dev/null 2>&1 || true
        else
          echo "schema-grant skipped (database source: cnpg)"
        fi
      - |
        set -euo pipefail
        # chart/caddy/Caddyfile is the source of truth for the edge and
        # helm-templated (object-storage coordinates); web/Caddyfile
        # only covers stock-caddy local dev. No sync step anymore.
        # Digests were derived and guarded in the first cmd; each task
        # cmd is its own shell, so read them back from the state files.
        BACKEND_DIGEST="$(cat /tmp/deploy-backend-digest)"
        WEB_DIGEST="$(cat /tmp/deploy-web-digest)"
        CADDY_DIGEST="$(cat /tmp/deploy-caddy-digest)"
        # Cluster Autoscaler credential — the chart reads it only when
        # clusterAutoscaler.enabled; provisioning it on every deploy
        # keeps that flip a values-only change.
        kubectl -n idol create secret generic upcloud-autoscaler \
          --from-literal="token=${UPCLOUD_API_TOKEN}" \
          --dry-run=client -o yaml | kubectl apply -f -
        ARGS=()
        # Release semver (audit trail in helm values / rollout annotations;
        # the digest stays the actual image pin — GHCR tags are mutable).
        if [ -n "$RELEASE_TAG" ]; then
          ARGS+=(--set-string images.backend.tag="$RELEASE_TAG" \
                 --set-string images.web.tag="$RELEASE_TAG" \
                 --set-string images.caddy.tag="$RELEASE_TAG")
        fi
        # Cluster uuid for the Cluster Autoscaler (unused while
        # clusterAutoscaler.enabled is false).
        cluster_id="$(curl -sS -H "Authorization: Bearer ${UPCLOUD_API_TOKEN}" \
          https://api.upcloud.com/1.3/kubernetes \
          | jq -r --arg c "$CLUSTER" '.[] | select(.name == $c) | .uuid')"
        ARGS+=(--set-string clusterAutoscaler.clusterId="$cluster_id")
        # Edge certificates/ACME state: the Caddyfile storage block gets
        # the object-storage coordinates from the same API-verified
        # values the app-env secret uses (oshost persisted above;
        # bucket straight from tofu outputs).
        ARGS+=(--set-string edgeStorage.endpoint="https://$(cat /tmp/deploy-oshost)" \
               --set-string edgeStorage.bucket="$(tofu -chdir=tofu output -raw s3_bucket)")
        helm upgrade --install idol chart/ \
          --namespace idol --create-namespace --atomic --wait --timeout 15m \
          --take-ownership \
          --set-string images.backend.digest="$BACKEND_DIGEST" \
          --set-string images.web.digest="$WEB_DIGEST" \
          --set-string images.caddy.digest="$CADDY_DIGEST" \
          "${ARGS[@]}"
        if [ "$(cat /tmp/deploy-s3-rotated 2>/dev/null || echo false)" = "true" ]; then
          # The S3 key was rotated above (before the upgrade); if this
          # upgrade was a no-op for pods, roll the backend so nothing
          # keeps running on the deleted key.
          kubectl -n idol rollout restart deployment/backend
          kubectl -n idol rollout status deployment/backend --timeout=180s
        fi
      - |
        set -euo pipefail
        ips=""
        n=0
        while [ -z "$ips" ] && [ "$n" -lt 30 ]; do
          # `get svc web -o json` returns the bare Service object (no
          # .items) — iterate .status.loadBalancer.ingress directly and
          # guard every step: the CCM populates it moments AFTER the
          # upgrade returns (the jq-null-after-rollout signature).
          ips="$( (kubectl -n idol get svc web -o json 2>/dev/null \
            || echo '{}') \
            | jq -r '.status.loadBalancer.ingress // [] | .[]? | (.ip // .hostname)')"
          [ -n "$ips" ] || sleep 10
          n=$((n + 1))
        done
        if [ -z "$ips" ]; then
          echo "LoadBalancer IP never assigned" >&2
          exit 1
        fi
        # CCM may expose an ip or a dns hostname per ingress entry.
        # getent (NSS) is unreliable on some runners for *.upcloudlb.com;
        # fall through to dig and then python's getaddrinfo.
        addrs=""
        for entry in $ips; do
          case "$entry" in
            *.*.*|*:*) addrs="$addrs $entry" ;;
            *)
              a="$(getent ahosts "$entry" 2>/dev/null | awk '{print $1}' | sort -u | tr '\n' ' ')"
              [ -n "$a" ] || a="$(dig +short A "$entry" 2>/dev/null | grep -E '^[0-9.]+$' | tr '\n' ' ')"
              [ -n "$a" ] || a="$(python3 -c 'import socket,sys; print(" ".join(x[4][0] for x in socket.getaddrinfo(sys.argv[1], None)))' "$entry" 2>/dev/null)"
              addrs="$addrs $a"
              ;;
          esac
        done
        ipv4="$(printf '%s\n' "$addrs" | tr ' ' '\n' | grep '\.' | head -1 || true)"
        ipv6="$(printf '%s\n' "$addrs" | tr ' ' '\n' | grep ':' | head -1 || true)"
        if [ -z "$ipv4" ]; then
          echo "no IPv4 address on LB" >&2
          exit 1
        fi
        ./scripts/sync-dns.sh "$ipv4" ${ipv6:+"$ipv6"}

  # ---------------- CloudNativePG migration (staged) ----------------
  # Run order: cnpg:node-scale -> cnpg:operator:install ->
  # cnpg:cluster:secret -> cnpg:cluster:install -> cnpg:cutover:dump ->
  # cnpg:cutover:restore -> cnpg:cutover:switch -> cnpg:cutover:verify
  # -> cnpg:destroy-managed (LAST, after the deploy.yml follow-up has
  # stopped sourcing DATABASE_URL from the managed-pg tofu outputs).
  # Env contract: UPCLOUD_TOKEN + CLUSTER (UpCloud API, as
  # infra:delete-lbs), KUBECONFIG (as deploy:k8s), MANAGED_PG_URI
  # (tofu output pg_admin_uri, for the dump only).

  cnpg:node-scale:
    desc: bump the worker node group to 3 (one-time; tofu ignores the drift)
    cmds:
      - |
        set -o pipefail; set -e
        uuid="$(curl -sS -H "Authorization: Bearer ${UPCLOUD_TOKEN}" \
          https://api.upcloud.com/1.3/kubernetes \
          | jq -r --arg c "$CLUSTER" '.[] | select(.name == $c) | .uuid')"
        test -n "$uuid" || { echo "cluster $CLUSTER not found" >&2; exit 1; }
        curl -sS -X PATCH -H "Authorization: Bearer ${UPCLOUD_TOKEN}" \
          -H "Content-Type: application/json" \
          -d '{"node_groups":[{"name":"default","count":3}]}' \
          "https://api.upcloud.com/1.3/kubernetes/${uuid}" \
          | jq -r '.node_groups[] | "\(.name) count=\(.count)"'
        echo "wait for the third node to join: kubectl get nodes -w"

  cnpg:operator:install:
    desc: apply the digest-pinned CNPG operator manifest and kubeconform it
    cmds:
      - |
        set -o pipefail; set -e
        # Offline schema gate on the pinned artifact. CRDs have no
        # upstream json-schema (kubeconform can only skip them); their
        # structural validation happens at apply time on the API server.
        # Everything else (Deployment/RBAC/Webhook) is strict-validated.
        kubeconform -strict -summary -ignore-missing-schemas \
          -kubernetes-version 1.32.0 chart/cnpg/cnpg-operator-1.29.3.yaml
        # Provenance guard: the committed manifest must equal upstream
        # v1.29.3 with ONLY the image-digest rewrite applied, below the
        # fixed 13-line provenance header.
        got="$(curl -sL https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.29.3/cnpg-1.29.3.yaml \
          | sed 's#ghcr.io/cloudnative-pg/cloudnative-pg:1\.29\.3#ghcr.io/cloudnative-pg/cloudnative-pg@sha256:cc0594bd9fd8cdd654dfbd91e4cf2c8fc1bfc4e3a09c4a90a2ab4ffc524f1db5#g' \
          | sha256sum | cut -d' ' -f1)"
        want="$(tail -n +14 chart/cnpg/cnpg-operator-1.29.3.yaml | sha256sum | cut -d' ' -f1)"
        test "$got" = "$want" \
          || { echo "pinned operator manifest drifted from upstream v1.29.3 + digest rewrite" >&2; exit 1; }
        kubectl apply --server-side --force-conflicts --field-manager=cnpg-operator -f chart/cnpg/cnpg-operator-1.29.3.yaml
        kubectl -n cnpg-system rollout status deploy/cnpg-controller-manager --timeout=180s

  cnpg:cluster:secret:
    desc: create the CNPG superuser secret (idempotent; operator creds)
    cmds:
      - |
        set -o pipefail; set -e
        # Bootstrap credential: generated once here, never deploy-side.
        if kubectl -n idol get secret cnpg-pg-superuser >/dev/null 2>&1; then
          echo "cnpg-pg-superuser already exists; leaving it untouched"
        else
          pw="$(openssl rand -base64 24 | tr -d '\n')"
          kubectl -n idol create secret generic cnpg-pg-superuser \
            --from-literal=username=postgres --from-literal=password="$pw"
          echo "created cnpg-pg-superuser"
        fi

  cnpg:backup:secret:
    desc: copy live S3 keys + endpoint into cnpg-backup-s3 (idempotent)
    cmds:
      - |
        set -o pipefail; set -e
        # Runtime state, not re-minted: the app's proven S3 credentials
        # gain a second consumer (Barman Cloud WAL/base backups).
        # Fresh-cluster order falls back to the just-applied tofu outputs.
        ak="$(kubectl -n idol exec deployment/backend -- printenv S3_ACCESS_KEY_ID 2>/dev/null || kubectl -n idol get secret app-env -o jsonpath='{.data.S3_ACCESS_KEY_ID}' 2>/dev/null | base64 -d || tofu -chdir=tofu output -raw s3_access_key_id 2>/dev/null || true)"
        sk="$(kubectl -n idol exec deployment/backend -- printenv S3_SECRET_ACCESS_KEY 2>/dev/null || kubectl -n idol get secret app-env -o jsonpath='{.data.S3_SECRET_ACCESS_KEY}' 2>/dev/null | base64 -d || tofu -chdir=tofu output -raw s3_secret_access_key 2>/dev/null || true)"
        ep="$(kubectl -n idol exec deployment/backend -- printenv S3_ENDPOINT 2>/dev/null || kubectl -n idol get secret app-env -o jsonpath='{.data.S3_ENDPOINT}' 2>/dev/null | base64 -d || tofu -chdir=tofu output -raw s3_endpoint 2>/dev/null || true)"
        test -n "$ak" && test -n "$sk" && test -n "$ep" \
          || { echo "could not source S3 credentials" >&2; exit 1; }
        kubectl -n idol create secret generic cnpg-backup-s3 \
          --from-literal="ACCESS_KEY_ID=$ak" \
          --from-literal="SECRET_ACCESS_KEY=$sk" \
          --from-literal="S3_ENDPOINT=$ep" \
          --dry-run=client -o yaml | kubectl apply -f -
        echo "cnpg-backup-s3 ready (endpoint: $ep)"

  cnpg:cluster:install:
    desc: render the Cluster CR, server-dry-run it, then apply
    cmds:
      - |
        set -o pipefail; set -e
        # helm lookup can miss freshly-written secrets; hand the endpoint
        # explicitly from the backup secret (set by cnpg:backup:secret).
        ep="$(kubectl -n idol get secret cnpg-backup-s3 -o jsonpath='{.data.S3_ENDPOINT}' | base64 -d)"
        test -n "$ep" || { echo "cnpg-backup-s3 missing S3_ENDPOINT" >&2; exit 1; }
        helm template chart --show-only templates/cnpg-cluster.yaml \
          --set cnpg.enabled=true \
          --set-string cnpg.backup.endpointURL="$ep" > /tmp/cnpg-cluster.yaml
        kubectl apply --dry-run=server -f /tmp/cnpg-cluster.yaml
        kubectl apply -f /tmp/cnpg-cluster.yaml
        kubectl -n idol wait cluster.idol-db --for=condition=Ready --timeout=600s \
          || kubectl -n idol get pods -l cnpg.io/cluster=idol-db

  cnpg:cutover:dump:
    desc: pg_dump -Fc the managed DB while prod still serves from it
    cmds:
      - |
        set -o pipefail; set -e
        test -n "${MANAGED_PG_URI:-}" \
          || { echo "MANAGED_PG_URI env required (tofu output pg_admin_uri)" >&2; exit 1; }
        kubectl -n idol delete pod cnpg-cutover --ignore-not-found --force --grace-period=0 >/dev/null 2>&1 || true
        kubectl -n idol run cnpg-cutover --restart=Never \
          --image=postgres:16-alpine --env="SRC=$MANAGED_PG_URI" \
          -- sh -c 'pg_dump "$SRC" -Fc -f /tmp/idol-canvas.dump && ls -l /tmp/idol-canvas.dump'
        kubectl -n idol wait --for=condition=complete pod/cnpg-cutover --timeout=600s
        kubectl -n idol cp cnpg-cutover:/tmp/idol-canvas.dump /tmp/idol-canvas.dump
        ls -l /tmp/idol-canvas.dump

  cnpg:cutover:restore:
    desc: recreate the app role and restore the dump (owned by the app role)
    cmds:
      - |
        set -o pipefail; set -e
        # The live app credential carries over so the DATABASE_URL swap
        # changes the host only. app-env stores the URI with the creds
        # inline (no PGUSER/PGPASSWORD keys) — parse them out.
        OLDURL="$(kubectl -n idol get secret app-env -o jsonpath='{.data.DATABASE_URL}' | base64 -d)"
        APPUSER="$(printf '%s' "$OLDURL" | sed -E 's#^[a-z]+://([^:@/]+):[^@]*@.*#\1#')"
        APPPW="$(printf '%s' "$OLDURL" | sed -E 's#^[a-z]+://[^:@/]+:([^@]+)@.*#\1#')"
        SUPPW="$(kubectl -n idol get secret cnpg-pg-superuser -o jsonpath='{.data.password}' | base64 -d)"
        test -f /tmp/idol-canvas.dump || { echo "run cnpg:cutover:dump first" >&2; exit 1; }
        kubectl -n idol delete pod cnpg-restore --ignore-not-found --force --grace-period=0 >/dev/null 2>&1 || true
        # 1) Role setup: env-passed SQL, no shell quoting pitfalls.
        kubectl -n idol run cnpg-restore --restart=Never \
          --image=postgres:16-alpine \
          --env="PGSUP=postgresql://postgres:$SUPPW@idol-db-rw:5432/idol-canvas" \
          --env="ROLESQL=DROP ROLE IF EXISTS $APPUSER; CREATE ROLE $APPUSER LOGIN PASSWORD '$APPPW';" \
          -- sh -c 'pg_isready -h idol-db-rw -t 60 \
            && psql "$PGSUP" -v ON_ERROR_STOP=1 -c "$ROLESQL"'
        kubectl -n idol wait --for=condition=complete pod/cnpg-restore --timeout=120s
        kubectl -n idol logs cnpg-restore | tail -1
        # 2) Restore as superuser with --no-owner --role so every object
        # lands owned by the app role — no post-restore GRANT churn.
        kubectl -n idol delete pod cnpg-restore --ignore-not-found --force --grace-period=0
        kubectl -n idol run cnpg-restore --restart=Never \
          --image=postgres:16-alpine \
          --env="SUPPW=$SUPPW" --env="APPUSER=$APPUSER" \
          --command -- sleep infinity
        kubectl -n idol wait --for=condition=ready pod/cnpg-restore --timeout=120s
        kubectl -n idol cp /tmp/idol-canvas.dump cnpg-restore:/tmp/idol-canvas.dump
        set +e
        kubectl -n idol exec cnpg-restore -- sh -c \
          'PGPASSWORD="$SUPPW" pg_restore -h idol-db-rw -U postgres -d idol-canvas \
             --no-owner --role="$APPUSER" --if-exists /tmp/idol-canvas.dump 2>&1' \
          | grep -vE "^pg_restore: (notice|warning)" | tail -5
        rc=${PIPESTATUS[0]}
        set -e
        kubectl -n idol delete pod cnpg-restore --force --grace-period=0 >/dev/null 2>&1 || true
        test "$rc" = 0 || { echo "pg_restore failed (rc=$rc)" >&2; exit "$rc"; }
        echo "restore complete"

  cnpg:cutover:switch:
    desc: repoint app-env DATABASE_URL at the CNPG -rw service and roll
    cmds:
      - |
        set -o pipefail; set -e
        OLDURL="$(kubectl -n idol get secret app-env -o jsonpath='{.data.DATABASE_URL}' | base64 -d)"
        APPUSER="$(printf '%s' "$OLDURL" | sed -E 's#^[a-z]+://([^:@/]+):[^@]*@.*#\1#')"
        APPPW="$(printf '%s' "$OLDURL" | sed -E 's#^[a-z]+://[^:@/]+:([^@]+)@.*#\1#')"
        DBNAME="$(printf '%s' "$OLDURL" | sed -E 's#.*/([^/?]+)(\?.*)?$#\1#')"
        NEWURL="postgresql://$APPUSER:$APPPW@idol-db-rw.idol.svc:5432/$DBNAME"
        kubectl -n idol patch secret app-env -p "{\"stringData\":{\"DATABASE_URL\":\"$NEWURL\"}}"
        kubectl -n idol rollout restart deploy/backend
        kubectl -n idol rollout status deploy/backend --timeout=300s
        curl -s https://idol-appreciation.club/api/health && echo

  cnpg:cutover:verify:
    desc: post-switch receipts — health, placements, dig, tile, row count
    cmds:
      - |
        set -o pipefail; set -e
        echo "health: $(curl -s https://idol-appreciation.club/api/health)"
        echo "placements-near: $(curl -s -o /dev/null -w '%{http_code}' 'https://idol-appreciation.club/api/placements/near?x=134217728&y=134217728')"
        echo "tile z16: $(curl -s -o /dev/null -w '%{http_code}' https://idol-appreciation.club/api/tiles/16/32768/32768.webp)"
        OLDURL="$(kubectl -n idol get secret app-env -o jsonpath='{.data.DATABASE_URL}' | base64 -d)"
        APPUSER="$(printf '%s' "$OLDURL" | sed -E 's#^[a-z]+://([^:@/]+):[^@]*@.*#\1#')"
        APPPW="$(printf '%s' "$OLDURL" | sed -E 's#^[a-z]+://[^:@/]+:([^@]+)@.*#\1#')"
        DBNAME="$(printf '%s' "$OLDURL" | sed -E 's#.*/([^/?]+)(\?.*)?$#\1#')"
        kubectl -n idol delete pod cnpg-verify --ignore-not-found --force --grace-period=0 >/dev/null 2>&1 || true
        kubectl -n idol run cnpg-verify --restart=Never --image=postgres:16-alpine \
          --env="PGURI=postgresql://$APPUSER:$APPPW@idol-db-rw.idol.svc:5432/$DBNAME" \
          -- sh -c 'psql "$PGURI" -t -c "SELECT '"'"'placements: '"'"' || count(*) FROM placements"'
        sleep 8; kubectl -n idol logs cnpg-verify
        kubectl -n idol delete pod cnpg-verify --force --grace-period=0 >/dev/null 2>&1

  cnpg:destroy-managed:
    desc: retire the managed Postgres (LAST; after deploy.yml follow-up)
    dir: tofu
    cmds:
      - |
        set -o pipefail; set -e
        echo "GUARD: confirm deploy.yml no longer sources DATABASE_URL from managed-pg outputs before running this" >&2
        tofu destroy -auto-approve -input=false \
          -target=upcloud_managed_database_logical_database.app \
          -target=upcloud_managed_database_user.app \
          -target=upcloud_managed_database_postgresql.this

  # ---------------- KEDA (phase 5 worker pool; staged) ----------------
  # Run order: keda:operator:install (once, any time) ->
  # worker.autoscaling.enabled=true in values (only after Phase 4's
  # worker Deployment + the render_jobs table exist) -> deploy.

  keda:operator:install:
    desc: apply the digest-pinned KEDA manifest and kubeconform it
    cmds:
      - |
        set -o pipefail; set -e
        # Offline schema gate on the pinned artifact. CRDs have no
        # upstream json-schema (kubeconform can only skip them); their
        # structural validation happens at apply time on the API server.
        # Everything else (Deployment/RBAC/Webhook) is strict-validated.
        kubeconform -strict -summary -ignore-missing-schemas \
          -kubernetes-version 1.32.0 chart/keda/keda-operator-2.21.0.yaml
        # Provenance guard: the committed manifest must equal upstream
        # v2.21.0 with ONLY the three image-digest rewrites applied,
        # below the fixed 18-line provenance header.
        got="$(curl -sL https://github.com/kedacore/keda/releases/download/v2.21.0/keda-2.21.0.yaml \
          | sed -e 's#ghcr.io/kedacore/keda:2\.21\.0#ghcr.io/kedacore/keda@sha256:81fe6547ce8d1cc29273f887b76507e9b853e5bc1f875ec23fe60061a38ed809#' -e 's#ghcr.io/kedacore/keda-metrics-apiserver:2\.21\.0#ghcr.io/kedacore/keda-metrics-apiserver@sha256:255375037fe592732eeb554743aae360c2da88cf0b9b1258d0a987ef885f0881#' -e 's#ghcr.io/kedacore/keda-admission-webhooks:2\.21\.0#ghcr.io/kedacore/keda-admission-webhooks@sha256:e1969628cca6123e32eea13c47c75817091af2657fa68d9d0d58a8620d1b75b1#' \
          | sha256sum | cut -d' ' -f1)"
        want="$(tail -n +19 chart/keda/keda-operator-2.21.0.yaml | sha256sum | cut -d' ' -f1)"
        test "$got" = "$want" \
          || { echo "pinned KEDA manifest drifted from upstream v2.21.0 + digest rewrites" >&2; exit 1; }
        kubectl apply --server-side --force-conflicts --field-manager=keda-operator -f chart/keda/keda-operator-2.21.0.yaml
        kubectl -n keda rollout status deploy/keda-operator --timeout=180s
        kubectl -n keda rollout status deploy/keda-metrics-apiserver --timeout=180s

  keda:scaledobject:install:
    desc: server-dry-run the rendered ScaledObject, then apply it
    cmds:
      - |
        set -o pipefail; set -e
        # The ScaledObject is a CRD instance: no offline kubeconform
        # schema, so validation is server-side, exactly like the CNPG
        # Cluster (cnpg:cluster:install). Catches a stale CRD or a
        # missing scale target before the real apply.
        helm template chart --show-only templates/worker-scaledobject.yaml > /tmp/worker-scaledobject.yaml
        test -s /tmp/worker-scaledobject.yaml \
          || { echo "worker-scaledobject.yaml rendered empty; is worker.autoscaling.enabled set?" >&2; exit 1; }
        kubectl apply --dry-run=server -f /tmp/worker-scaledobject.yaml
        kubectl apply -f /tmp/worker-scaledobject.yaml
        # Name mirrors values.yaml worker.deploymentName (the contract).
        kubectl -n idol get scaledobject worker -o wide
  # ---------------- phase 5 baseline retune (GATED) ----------------
  # GATE: run only after the Phase 4 lane confirms the API image ships
  # without libvips (docs/scaling-architecture.md phased-rollout gate).
  # The old 4 vCPU / 8 GB `default` group is replaced by the 2 vCPU /
  # 4 GB `baseline` group via create -> drain -> destroy, never by
  # in-place plan changes (UpCloud plan updates roll every node).
  # Rollback at every step: the release keeps scheduling onto whatever
  # nodes exist; `tofu destroy -target=…baseline` + uncordon restores
  # the old shape. Env contract: UPCLOUD_TOKEN/CLUSTER (as
  # infra:delete-lbs), KUBECONFIG (as deploy:k8s).

  infra:retune-baseline:
    desc: staged baseline retune (GATED on phase 4; create -> drain -> destroy)
    cmds:
      - |
        set -o pipefail; set -e
        if [ "${GATE:-}" != "phase4-libvips-gone" ]; then
          echo "GATED: re-run with GATE=phase4-libvips-gone once the Phase 4 lane confirms the API image ships without libvips" >&2
          exit 1
        fi
        cd tofu && tofu apply -auto-approve -target=upcloud_kubernetes_node_group.baseline -input=false
        cd ..
        uuid="$(curl -sS -H "Authorization: Bearer ${UPCLOUD_TOKEN}" \
          https://api.upcloud.com/1.3/kubernetes \
          | jq -r --arg c "$CLUSTER" '.[] | select(.name == $c) | .uuid')"
        test -n "$uuid" || { echo "cluster not found" >&2; exit 1; }
        echo "waiting for 3 pool=baseline nodes to become Ready (UpCloud provisions the group)"
        kubectl wait --for=condition=Ready node -l pool=baseline --timeout=20m --all 2>/dev/null \
          || { echo "baseline nodes never went Ready; ROLLBACK: tofu destroy -target=upcloud_kubernetes_node_group.baseline" >&2; exit 1; }
        cnpg_ok() { # 3 db pods, all Running, all on DISTINCT nodes
          kubectl -n idol get pods -l cnpg.io/cluster=idol-db --field-selector=status.phase=Running --no-headers \
            | awk '{print $7}' | sort -u | wc -l | grep -q 3
        }
        old_nodes() { kubectl get nodes -o json | jq -r '.items[] | select(.metadata.labels["pool"] != "baseline") | .metadata.name'; }
        for node in $(old_nodes); do
          echo "== cordoning + draining $node"
          kubectl cordon "$node"
          kubectl drain "$node" --ignore-daemonsets --delete-emptydir-data --timeout=10m \
            || { echo "drain failed; ROLLBACK: kubectl uncordon $node (nothing destroyed)" >&2; exit 1; }
          sleep 30
          cnpg_ok || { echo "CNPG instances not one-per-node after draining $node — INVESTIGATE before continuing (rollback: kubectl uncordon $node)" >&2; exit 1; }
        done
        echo "== all old nodes drained and Cordoned; baseline carries the whole stack"
        echo "== next (manual, in order):"
        echo "   1. enable descheduler (values descheduler.enabled=true) + deploy"
        echo "   2. soak, then: tofu destroy -target=upcloud_kubernetes_node_group.this"
        echo "   3. remove the 'this' group + var.node_* from tofu (cutover commit)"

  # ---------------- e2e (e2e.yml) ----------------

  web:e2e:
    desc: playwright e2e, smoke then full (e2e.yml)
    dir: web
    deps: [web:install]
    cmds:
      - ./node_modules/.bin/playwright install --with-deps chromium
      # @smoke always runs; @full self-skips if /api/health is not green.
      - ./node_modules/.bin/playwright test --config e2e/playwright.config.ts --grep @smoke
      - ./node_modules/.bin/playwright test --config e2e/playwright.config.ts

  # ---------------- backend image (internal) ----------------

  backend:image:
    internal: true
    desc: build the pinned libvips 8.16.1 gate image (repo builder + fmt/clippy)
    dir: backend
    cmds:
      - '{{.RUNNER}} build --target builder -t {{.IMAGE}}-base .'
      - |
        {{.RUNNER}} build -t {{.IMAGE}} -f - . <<'DOCKERFILE'
        FROM {{.IMAGE}}-base
        # rust:trixie ships a minimal-profile toolchain (no rustfmt/clippy).
        # Added in an overlay so the repo Dockerfile stays the backend team's
        # single definition of the builder; this layer is cache-stable.
        RUN rustup component add rustfmt clippy
        DOCKERFILE

  # ---------------- bootstrap + aggregate ----------------

  web:install:
    desc: install web dependencies with the pinned pnpm (frozen lockfile)
    dir: web
    cmds:
      # node/pnpm resolve from devEngines here (not the root mise.toml), so
      # materialize them before pnpm runs — CI shims only exist for
      # root-config tools until this happens.
      - mise install
      - pnpm install --frozen-lockfile

  ci:
    desc: full local CI gate set (everything ci.yml runs)
    deps:
      - lint:md
      - lint:workflows
      - web:lint
      - web:test
      - leaks
      - helm:lint
      - tofu:fmt
      - tofu:validate
    cmds:
      - task: backend:lint
      - task: backend:test
