[workspace]
resolver = "2"
members = ["crates/core", "crates/api", "crates/worker"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
iac-core = { path = "crates/core" }
iac-worker = { path = "crates/worker" }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "macros",
] }
object_store = { version = "0.14", features = ["aws"] }
uuid = { version = "1", features = ["v5", "v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
# Pinned per docs/scaling-architecture.md § Observability (2026-10-14).
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = "0.34"
thiserror = "2"
bytes = "1"
anyhow = "1"
futures = "0.3"
parking_lot = "0.12"
tokio-stream = { version = "0.1", features = ["sync"] }

[profile.release]
opt-level = 3
lto = "thin"
