apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: idol
  labels:
    app: backend
    app.kubernetes.io/part-of: idol-appreciation.club
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # image declares USER idol (non-numeric), so kubelet cannot verify
      # runAsNonRoot - the image's own USER enforces non-root.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: {{ include "idol-canvas.image" (dict "image" .Values.images.backend) }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: app-env
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
