apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: idol
  labels:
    app: backend
    app.kubernetes.io/part-of: idol-appreciation.club
  annotations:
    # Greppable scaling constraint marker — see docs/infra.md
    # "Scaling: the backend is single-writer" before touching replicaCount.
    idol.app/scaling: single-writer-required
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  # HPA owns the replica count when backend.autoscaling.enabled — the
  # field is omitted there so the HPA never fights the deployment.
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  # ⚠ Scaling gate: replicas MUST stay 1 until the PG advisory-lock chunk
  # path is in place (paint-order == seq guarantee; see docs/infra.md
  # "Scaling: the backend chunk writer"). RollingUpdate maxSurge=1
  # maxUnavailable=0 provides zero-downtime rollouts.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        # Release semver recorded for audit (the image itself stays
        # digest-pinned; GHCR tags are mutable — see chart/values.yaml).
        idol-appreciation.club/release-tag: {{ .Values.images.backend.tag | quote }}
    spec:
      # SSE connections are long-lived: axum graceful shutdown drains
      # in-flight requests and streams on SIGTERM; web clients reconnect
      # with exponential backoff (web/src/lib/sse.ts) when streams drop.
      terminationGracePeriodSeconds: 30
      # image declares USER idol (non-numeric), so kubelet cannot verify
      # runAsNonRoot - the image's own USER enforces non-root.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: {{ include "idol-canvas.image" (dict "image" .Values.images.backend "name" "backend") }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: REGISTRATION_APPROVAL_REQUIRED
              value: {{ .Values.backend.registrationApprovalRequired | quote }}
          envFrom:
            - secretRef:
                name: app-env
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
