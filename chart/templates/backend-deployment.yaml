apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: idol
  labels:
    app: backend
    app.kubernetes.io/part-of: idol-appreciation.club
  annotations:
    # Greppable scaling constraint marker — see docs/infra.md
    # "Scaling: the backend is single-writer" before touching replicaCount.
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  # HPA owns the replica count when backend.autoscaling.enabled — the
  # field is omitted there so the HPA never fights the deployment.
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  # Multi-writer safety rides the session-level PG advisory chunk locks
  # (chunks.rs; paint-order == seq guarantee — see docs/infra.md
  # "Scaling: the backend chunk writer"), so replica count is an
  # availability knob. RollingUpdate maxSurge=1 maxUnavailable=0 provides
  # zero-downtime rollouts.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        # Release semver recorded for audit (the image itself stays
        # digest-pinned; GHCR tags are mutable — see chart/values.yaml).
        idol-appreciation.club/release-tag: {{ .Values.images.backend.tag | quote }}
        # Manual restart marker (issue #120 mitigation): bumping this
        # annotation changes the pod template so `helm upgrade` rolls the
        # Deployment, clearing pool-connection holders without an image
        # change. Bump the timestamp, never hand-run kubectl against the
        # template.
        idol-appreciation.club/restarted-at: "2026-10-14T09:05:00Z"
    spec:
      # SSE connections are long-lived: axum graceful shutdown drains
      # in-flight requests and streams on SIGTERM; web clients reconnect
      # with exponential backoff (web/src/lib/sse.ts) when streams drop.
      terminationGracePeriodSeconds: 30
      # image declares USER idol (non-numeric), so kubelet cannot verify
      # runAsNonRoot - the image's own USER enforces non-root.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: {{ include "idol-canvas.image" (dict "image" .Values.images.backend "name" "backend") }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: REGISTRATION_APPROVAL_REQUIRED
              value: {{ .Values.backend.registrationApprovalRequired | quote }}
            - name: DATABASE_POOL_MAX
              # 15/pod x 2 replicas = 30 total, back under the managed
              # instance's connection ceiling. The 30 stopgap was sized
              # for ONE pod pre-#134; the pair (2x30) exhausted PG's
              # server slots and blocked deploys. Many-replica scale is
              # the pgbouncer/CNPG-pooler moment — park until then.
              value: "15"
          envFrom:
            - secretRef:
                name: app-env
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
