{{- if .Values.web.enabled }}
# Edge config lives in a ConfigMap so routing/TLS changes never need an
# image rebuild. Kept in sync with web/Caddyfile by deploy.yml before
# upgrade (chart/caddy/Caddyfile is the packaged copy).
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: idol
data:
  Caddyfile: |
{{ .Files.Get "caddy/Caddyfile" | indent 4 }}
{{- end }}
