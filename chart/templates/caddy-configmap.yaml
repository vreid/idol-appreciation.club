# Edge config lives in a ConfigMap so routing/TLS changes never need an
# image rebuild. THIS file is the source of truth (web/Caddyfile only
# covers the stock-caddy local-dev case): chart/caddy/Caddyfile is
# helm-templated with the object-storage coordinates the CertMagic
# storage module needs (deploy.yml injects endpoint/bucket per deploy).
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: idol
data:
  Caddyfile: |
{{ tpl (.Files.Get "caddy/Caddyfile") . | indent 4 }}
