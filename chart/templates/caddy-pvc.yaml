{{- if .Values.web.enabled }}
# Caddy's ACME account + issued certs must survive pod restarts: every
# restart otherwise re-runs ACME and burns Let's Encrypt duplicate-cert
# budget (5/week per FQDN).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
  namespace: idol
spec:
  accessModes: [ReadWriteOnce]
  {{- /* A bound PVC's storageClassName is immutable: emit the class the live
         claim was bound with (lookup); the chart-owned Delete-reclaim class
         applies to fresh installs/recreates only. */}}
  {{- $existing := lookup "v1" "PersistentVolumeClaim" "idol" "caddy-data" }}
  storageClassName: {{ if $existing }}{{ $existing.spec.storageClassName }}{{ else }}idol-caddy-data{{ end }}
  resources:
    requests:
      storage: 1Gi
{{- end }}
