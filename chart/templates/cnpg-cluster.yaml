{{- if .Values.cnpg.enabled }}
# CloudNativePG Cluster: 3 Postgres replicas, one per worker node
# (required pod anti-affinity; the worker floor is 3 — tofu/ var
# .node_count, bumped by `task cnpg:node-scale`).
#
# CRD instances have no offline kubeconform schema; the install task
# (`cnpg:cluster:install`) gates this with `kubectl apply --dry-run=server`
# before the real apply.
#
# Bootstrap/runtime split: the superuser secret is created once by
# `task cnpg:cluster:secret` with operator credentials; nothing here
# mints or embeds credentials. The application role and its password are
# re-created from the live app-env values by `task cnpg:cutover:restore`
# after initdb, so the DATABASE_URL swap changes the host only.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cnpg.clusterName }}
  namespace: idol
  labels:
    app.kubernetes.io/part-of: idol-appreciation.club
spec:
  imageName: {{ .Values.cnpg.imageName }}
  instances: 3
  superuserSecret:
    name: {{ .Values.cnpg.superuserSecretName }}
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: {{ .Values.cnpg.appDatabase }}
      # CNPG-native recreate (user ruling 2026-10-14: the pile is
      # disposable, no dump/restore stage): initdb creates the app role
      # itself and generates its password into the secret below — the
      # deploy task reads the same secret, so the DATABASE_URL swap at
      # first deploy is deterministic. As DB owner, the app role keeps
      # CREATE on schema public (the PG15 revocation hits PUBLIC only),
      # so backend migrations run clean on a fresh cluster.
      owner: app
      secret:
        name: cnpg-app-creds
  storage:
    size: {{ .Values.cnpg.storage.size }}
    storageClass: {{ .Values.cnpg.storage.storageClass }}
  resources:
    {{- toYaml .Values.cnpg.resources | nindent 4 }}
  affinity:
    podAntiAffinityType: required
  postgresql:
    parameters:
      # Shared 4 vCPU nodes; leave headroom for the app fleet.
      max_connections: "100"
      shared_buffers: "512MB"
  {{- if and .Values.cnpg.backup .Values.cnpg.backup.enabled }}
  {{- end }}
{{- end }}
