{{- if not .Values.web.enabled }}
# Bootstrap placeholder: becomes the EDGE LoadBalancer (plain HTTP) and
# serves a static page before the real web image exists. deploy.yml deletes
# these resources (kubectl delete --ignore-not-found) once web rolls on;
# infra workflows never apply this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placeholder
  namespace: idol
  labels:
    app: placeholder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: placeholder
  template:
    metadata:
      labels:
        app: placeholder
    spec:
      containers:
        - name: placeholder
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: placeholder
  namespace: idol
  annotations:
    service.beta.kubernetes.io/upcloud-load-balancer-config: >-
      {"plan":"essentials","frontends":[{"name":"http","port":80,"mode":"tcp"}],"backends":[{"name":"http","properties":{"health_check_type":"tcp","health_check_interval":10,"health_check_fall":3,"health_check_rise":3,"health_check_tls_verify":false}}]}
spec:
  type: LoadBalancer
  selector:
    app: placeholder
  ports:
    - name: http
      port: 80
      targetPort: 80
{{- end }}
