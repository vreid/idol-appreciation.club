{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: idol
  labels:
    app: web
spec:
  replicas: 1
  # Explicit zero-downtime roll: maxSurge 1 / maxUnavailable 0 means the
  # replacement pod must pass readiness before the old one terminates.
  # The caddy-data PVC is RWO, so the surged pod schedules on the volume's
  # node (UpCloud CSI pins the PV to one node) where same-node multi-pod
  # mounts are allowed — the roll either overlaps cleanly or the new pod
  # stays Pending (old pod keeps serving) until the node has capacity.
  # ACME certs live on the persistent PVC, so rolls do NOT re-run ACME.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
      annotations:
        # Release semver recorded for audit (the image itself stays
        # digest-pinned; GHCR tags are mutable — see chart/values.yaml).
        idol-appreciation.club/release-tag: {{ .Values.images.web.tag | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        # kubelet chowns the PVC root to this gid so uid 1000 (caddy)
        # can create /data/caddy.
        fsGroup: 1000
      volumes:
        - name: caddy-data
          persistentVolumeClaim:
            claimName: caddy-data
        - name: caddy-config
          configMap:
            name: caddy-config
      containers:
        - name: web
          image: {{ include "idol-canvas.image" (dict "image" .Values.images.web) }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          # Give kubelet time to propagate endpoint removal to the
          # UpCloud LB before caddy drains, so in-flight TLS connections
          # land on the surged pod.
          lifecycle:
            preStop:
              exec: ["sleep", "5"]
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          # caddy exec fails EPERM under drop:[ALL] + RuntimeDefault
          # seccomp (observed CrashLoopBackOff); keep non-root + no
          # privilege escalation, drop the rest.
          securityContext:
            allowPrivilegeEscalation: false
{{- end }}
