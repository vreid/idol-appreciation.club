# Keep at least one edge replica through voluntary disruptions (drains,
# descheduler): the edge terminates TLS for every viewer and stream.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: idol
  labels:
    app: web
spec:
  minAvailable: {{ .Values.web.pdb.minAvailable }}
  selector:
    matchLabels:
      app: web
