# Digests are injected by deploy.yml (helm --set-string) from the image
# build jobs; plain tags are the local-dev fallback only. On releases,
# deploy.yml also sets `tag` to the release semver: it is an AUDIT TRAIL
# (see the deployment annotations) and enables redeploy-by-tag
# (helm upgrade --set-string images.*.digest="" --set-string images.*.tag=vX.Y.Z).
# The DIGEST remains the source of truth for what actually runs: GHCR tags
# are mutable, digests are not.
images:
  backend:
    repository: ghcr.io/vreid/idol-appreciation.club-backend
    tag: main
    digest: ""
  web:
    repository: ghcr.io/vreid/idol-appreciation.club-web
    tag: main
    digest: ""

domain: idol-appreciation.club

backend:
  registrationApprovalRequired: true
  replicaCount: 1
  # Limits raised after OOMKilled (exit 137) under concurrent placement
  # load: libvips tile decoding spikes well past 1.5Gi with 6 placements
  # in flight.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 4
      memory: 2Gi

web:
  # false = bootstrap: placeholder Deployment+Service become a plain-HTTP
  # edge until the web image exists.
  enabled: true
  # Caddy edge: resources are tiny (static files + proxy).
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# UpCloud CCM load balancer config for the edge Service. TCP frontends with
# TCP health checks: the LB must NOT terminate TLS (Caddy owns ACME) and
# must not use the CCM's broken-by-default HTTP checks.
edgeLoadBalancer:
  plan: essentials
  healthCheck:
    type: tcp
    interval: 10
    fall: 3
    rise: 3
