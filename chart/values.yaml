# Digests are injected by deploy.yml (helm --set-string) from the image
# build jobs; plain tags are the local-dev fallback only. On releases,
# deploy.yml also sets `tag` to the release semver: it is an AUDIT TRAIL
# (see the deployment annotations) and enables redeploy-by-tag
# (helm upgrade --set-string images.*.digest="" --set-string images.*.tag=vX.Y.Z).
# The DIGEST remains the source of truth for what actually runs: GHCR tags
# are mutable, digests are not.
images:
  backend:
    repository: ghcr.io/vreid/idol-appreciation.club-backend
    tag: main
    digest: ""
  web:
    repository: ghcr.io/vreid/idol-appreciation.club-web
    tag: main
    digest: ""

domain: idol-appreciation.club

backend:
  registrationApprovalRequired: true
  replicaCount: 1
  # Requests sized for HPA math + scheduling; limits generous so parallel
  # chunk composites (libvips) never throttle: 6-way placement bursts
  # OOMKilled at the old 1536Mi limit (2026-10-13 soak).
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "4"
      memory: 2Gi

web:
  # false = bootstrap: placeholder Deployment+Service become a plain-HTTP
  # edge until the web image exists.
  enabled: true
  # Caddy edge: resources are tiny (static files + proxy).
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# UpCloud CCM load balancer config for the edge Service. TCP frontends with
# TCP health checks: the LB must NOT terminate TLS (Caddy owns ACME) and
# must not use the CCM's broken-by-default HTTP checks.
edgeLoadBalancer:
  plan: essentials
  healthCheck:
    type: tcp
    interval: 10
    fall: 3
    rise: 3

# Backend HPA — shipped DISABLED. Flipping it on is gated on the
# advisory-locks PR validating replicas=2 (single-writer invariant until
# then; the HPA must never scale past 1 before that lands).
backendAutoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 65
  # 5m scale-down window: cold tile renders / prewarm bursts spike CPU
  # briefly; don't flap the replica count on synthetic noise.
  scaleDownStabilizationSeconds: 300

# Node autoscaler: UpCloud managed k8s has NO native node-group min/max
# (API PATCH accepts only "count"), so this CronJob owns the count between
# nodeAutoscaler.minNodes..maxNodes by calling the UpCloud API. It needs the
# UPCLOUD_API_TOKEN in secret upcloud-creds (created by deploy.yml).
nodeAutoscaler:
  enabled: true
  image: alpine/k8s:1.33.8
  schedule: "* * * * *"
  minNodes: 1
  maxNodes: 2
  clusterUuid: "0d4c74ac-96bc-49aa-bbc4-7461708adb1d"
  nodeGroup: "default"
  # Scale down only after the newest node is this old and this idle.
  scaleDownAfterMinutes: 15
  scaleDownMaxCpuPercent: 25
