# Digests are injected by deploy.yml (helm --set-string) from the image
# build jobs; plain tags are the local-dev fallback only. On releases,
# deploy.yml also sets `tag` to the release semver: it is an AUDIT TRAIL
# (see the deployment annotations) and enables redeploy-by-tag
# (helm upgrade --set-string images.*.digest="" --set-string images.*.tag=vX.Y.Z).
# The DIGEST remains the source of truth for what actually runs: GHCR tags
# are mutable, digests are not.
images:
  backend:
    repository: ghcr.io/vreid/idol-appreciation.club-backend
    tag: main
    digest: ""
  web:
    repository: ghcr.io/vreid/idol-appreciation.club-web
    tag: main
    digest: ""
  # Custom Caddy edge build (caddy/Dockerfile): cache-handler +
  # CertMagic S3 storage. Used as the initContainer that donates the
  # custom binary to the web image (web/Dockerfile is untouched); the
  # digest is locked by images.yml like backend/web.
  caddy:
    repository: ghcr.io/vreid/idol-appreciation.club-caddy
    tag: main
    digest: ""

domain: idol-appreciation.club

backend:
  registrationApprovalRequired: true
  # Phase 3 render pipeline (docs/scaling-architecture.md): dark by
  # default. Staged cutover (docs/backend.md): set renderPipelineWorkers
  # > 0 FIRST so workers burn the pre-seeded queue while the request
  # path still composites; flip renderPipelineEnabled last (place/remove
  # go queue-only). Workers spawn per pod: 2/pod x 2 pods = 4 claims.
  renderPipelineEnabled: true
  # Cutover stage 2 (2026-10-15): workers burn the pre-seeded chunk
  # backlog (30.7k repaints) while the request path still composites.
  # Stage 3 flips renderPipelineEnabled last.
  renderPipelineWorkers: 2
  # Phase 4 ingest pipeline (docs/scaling-architecture.md "Upload
  # flow"): 202 quarantine placements + the in-process ingest consumer
  # (docs/backend.md "The ingest pipeline"). Ships dark; the consumer
  # queues render jobs, so this flips LAST — after the render pipeline
  # is verified end-to-end.
  ingestPipelineEnabled: false
  # Two replicas: zero-blip rolls (surge pod ready before the old one
  # drains) and half the blast radius per pod. Multi-writer safety rides
  # the session-level PG advisory chunk locks (chunks.rs), not the replica
  # count. HPA stays off — the CPU signal does not match the actual
  # bottleneck (pool/latency, issue #120); revisit after it lands.
  replicaCount: 2
  # HPA support, STAGED OFF: the CPU signal does not match the real
  # bottleneck. Order and caveats: docs/infra.md "Scaling".
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 65
    # 5m scale-down stabilization; upscale is immediate.
    stabilizationWindowSeconds: 300
  # Requests sized for HPA math + scheduling; limits generous so parallel
  # chunk composites (libvips) never throttle: 6-way placement bursts
  # OOMKilled at the old 1536Mi limit (2026-10-13 soak).
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "4"
      memory: 2Gi

web:
  # Two+ edge replicas: TLS certificates and ACME state live in object
  # storage (edgeStorage below), so the old RWO-PVC single-mount
  # constraint is gone and replicas spread across nodes. Every replica
  # keeps its own in-memory tile cache; ACME renewal is coordinated
  # through the storage lock (docs/scaling-architecture.md, "Caddy,
  # horizontally").
  replicas: 3
  # One edge per baseline node through drains and voluntary disruptions
  # (descheduler included); with 3 replicas this keeps 2 serving during
  # any single disruption.
  pdb:
    minAvailable: 2
  # Spread edge replicas across nodes; ScheduleAnyway because the
  # baseline also hosts PG + API pods (soft preference, never a block).
  topologySpread:
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  # Static files + proxy + the in-memory tile cache: the cache is the
  # big term (~4000 tiles x ~60 KB worst case, chart/caddy/Caddyfile
  # otter size); the rest is per-stream buffers. Sized from loadtest
  # #163 verdict 2 (2026-10-15): 1Gi passed the 500-conn ramp (plateau
  # 831-855Mi) but the 5k ramp OOM'd both pods by ~1-2k streams — the
  # round goes HORIZONTAL (3 replicas across the 3 baseline nodes) with
  # 1.5Gi per edge. CPU request yields to 1C (see the PR math): the
  # failure mode was memory, the limit keeps 2.5C of burst headroom.
  resources:
    requests:
      cpu: 1
      memory: 1.5Gi
    limits:
      cpu: 2500m
      memory: 1.5Gi

# Descheduler (phase 5, salvage of the cancelled #206 retune): rebalances
# the baseline pool; the worker pool stays with the Cluster Autoscaler.
# CloudNativePG instances are protected through their PVC (PodsWithPVC)
# and their PDB. DEFAULT OFF — flip `descheduler.enabled` to roll it;
# the nodeSelector must match the kubelet label the live baseline group
# carries (`pool=baseline-new`, not the retune's never-created
# `pool=baseline`).
descheduler:
  enabled: false
  nodeSelector: "pool=baseline-new"

# Object storage for the edge's certificates and ACME state (CertMagic
# storage module; chart/caddy/Caddyfile `storage s3` block). Endpoint
# and bucket are injected by deploy.yml on every deploy (the UpCloud API
# is the source of truth, as for app-env); credentials are NOT part of
# the ConfigMap — the module falls back to the AWS_ standard chain and
# the Deployment maps them from the existing app-env secret. Prefix is
# repo-static so the same objects are found after a recreate.
edgeStorage:
  endpoint: ""
  bucket: ""
  prefix: caddy-acme

# UpCloud CCM load balancer config for the edge Service. TCP frontends with
# TCP health checks: the LB must NOT terminate TLS (Caddy owns ACME) and
# must not use the CCM's broken-by-default HTTP checks.
edgeLoadBalancer:
  plan: essentials
  healthCheck:
    type: tcp
    interval: 10
    fall: 3
    rise: 3

# Cluster Autoscaler, UpCloud cloud-provider build. UpCloud managed
# Kubernetes has NO native node-group min/max autoscaling — the 1.3 API
# and provider v5.47.0 expose only a fixed count (`node_count`) — so
# scaling is done by CA in-cluster PATCHing the node-group count within
# the --nodes=min:max bounds. Rationale and flip order:
# docs/infra.md "Scaling".
clusterAutoscaler:
  # staged: flip only together with (after) the backend HPA gate. The
  # deploy workflow provisions the upcloud-autoscaler secret and passes
  # clusterId on every deploy, so enabling this is a values-only change.
  enabled: false
  # Cluster uuid; injected by deploy.yml (--set-string). Unused while
  # enabled is false.
  clusterId: ""
  # Two bounds, one --nodes flag each (docs/scaling-architecture.md
  # "Cluster layout"): the baseline `default` group is floored at 3 by
  # the CNPG anti-affinity (one instance per node), the tainted worker
  # pool scales 0..4 with the render queue.
  nodeGroup: default
  minSize: 3
  maxSize: 4
  workerNodeGroup: workers
  workerMinSize: 0
  workerMaxSize: 4
  scaleDownEnabled: true
  # Digest pins tag v1.29.5 (verified anonymously pullable from GHCR,
  # 2026-10-13); a mutable tag is not acceptable for a component that
  # adds and removes nodes.
  image: ghcr.io/upcloudltd/autoscaler@sha256:54aa2662c57e58961080436bb27e70c3a9670ec582001ffd36a6573649de35c5

# Render/ingest worker pool — the Phase 4 <-> Phase 5 contract.
#
# Phase 4 owns the worker Deployment; Phase 5 owns the pool it runs on
# (tofu/ var.worker_*: 1 vCPU / 2 GiB nodes, tainted
# dedicated=worker:NoSchedule, label pool=worker) and the autoscaling
# scaffolding. CONTRACT the Phase 4 worker Deployment must satisfy for
# the ScaledObject below to drive it:
#   - metadata.name == worker.deploymentName (default "worker")
#   - env DATABASE_URL, pointing at idol-db-rw (job claims are primary-
#     only; KEDA reads this var from the scale target's pod spec)
#   - toleration for dedicated=worker:NoSchedule
#   - requests ~800m CPU / 1.2Gi memory — one libvips pod per node
#     (docs/scaling-architecture.md "Cluster layout")
# Flip worker.autoscaling.enabled only after KEDA is installed
# (`task keda:operator:install`) and the render_jobs table + worker
# Deployment exist (Phase 3/4).
worker:
  deploymentName: worker
  autoscaling:
    enabled: false
    # KEDA polls Postgres this often (queue depth is cheap to read).
    pollingInterval: 5
    # Keep finished-job nodes billing only as long as needed; idle
    # nodes are removed by the Cluster Autoscaler afterwards.
    cooldownPeriod: 300
    minReplicas: 0
    # Never above clusterAutoscaler.workerMaxSize: past that, pods stay
    # Pending forever (no node can join).
    maxReplicas: 4
    # One replica per pending render job — libvips pipelines are
    # single-threaded, so a pod adds no throughput while one job runs.
    targetPendingJobs: 1
    activationTargetPendingJobs: 1

# CloudNativePG (migration off the managed 1-CPU Postgres; staged).
# Operator install is NOT chart-managed: the pinned upstream manifest
# lives at chart/cnpg/cnpg-operator-1.29.3.yaml and is applied by
# `task cnpg:operator:install` (one-time bootstrap with operator
# credentials, not a deploy-side step). The Cluster CR below ships in
# the chart so its shape is lint-gated, but stays disabled until the
# cutover flips it; kubeconform skips CRD instances (no offline
# schema) — the install task dry-runs server-side instead.
cnpg:
  enabled: false
  # Cluster CR name; the -rw/-ro/-r services derive from it.
  clusterName: idol-db
  # Digest pin resolved from ghcr.io/cloudnative-pg/postgresql:16-bookworm
  # (HEAD manifest via GHCR API, 2026-10-14). Mutable tags are not
  # acceptable for the database.
  imageName: ghcr.io/cloudnative-pg/postgresql:16-bookworm
  # Created once by `task cnpg:cluster:secret` (openssl rand, operator
  # creds) — never minted deploy-side.
  superuserSecretName: cnpg-pg-superuser
  appDatabase: idol-canvas
  # Backups (docs/scaling-architecture.md, BINDING before any managed-DB
  # retirement): WAL archiving + base backups to the app's object storage
  # via the Barman Cloud plugin. Credentials are NOT minted here:
  # cnpg:backup:secret copies the live S3 keys + endpoint into
  # cnpg-backup-s3 (bootstrap/runtime split).
  backup:
    # ON: the barman plugin (sidecar + ObjectStore) installs with the
    # cluster render; backups bind before the reseed pile lands.
    enabled: true
    destinationPath: s3://idol-canvas/cnpg-backups
    endpointSecretName: cnpg-backup-s3
    compression: gzip
  storage:
    # Chart-owned class (cnpg-storageclass.yaml): Delete-reclaim like
    # caddy-data, so recreate cycles never orphan disks again.
    storageClass: idol-pg-data
    size: 5Gi
  resources:
    requests:
      cpu: 500m
      memory: 1.5Gi
    limits:
      cpu: "2"
      # Request EQUALS the memory limit (2026-10-15 decision, salvage of
      # the cancelled #206 retune): a busy instance must not starve the
      # pods sharing its node — no memory overcommit on the baseline.
      # Headroom checked against loadtest #163: primary peaked 1001MiB.
      memory: 1.5Gi

# OpenTelemetry Collector (contrib) as a DaemonSet — the doc's Phase 1
# observability piece. Off by default (config-gated like the app's
# OTEL_EXPORTER_OTLP_ENDPOINT: unset collector = zero behavior change).
# Exports to stdout only until a telemetry backend is chosen (the doc's
# open question); receipts come from the receiver paths working.
telemetry:
  collector:
    enabled: false
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.116.0
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 192Mi }
