# Digests are injected by deploy.yml (helm --set-string) from the image
# build jobs; plain tags are the local-dev fallback only. On releases,
# deploy.yml also sets `tag` to the release semver: it is an AUDIT TRAIL
# (see the deployment annotations) and enables redeploy-by-tag
# (helm upgrade --set-string images.*.digest="" --set-string images.*.tag=vX.Y.Z).
# The DIGEST remains the source of truth for what actually runs: GHCR tags
# are mutable, digests are not.
images:
  backend:
    repository: ghcr.io/vreid/idol-appreciation.club-backend
    tag: main
    digest: ""
  web:
    repository: ghcr.io/vreid/idol-appreciation.club-web
    tag: main
    digest: ""

domain: idol-appreciation.club

backend:
  registrationApprovalRequired: true
  replicaCount: 1
  # HPA support, STAGED OFF behind a hard gate: the backend is a single
  # writer (PG advisory locks unvalidated at >1 replica) — flip only
  # after the advisory-lock PR lands and replicas=2 is soak-validated.
  # Order and caveats: docs/infra.md "Scaling".
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 65
    # 5m scale-down stabilization; upscale is immediate.
    stabilizationWindowSeconds: 300
  # Requests sized for HPA math + scheduling; limits generous so parallel
  # chunk composites (libvips) never throttle: 6-way placement bursts
  # OOMKilled at the old 1536Mi limit (2026-10-13 soak).
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "4"
      memory: 2Gi

web:
  # false = bootstrap: placeholder Deployment+Service become a plain-HTTP
  # edge until the web image exists.
  enabled: true
  # Caddy edge: resources are tiny (static files + proxy).
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# UpCloud CCM load balancer config for the edge Service. TCP frontends with
# TCP health checks: the LB must NOT terminate TLS (Caddy owns ACME) and
# must not use the CCM's broken-by-default HTTP checks.
edgeLoadBalancer:
  plan: essentials
  healthCheck:
    type: tcp
    interval: 10
    fall: 3
    rise: 3

# Cluster Autoscaler, UpCloud cloud-provider build. UpCloud managed
# Kubernetes has NO native node-group min/max autoscaling — the 1.3 API
# and provider v5.47.0 expose only a fixed count (`node_count`) — so
# scaling is done by CA in-cluster PATCHing the node-group count within
# the --nodes=min:max bounds. Rationale and flip order:
# docs/infra.md "Scaling".
clusterAutoscaler:
  # staged: flip only together with (after) the backend HPA gate. The
  # deploy workflow provisions the upcloud-autoscaler secret and passes
  # clusterId on every deploy, so enabling this is a values-only change.
  enabled: false
  # Cluster uuid; injected by deploy.yml (--set-string). Unused while
  # enabled is false.
  clusterId: ""
  # worker node group managed by tofu (tofu/ var.node_group_name).
  nodeGroup: default
  minSize: 1
  maxSize: 2
  scaleDownEnabled: true
  image: ghcr.io/upcloudltd/autoscaler:v1.29.5
