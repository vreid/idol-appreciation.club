apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: idol
  labels:
    app: backend
    app.kubernetes.io/part-of: idol-appreciation.club
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # image declares USER idol (non-numeric), so kubelet cannot verify
      # runAsNonRoot - the image's own USER enforces non-root.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/vreid/idol-appreciation.club-backend:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: app-env
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: idol
  labels:
    app: backend
spec:
  # ClusterIP: north-south traffic goes through ingress-nginx, whose own
  # Service is the UpCloud LoadBalancer (see deploy/README note in docs).
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: http
