apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: idol
  labels:
    app: backend
    app.kubernetes.io/part-of: idol-appreciation.club
spec:
  # Chunk-raster mutation is cross-instance safe (PG session advisory locks
  # around the chunk GET→composite→PUT window, sorted-key acquisition).
  # Raise above 1 only after validating at 2: tile-cache hit rates and PG
  # pool behavior under advisory-lock waits are unproven multi-replica.
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # image declares USER idol (non-numeric), so kubelet cannot verify
      # runAsNonRoot - the image's own USER enforces non-root.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/vreid/idol-appreciation.club-backend:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: app-env
          env:
            # libvips sizes its per-pipeline threadpool to the host core
            # count by default (4 here). Concurrent composites then
            # oversubscribe: two placements = 8 vips threads on 4 cores,
            # starving tile serving (observed in the N=2 soak: tile
            # empty-path mean 0.94s vs 19ms). Cap each pipeline at 2
            # threads so aggregate composite load stays near one core and
            # leaves headroom for the tokio/serving paths. Upstream:
            # libvips "using-threads" (default = ncpus) and maintainer
            # guidance in libvips discussion #4063 — threadpools are per
            # evaluation pipeline, so concurrent pipelines multiply the
            # setting; VIPS_CONCURRENCY bounds it process-wide.
            - name: VIPS_CONCURRENCY
              value: "2"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: idol
  labels:
    app: backend
spec:
  # ClusterIP: north-south traffic goes through ingress-nginx, whose own
  # Service is the UpCloud LoadBalancer (see deploy/README note in docs).
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: http
