apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: idol
  labels:
    app: web
    app.kubernetes.io/part-of: idol-appreciation.club
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: ghcr.io/vreid/idol-appreciation.club-web:main
          imagePullPolicy: Always
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8443
              name: https
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          # caddy exec fails EPERM under drop:[ALL] + RuntimeDefault
          # seccomp (observed CrashLoopBackOff); keep non-root + no
          # privilege escalation, drop the rest.
          securityContext:
            allowPrivilegeEscalation: false
---
# Caddy-direct edge: this Service is THE LoadBalancer. Caddy terminates
# TLS (8443) with its own Let's Encrypt cert (HTTP-01 via the 80->8080
# mapping) and proxies /api to the backend service.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: idol
  labels:
    app: web
  annotations:
    service.beta.kubernetes.io/upcloud-load-balancer-config: >-
      {"plan":"essentials","frontends":[{"name":"http","port":80,"mode":"tcp"},{"name":"https","port":443,"mode":"tcp"}],"backends":[{"name":"http","properties":{"health_check_type":"tcp","health_check_interval":10,"health_check_fall":3,"health_check_rise":3,"health_check_tls_verify":false}},{"name":"https","properties":{"health_check_type":"tcp","health_check_interval":10,"health_check_fall":3,"health_check_rise":3,"health_check_tls_verify":false}}]}
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: https
      port: 443
      targetPort: 8443
