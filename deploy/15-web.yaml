apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: idol
  labels:
    app: web
    app.kubernetes.io/part-of: idol-appreciation.club
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
        # kubelet chowns the PVC root to this gid so uid 1000 (caddy)
        # can create /data/caddy.
        fsGroup: 1000
      volumes:
        - name: caddy-data
          persistentVolumeClaim:
            claimName: caddy-data
        - name: caddy-config
          configMap:
            name: caddy-config
      containers:
        - name: web
          image: ghcr.io/vreid/idol-appreciation.club-web:main
          imagePullPolicy: Always
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8443
              name: https
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          # caddy exec fails EPERM under drop:[ALL] + RuntimeDefault
          # seccomp (observed CrashLoopBackOff); keep non-root + no
          # privilege escalation, drop the rest.
          securityContext:
            allowPrivilegeEscalation: false
---
# Edge config lives in a ConfigMap so routing/TLS changes never need an
# image rebuild. Kept in sync with web/Caddyfile (the image's baked-in
# default for bare-container runs).
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: idol
data:
  Caddyfile: |
    {
    	http_port 8080
    	https_port 8443
    }
    
    idol-appreciation.club {
    	encode zstd gzip
    	root * /usr/share/caddy
    
    	# route preserves written order: proxy /api BEFORE try_files can
    	# rewrite it to index.html. SSE: flush_interval -1 keeps events live.
    	route {
    		reverse_proxy /api/* backend.idol.svc.cluster.local:80 {
    			flush_interval -1
    		}
    
    		@immutable path /assets/*
    		header @immutable Cache-Control "public, max-age=31536000, immutable"
    
    		@index path / /index.html
    		header @index Cache-Control "no-cache"
    
    		try_files {path} /index.html
    		file_server
    	}
    }
    
    # www -> apex
    www.idol-appreciation.club {
    	redir https://idol-appreciation.club{uri} permanent
    }
---
# Caddy's ACME account + issued certs must survive pod restarts: every
# restart otherwise re-rans ACME and burns Let's Encrypt duplicate-cert
# budget (5/week per FQDN).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
  namespace: idol
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: upcloud-block-storage-standard
  resources:
    requests:
      storage: 1Gi
---
# Caddy-direct edge: this Service is THE LoadBalancer. Caddy terminates
# TLS (8443) with its own Let's Encrypt cert (HTTP-01 via the 80->8080
# mapping) and proxies /api to the backend service.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: idol
  labels:
    app: web
  annotations:
    service.beta.kubernetes.io/upcloud-load-balancer-config: >-
      {"plan":"essentials","frontends":[{"name":"http","port":80,"mode":"tcp"},{"name":"https","port":443,"mode":"tcp"}],"backends":[{"name":"http","properties":{"health_check_type":"tcp","health_check_interval":10,"health_check_fall":3,"health_check_rise":3,"health_check_tls_verify":false}},{"name":"https","properties":{"health_check_type":"tcp","health_check_interval":10,"health_check_fall":3,"health_check_rise":3,"health_check_tls_verify":false}}]}
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: https
      port: 443
      targetPort: 8443
