apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
  labels:
    app.kubernetes.io/part-of: idol-appreciation.club
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@idol-appreciation.club
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
